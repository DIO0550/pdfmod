<title>PR 解説</title>
<style>
:root {
  --text-scale: 1;
  --bg: #F6F5F1;
  --panel: #FBFAF7;
  --surface: #FFFFFF;

  --tok-num: #1F6F8B;
  --tok-com: #7E828A;
  --tok-fn: #1F4FA3;
  --tok-key: #1F6F8B;

  --shadow-raised: 0 1px 2px rgba(29, 31, 36, .10);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: calc(16px * var(--text-scale)); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
.mono { font-family: var(--mono); }
.app { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; min-height: 52px; min-width: 0; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 20; white-space: nowrap; }
.repo { max-width: 100%; overflow-wrap: anywhere; white-space: normal; font-family: var(--mono); font-weight: 600; font-size: calc(14px * var(--text-scale)); flex: none; }
.segmented { display: flex; flex-wrap: wrap; min-width: 0; max-width: 100%; gap: 2px; padding: 2px; background: var(--track); border-radius: 8px; flex: 0 1 auto; }
/* タブの横の余白は 10px。12px だと、1280px でテストの画面の操作が 2 段目に落ちる。 */
.segmented a { padding: 5px 10px; border-radius: 6px; font-size: calc(12px * var(--text-scale)); font-weight: 500; color: var(--ink-2); text-decoration: none; }
.segmented a:hover { color: var(--ink); background: rgba(255, 255, 255, .6); }
.segmented a[aria-current="page"] { font-weight: 600; color: var(--ink); background: var(--surface); box-shadow: var(--shadow-raised); }
/* 折り返すかどうかは基準の 240px で決め、足りない分はブランチ名を省いて詰める。auto だと、240px を超えるブランチ名の長さで段の数が変わる。 */
.top-main { display: flex; align-items: center; gap: 10px; min-width: min(240px, 100%); flex: 1 1 240px; overflow: hidden; }
.branch { display: block; font-family: var(--mono); font-size: calc(12px * var(--text-scale)); font-weight: 500; color: var(--ink-2); background: var(--chip); border-radius: 6px; padding: 4px 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.branch .arrow { color: var(--ink-3); margin: 0 6px; }
.screen-summary { display: flex; flex: none; }
.counts { display: flex; gap: 8px; font-family: var(--mono); font-size: calc(12px * var(--text-scale)); flex: none; }
.counts .total { color: var(--ink-2); }
.add { color: var(--add); }
.del { color: var(--del); }
.screen-controls { display: flex; flex-wrap: wrap; min-width: 0; max-width: 100%; align-items: center; gap: 12px; flex: none; }
.hint { font-size: calc(11px * var(--text-scale)); color: var(--ink-3); }
.links { display: flex; gap: 12px; font-size: calc(12px * var(--text-scale)); flex: none; }
/* 図の倍率とは別に、ページの文字を調整する。操作は狭い幅でも折り返す。 */
.text-size-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; max-width: 100%; }
.text-size-label { font-size: calc(11px * var(--text-scale)); color: var(--ink-2); }
.text-size-controls button { min-height: 32px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; font-size: calc(12px * var(--text-scale)); background: var(--surface); color: var(--ink); cursor: pointer; }
.text-size-controls button:hover:not(:disabled) { background: var(--hover); border-color: var(--ink-4); }
.text-size-controls button:disabled { color: var(--ink-3); cursor: default; }
.text-size-value { min-width: 4ch; font-family: var(--mono); font-size: calc(12px * var(--text-scale)); text-align: center; }
.bands { display: flex; flex-direction: column; }
.band { padding: 7px 14px; font-size: calc(12px * var(--text-scale)); line-height: 1.6; color: var(--mod); background: var(--warn-tint); border-bottom: 1px solid var(--line); white-space: normal; }
.screens { min-height: 0; position: relative; }
.screen { height: 100%; display: grid; min-height: 0; }
.screen[hidden] { display: none; }
.panel { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.panel.is-left { border-right: 1px solid var(--line); }
.panel.is-right { border-left: 1px solid var(--line); }
.panel-head { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 8px; white-space: nowrap; }

.panel.is-left .resize-handle { right: -5px; }

.resize-handle.is-dragging .resize-bar { background: var(--accent); }
.stage { overflow: auto; min-width: 0; }
.stage-body { max-width: 1160px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 36px) 96px; display: flex; flex-direction: column; gap: 30px; }
.eyebrow { font-size: calc(11px * var(--text-scale)); font-weight: 600; color: var(--ink-3); letter-spacing: .06em; }
.lede { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.lede h1 { margin: 0; font-size: calc(26px * var(--text-scale)); font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.lede p { margin: 0; font-size: calc(14.5px * var(--text-scale)); line-height: 1.85; text-wrap: pretty; }
.panel-scroll > .empty { margin: 0 12px; }
.empty { padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--surface); font-size: calc(13px * var(--text-scale)); line-height: 1.75; color: var(--ink-2); }
.section { display: flex; flex-direction: column; gap: 10px; }
.behaviors { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.behavior-card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); }
.behavior-card.is-after { border-color: var(--line-strong); background: var(--surface); }
.behavior-card .card-title { font-size: calc(12px * var(--text-scale)); font-weight: 600; color: var(--ink-2); }
.behavior-card.is-after .card-title { color: var(--ink); }
.row { display: flex; flex-direction: column; gap: 3px; margin: 0 8px; padding: 8px 12px; border-radius: 8px; min-width: 0; }
.row:hover { outline: 1px solid var(--line); }
.row.is-current { background: var(--accent-tint); box-shadow: inset 0 0 0 1px var(--accent-ring), 0 0 16px var(--accent-glow); }
.row-title { font-size: calc(13px * var(--text-scale)); font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
.row-sub { font-size: calc(11.5px * var(--text-scale)); color: var(--ink-2); }
.row-meta { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: calc(11px * var(--text-scale)); white-space: nowrap; color: var(--ink-3); }
.row-meta .sha { color: var(--ink-2); }
.commit-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; margin: 0 8px; padding: 10px 12px 10px 8px; border-radius: 8px; }
.commit-row:hover { outline: 1px solid var(--line); }
.commit-rail { position: relative; }
.commit-rail::before { content: ""; position: absolute; left: 8px; top: -12px; bottom: -12px; border-left: 1.5px solid var(--line-strong); }
.commit-list { display: flex; flex-direction: column; gap: 2px; }
.commit-list > .commit-row:first-child .commit-rail::before { top: 11px; }
.commit-list > .commit-row:last-child .commit-rail::before { bottom: calc(100% - 11px); }
.commit-dot { position: absolute; left: 3px; top: 5px; width: 12px; height: 12px; border-radius: 6px; background: var(--surface); border: 2px solid var(--ink-4); }
.commit-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: calc(10.5px * var(--text-scale)); color: var(--ink-2); background: var(--track); border-radius: 4px; padding: 1px 6px; }
.tag.is-warn { font-weight: 600; color: var(--mod); background: var(--warn-tint); }
.status { font-family: var(--mono); font-size: calc(10px * var(--text-scale)); font-weight: 600; text-align: center; color: var(--ink-3); }
.status[data-status="A"] { color: var(--add); }
.status[data-status="M"], .status[data-status="R"] { color: var(--mod); }
.status[data-status="D"] { color: var(--del); }
.guide { max-width: 640px; margin: 12vh auto 0; padding: 28px 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.guide h1 { margin: 0; font-size: calc(20px * var(--text-scale)); font-weight: 600; }
.guide p { margin: 0; font-size: calc(14px * var(--text-scale)); line-height: 1.8; color: var(--ink-2); }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--chip); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.spacer { flex: 1; }
.muted { color: var(--ink-3); }
.plain-button { border: none; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.row.overview-row { margin: 0 8px 6px; padding: 10px 12px; }
.row.overview-row .row-title { font-weight: 600; }
.commit-row { width: calc(100% - 16px); }
.commit-row.is-current, .row.is-current { background: var(--accent-tint); box-shadow: inset 0 0 0 1px var(--accent-ring), 0 0 16px var(--accent-glow); }
.commit-row.is-current .commit-dot { background: var(--accent); border-color: var(--accent); }
[data-phase="prep"] { color: var(--ink-2); }
[data-phase="core"] { color: var(--tok-fn); }
[data-phase="hard"] { color: var(--mod); }
[data-phase="revise"] { color: var(--tok-kw); }
[data-phase="fin"] { color: var(--add); }
.card-head { display: flex; align-items: baseline; gap: 8px; }

.order { display: flex; flex-direction: column; }

.order-rail { position: relative; display: flex; justify-content: center; }
.order-rail::before { content: ""; position: absolute; top: 0; bottom: 0; border-left: 1.5px solid var(--line-strong); }
.order > .order-step:first-child .order-rail::before { top: 24px; }
.order > .order-step:last-child .order-rail::before { bottom: calc(100% - 24px); }
.order-num { position: relative; margin-top: 12px; width: calc(26px * var(--text-scale)); height: calc(26px * var(--text-scale)); border-radius: 13px; background: var(--surface); border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: calc(11.5px * var(--text-scale)); font-weight: 600; }
.order-body { display: flex; flex-direction: column; gap: 3px; padding: 12px 0 14px; min-width: 0; }
.order-role { font-size: calc(12px * var(--text-scale)); font-weight: 600; }
.order-subject { font-size: calc(14.5px * var(--text-scale)); font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
.order-why { font-size: calc(13px * var(--text-scale)); line-height: 1.75; color: var(--ink-2); text-wrap: pretty; }
.order-meta { font-family: var(--mono); font-size: calc(11px * var(--text-scale)); color: var(--ink-3); }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.toggle-group { display: flex; flex-wrap: wrap; max-width: 100%; gap: 2px; padding: 2px; background: var(--track); border-radius: 8px; }
.toggle-group button { border: none; cursor: pointer; white-space: nowrap; padding: 4px 10px; border-radius: 6px; font-size: calc(12px * var(--text-scale)); font-weight: 500; background: transparent; color: var(--ink-2); }
.toggle-group button[aria-pressed="true"] { font-weight: 600; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-raised); }
.toggle-group .n { font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); opacity: .6; margin-left: 4px; }
.review-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; user-select: none; transition: border-color .15s, background .15s; }
.review-card:hover { border-color: var(--ink-4); }
.review-card.is-checked { background: var(--panel); }
.review-card.is-checked .review-text { color: var(--ink-3); }
.check-box { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 5px; border: 1.5px solid var(--ink-4); background: var(--surface); display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
.is-checked .check-box { background: var(--accent); border-color: var(--accent); }
.is-checked .check-box::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid #FFFFFF; border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); }
.review-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.review-text { font-size: calc(13.5px * var(--text-scale)); line-height: 1.7; text-wrap: pretty; }
.review-go { align-self: flex-start; padding: 0; font-size: calc(11.5px * var(--text-scale)); color: var(--accent); }
.commit-head { display: flex; flex-direction: column; gap: 12px; }
.commit-facts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: calc(12px * var(--text-scale)); color: var(--ink-2); }
.sha-chip { font-family: var(--mono); font-weight: 600; color: var(--ink); background: var(--track); border-radius: 5px; padding: 2px 7px; }
.step-buttons { display: flex; gap: 6px; }
.step-buttons button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 5px 10px; font-size: calc(12px * var(--text-scale)); cursor: pointer; color: var(--ink); }
.step-buttons button:hover { border-color: var(--ink-4); }
.step-buttons button:disabled { opacity: .4; cursor: default; }
.commit-step { display: flex; align-items: center; gap: 8px; font-size: calc(11.5px * var(--text-scale)); font-weight: 600; }
.commit-head h1 { margin: 0; font-size: calc(24px * var(--text-scale)); font-weight: 600; line-height: 1.4; text-wrap: pretty; overflow-wrap: anywhere; }
.commit-message { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: 10px; font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); line-height: 1.7; color: #3A3D44; white-space: pre-wrap; word-break: break-word; }
.why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 28px; align-items: start; }
.why-text { margin: 0; font-size: calc(14.5px * var(--text-scale)); line-height: 1.9; text-wrap: pretty; }
.flow-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.flow-chips .label { font-size: calc(11.5px * var(--text-scale)); color: var(--ink-3); }
.flow-chip { display: flex; align-items: center; gap: 4px; font-size: calc(12px * var(--text-scale)); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 10px; }
.flow-chip:hover { color: var(--ink); border-color: var(--ink-4); text-decoration: none; }
.flow-chip .arrow { color: var(--ink-3); }
.behavior-item { display: flex; gap: 8px; font-size: calc(13.5px * var(--text-scale)); line-height: 1.7; }

.behavior-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.behavior-none { font-size: calc(13px * var(--text-scale)); color: var(--ink-3); }
.message-chip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

[data-kind="qry"] { --kind-bg: #EEE8FA; --kind-line: #D2C4F0; --kind-ink: #55369F; }
[data-kind="evt"] { --kind-bg: #FDEBD6; --kind-line: #F2C690; --kind-ink: #8A4307; }
.kind[data-kind], .label-chip[data-kind] { background: var(--kind-bg); border-color: var(--kind-line); color: var(--kind-ink); }
.message-name { font-size: calc(12px * var(--text-scale)); font-weight: 600; }
.behavior-card:not(.is-after) .message-name { font-weight: 500; text-decoration: line-through; color: var(--ink-2); }
.message-route { font-size: calc(11.5px * var(--text-scale)); color: var(--ink-3); }
.code-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.code-head .hint { font-size: calc(11.5px * var(--text-scale)); }
.text-button { padding: 2px 4px; font-size: calc(12px * var(--text-scale)); color: var(--ink-2); }
.text-button:hover { color: var(--ink); }
.file-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }

    /** HTML の属性名。値の有無で属性名の色が割れないよう、値の無い属性(`disabled`)もキーにする。`=` が続くかを見ないので、開きタグの中でだけ読む。 */
    const AttributeName = /[A-Za-z_:][\w:.-]*/y;
    /** HTML の引用符の無い属性の値(`charset=utf-8` の `utf-8`)。 */
    const UnquotedAttributeValue = /[^\s"'=<>`]+/y;
    const CssAtRule = /@[\w-]+/y;
    const CssImportant = /!important\b/y;
    const CssCustomProperty = /--[\w-]+/y;
    const CssHex = /#[0-9A-Fa-f]{3,8}(?![\w-])/y;
    const CssNumber = /-?(?:\d*\.)?\d+(?:%|[A-Za-z]+)?/y;
    const CssPropertyName = /-?[A-Za-z][\w-]*(?=\s*:)/y;
    const CssColon = /\s*:/y;
    const DeclarationStops = new Set(["{", ";", "}"]);
    const CssWord = /-?[A-Za-z_][\w-]*/y;
    const KeyAfter = /\s*\??\s*:/y;
    // オブジェクトのキーが来る位置。直前の空白でない字(空文字は行頭)か、直前の語で見る。
    const KeyFollows = new Set(["", "{", ",", ";"]);
    const KeyModifiers = new Set(["readonly"]);
    const Closers = { ")": "(", "]": "[", "}": "{" };
    const Openers = new Set(Object.values(Closers));
    /** JSX のタグ名。`.` `:` `-` でつないだもの(`Foo.Bar` / `svg:path` / `my-element`)も 1 つの名前にする。 */
    const JsxName = String.raw`${JsIdentifier.source}(?:[.:-][\w$]+)*`;
    /** JSX のタグの `<` と名前(`<名前` / `</名前`)と、フラグメントの `<>` / `</>`。 */
    const JsxTag = new RegExp(String.raw`</?(?:${JsxName}|>)`, "y");
    /** JSX の属性名。`-` `:` でつないだもの(`aria-label` / `xlink:href`)も 1 つの名前にする。HTML の `AttributeName` と同じく、値の無い属性もキーにする。 */
    const JsxAttributeName = new RegExp(String.raw`${JsIdentifier.source}(?:[-:][\w$]+)*`, "y");
    /** JSX の子の中の本文。タグの `<` と式の `{` の手前まで。 */
    const JsxText = /[^<{]+/y;
    /** JSX の自己閉じの `/>`。`/` と `>` の間に空白があってもよい。 */
    const JsxSelfClosing = /\/\s*>/y;
    /**
     * `.tsx` で TypeScript が総称の矢印関数の型引数として読む形。`<` の後の名前(前に `const` があってもよい)に `,` か `=` が続くか、
     * `extends` が続いてその後が `=` `>` `/` でないもの。`=` に `==` `=>` を、`/` に `/=` を含めないのは TypeScript の字句に合わせる。
     * TypeScript と違い、字句の間のコメントは飛ばさない(名前と `,` の間にコメントがあるとタグと読む)。
     */
    const ArrowTypeParameters = new RegExp(String.raw`<\s*(?:const\s+)?${JsIdentifier.source}(?![\w$])\s*(?:,|=(?![=>])|extends\b(?!\s*(?:=(?![=>])|>|\/(?!=))))`, "y");
    /** タグの段の綴り。`OpeningTag` は開きタグの中(HTML と JSX。HTML では閉じタグの中も)、`Children` は JSX の子の中。 */
    const TagLevels = Object.freeze({ OpeningTag: "<", Children: ">" });
    const isTagLevel = (bracket) => bracket === TagLevels.OpeningTag || bracket === TagLevels.Children;
    /**
     * 式が始まる位置の、直前の空白でない字(空文字は行頭)。行頭・開き括弧・`,`・`=`・`?`・`:` と、`=>` の `>`、`&&` `||` の
     * 末尾の `&` `|`。
     */
    const ExpressionFollows = new Set(["", "(", "[", "{", ",", "=", ">", "?", ":", "&", "|"]);

    /** 字句。`opens` は閉じずに行が終わった文字列・コメントの閉じ記号で、次の行の頭から続ける。 */
    const Token = (cls, value, opens = null) => ({ cls, value, opens });

    /**
     * 何も開いていない持ち越し。持ち越しは次の 3 つ。
     * - `open`: 閉じずに行が終わった文字列・コメント(`{cls, close}`)
     * - `region`: 中を別の言語で読んでいる埋め込み。null か、`{kind: "element", name}` / `{kind: "heredoc", delimiter, stripsTabs}`
     * - `brackets`: 開いたまま閉じていない括弧(`(` `[` `{`)と、HTML・`.tsx` / `.jsx` のタグの段(`TagLevels`)を、開いた順に並べた文字列
     *
     * JSX の段は括弧と交互に入れ子になる(`{ ( <li { …`)ので、別の並びにせず、開いて閉じる括弧と同じ並びに積む。
     */
    const Start = Object.freeze({ open: null, region: null, brackets: "" });

    /** 何も読んでいない位置の、直前の空白でない字(`prevSolid`。空文字は行頭)とその位置(`prevSolidAt`)と直前の語(`prevWord`)。 */
    const Unread = Object.freeze({ prevSolid: "", prevSolidAt: -1, prevWord: "" });

    const matchAt = (pattern, cursor) => {
      pattern.lastIndex = cursor.at;
      const match = pattern.exec(cursor.text);
      return match ? match[0] : null;
    };
    const restOfLine = (cursor) => cursor.text.slice(cursor.at);

    /** 文字列の終わりまで。閉じずに行が終わったら、三重引用符とテンプレート文字列だけ次の行へ持ち越す。 */
    const stringAt = (cursor, grammar) => {
      const { text, at } = cursor;
      const quote = grammar.strings.find((candidate) => text.startsWith(candidate, at));
      if (!quote) return null;
      let end = at + quote.length;
      while (end < text.length) {
        if (text.startsWith(quote, end)) return Token("tok-str", text.slice(at, end + quote.length));
        end += text[end] === "\\" ? 2 : 1;
      }
      const spansLines = quote.length === 3 || quote === "`";
      return Token("tok-str", text.slice(at, Math.min(end, text.length)), spansLines ? quote : null);
    };

    /** Python の `f"…"` などの接頭辞を、続く文字列と 1 字句にする。 */
    const prefixedStringAt = (cursor, grammar) => {
      const canPrefix = grammar.prefixes !== undefined && !/\w/.test(cursor.prev);
      const prefix = canPrefix ? matchAt(grammar.prefixes, cursor) : null;
      if (!prefix) return null;
      const rest = stringAt({ ...cursor, at: cursor.at + prefix.length }, grammar);
      return Token("tok-str", prefix + rest.value, rest.opens);
    };

    const commentAt = (cursor, grammar) => {
      const { text, at } = cursor;
      const block = grammar.block;
      const isBlockCommentStart = block !== undefined && text.startsWith(block[0], at);
      if (isBlockCommentStart) {
        const close = text.indexOf(block[1], at + block[0].length);
        return close >= 0 ? Token("tok-com", text.slice(at, close + block[1].length)) : Token("tok-com", restOfLine(cursor), block[1]);
      }
      const isLineCommentStart = grammar.comment !== undefined && text.startsWith(grammar.comment, at);
      // `#` は Python 以外では行頭か空白の直後だけコメントにする(シェルの `$#`・URL の `#` を取り違えない)。
      const isHashAllowedHere = grammar.comment !== "#" || grammar.hashAnywhere === true || /\s/.test(cursor.prev);
      const isComment = isLineCommentStart && isHashAllowedHere;
      return isComment ? Token("tok-com", restOfLine(cursor)) : null;
    };

    /** 引用(接頭辞付きの文字列・コメント・文字列)の字句。どれでもなければ null。 */
    const quotedAt = (cursor, grammar) => prefixedStringAt(cursor, grammar) || commentAt(cursor, grammar) || stringAt(cursor, grammar);

    /** `.` の後の名前か。スプレッドの `...` の後は含めない。 */
    const isMemberAt = (cursor) => cursor.prevSolid === "." && cursor.text[cursor.prevSolidAt - 1] !== ".";

    /**
     * JS / TS のオブジェクトのキーか。`const x:`・`case foo:`・`ok ? left :`・丸括弧の中の `name:` はキーにしない。
     * 行頭の switch の `default:` もキーと区別できないので、キーとして色を付けない。
     */
    const isKeyAt = (cursor, word, grammar) => {
      KeyAfter.lastIndex = cursor.at + word.length;
      const hasColon = grammar.objectKeys === true && KeyAfter.test(cursor.text);
      const followsKeyPlace = KeyFollows.has(cursor.prevSolid) || KeyModifiers.has(cursor.prevWord);
      return hasColon && followsKeyPlace && cursor.bracket !== "(";
    };

    /** 識別子の色。メンバー → キー → キーワード → 関数 → 型・変数の順に見る。 */
    const identifierClassOf = (cursor, word, grammar) => {
      const isCall = cursor.text[cursor.at + word.length] === "(";
      const isMember = grammar.identifiers === true && isMemberAt(cursor);
      if (isMember) return isCall ? "tok-fn" : null;
      if (isKeyAt(cursor, word, grammar)) return null;
      if (grammar.keywords.has(word)) return "tok-kw";
      if (isCall) return "tok-fn";
      if (grammar.identifiers !== true) return null;
      const isType = /^[A-Z]/.test(word) || (grammar.types !== undefined && grammar.types.has(word));
      return isType ? "tok-type" : "tok-var";
    };

    /**
     * 行の各位置から先で最初に来る `{` `;` `}`。CSS の宣言の判定が語ごとに行末まで探し直さないよう、行ごとに 1 度だけ求める。
     * @returns 位置ごとの字(その位置から先に無ければ空文字)
     */
    const declarationStopsOf = (text) => {
      const stops = new Array(text.length);
      let next = "";
      for (let index = text.length - 1; index >= 0; index -= 1) {
        if (DeclarationStops.has(text[index])) next = text[index];
        stops[index] = next;
      }
      return stops;
    };

    /** CSS で、位置から始まる `:` が宣言の区切りか。`:` の後が空白か行末、または後で最初に来る `{` `;` `}` が `;` か `}` なら宣言(`a:hover {` はセレクタ)。 */
    const isDeclarationColonAt = (cursor, from) => {
      const after = from + matchAt(CssColon, { text: cursor.text, at: from }).length;
      const next = cursor.text[after];
      const isSpaceAfter = next === undefined || /\s/.test(next);
      const stop = cursor.declarationStops[after];
      return isSpaceAfter || stop === ";" || stop === "}";
    };

    /** CSS の、文字列とコメント以外の字句。 */
    const cssTokenAt = (cursor) => {
      const atRule = matchAt(CssAtRule, cursor) || matchAt(CssImportant, cursor);
      if (atRule) return Token("tok-kw", atRule);
      const custom = matchAt(CssCustomProperty, cursor);
      if (custom) return Token("tok-var", custom);
      const hex = matchAt(CssHex, cursor);
      if (hex) return Token("tok-num", hex);
      if (/[\w-]/.test(cursor.prev)) return null;
      const number = matchAt(CssNumber, cursor);
      if (number) return Token("tok-num", number);
      // 丸括弧・角括弧の中(`@media (max-width: …)`・属性セレクタ)と、`:` の直後の名前はプロパティにしない。
      const isDeclarationPlace = cursor.bracket !== "(" && cursor.bracket !== "[" && cursor.prevSolid !== ":";
      const property = isDeclarationPlace ? matchAt(CssPropertyName, cursor) : null;
      const isProperty = property !== null && isDeclarationColonAt(cursor, cursor.at + property.length);
      if (isProperty) return Token("tok-key", property);
      const word = matchAt(CssWord, cursor);
      if (!word) return null;
      return Token(cursor.text[cursor.at + word.length] === "(" ? "tok-fn" : null, word);
    };

    /** 数値と名前の字句。直前の字が名前の字(`\w` `$`)のとき(名前の途中)と、数値でも名前でもないときは null。 */
    const wordAt = (cursor, grammar) => {
      if (/[\w$]/.test(cursor.prev)) return null;
      const number = matchAt(NumberLiteral, cursor);
      if (number) return Token("tok-num", number);
      const word = matchAt(grammar.identifier ?? Identifier, cursor);
      if (!word) return null;
      return Token(identifierClassOf(cursor, word, grammar), word);
    };

    /** 式が始まる位置か(直前の空白でない字が `ExpressionFollows` にあるか、直前の語が `return`)。 */
    const isExpressionPlace = (cursor) => ExpressionFollows.has(cursor.prevSolid) || cursor.prevWord === "return";

    /** 綴りの全体が、その字句の形に当たるか。 */
    const isWhole = (pattern, value) => matchAt(pattern, { text: value, at: 0 }) === value;

    /** 字句がタグ(`pattern` の形)か。文字列・コメントの続きは、行の綴りがタグと同じでも閉じ記号を持ち越すので、タグにしない。 */
    const isTagToken = (pattern, token) => token.opens === null && isWhole(pattern, token.value);

    /** JSX のタグの綴りが、フラグメント(`<>` / `</>`)か。 */
    const isFragment = (tag) => tag.endsWith(">");

    /** JSX のタグの綴りが、閉じタグ(`</名前` / `</>`)か。 */
    const isClosingTag = (tag) => tag.startsWith("</");

    /** JSX のタグの字句。名前のあるタグもフラグメント(`<>` / `</>`)もキーワードにする。タグでなければ null。 */
    const jsxTagAt = (cursor) => {
      const tag = matchAt(JsxTag, cursor);
      return tag ? Token("tok-kw", tag) : null;
    };

    /**
     * 式が始まる位置にある JSX のタグ(開きタグ・閉じタグ・フラグメント)。総称の矢印関数の型引数ならタグにしない。
     *
     * 読み始めを誤ると、後ろを JSX(属性名か本文)として読み、誤って開いた要素を閉じる閉じタグか `/>` まで JS / TS へ戻らない。型の位置の
     * 総称の関数型(`=` `{` `:` `,` `(` `|` `&` `=>` の後の `<T>(`)と、前の行の値に続く行頭の `<`(`a` の次の行の `<b`)はタグと読む。
     * `<` の直後に空白のあるタグ(`< div>`)は、タグと読まない。
     */
    const jsxTagInExpressionAt = (cursor) => {
      const isTagPlace = isExpressionPlace(cursor) && matchAt(ArrowTypeParameters, cursor) === null;
      return isTagPlace ? jsxTagAt(cursor) : null;
    };

    /**
     * JSX の段の中の字句。子の中はタグと本文を、開きタグの中は自己閉じ・コメント・文字列・属性名を読む(段は `cursor.bracket`)。
     * 型引数の付いたタグ(`<Foo<T> />`)は名前の後の `<` から読み違えて子の中に入り、その子を閉じる閉じタグまで JS / TS へ戻らない。
     * @returns 字句。どれにも当たらなければ null(呼び出し側が 1 文字だけ進める)
     */
    const jsxTokenAt = (cursor, grammar) => {
      if (cursor.bracket === TagLevels.Children) {
        const tag = jsxTagAt(cursor);
        if (tag) return tag;
        const text = matchAt(JsxText, cursor);
        return text ? Token(null, text) : null;
      }
      const selfClosing = matchAt(JsxSelfClosing, cursor);
      if (selfClosing) return Token(null, selfClosing);
      // JSX ではエスケープにならない `\` をエスケープと読み、行をまたぐ属性の値の文字列は次の行へ持ち越さない。
      const quoted = quotedAt(cursor, grammar);
      if (quoted) return quoted;
      const name = matchAt(JsxAttributeName, cursor);
      return name ? Token("tok-key", name) : null;
    };

    /**
     * HTML の字句。開きタグの中は文字列・属性名・引用符の無い属性の値を、それ以外はコメント・タグ・数値と語を読む(段は `cursor.bracket`)。
     * 本文の引用符は文字列を始めない(`Don't` の `'` から行末までを文字列にしない)。
     * @returns 字句。どれにも当たらなければ null(呼び出し側が 1 文字だけ進める)
     */
    const htmlTokenAt = (cursor, grammar) => {
      if (cursor.bracket !== TagLevels.OpeningTag) {
        const tag = matchAt(TagName, cursor);
        if (tag) return Token("tok-kw", tag);
        return commentAt(cursor, grammar) || wordAt(cursor, grammar);
      }
      const quoted = stringAt(cursor, grammar);
      if (quoted) return quoted;
      const isUnquotedValue = cursor.prevSolid === "=";
      const word = matchAt(isUnquotedValue ? UnquotedAttributeValue : AttributeName, cursor);
      if (!word) return null;
      return Token(isUnquotedValue ? null : "tok-key", word);
    };

    /**
     * 位置から始まる字句を 1 つ返す。色の付かない識別子も、途中で切らないよう 1 字句(cls が null)で返す。
     * @returns 字句。どの規則にも当たらなければ null(呼び出し側が 1 文字だけ進める)
     */
    const tokenAt = (cursor, grammar) => {
      const isYamlKeyPosition = grammar.keys === true && cursor.lineStart;
      const key = isYamlKeyPosition ? matchAt(YamlKey, cursor) : null;
      if (key) return Token("tok-key", key);
      const quoted = quotedAt(cursor, grammar);
      if (quoted) return quoted;
      const sigil = grammar.sigils === undefined ? null : matchAt(grammar.sigils, cursor);
      if (sigil) {
        return Token("tok-kw", sigil);
      }
      if (grammar.css === true) return cssTokenAt(cursor);
      const variable = grammar.variables === true ? matchAt(ShellVariable, cursor) : null;
      if (variable) return Token("tok-var", variable);
      const jsx = grammar.jsx === true ? jsxTagInExpressionAt(cursor) : null;
      if (jsx) return jsx;
      return wordAt(cursor, grammar);
    };

    /** 持ち越しの続き(前の行で閉じなかった文字列・コメント)を、閉じ記号まで 1 字句にする。 */
    const continuationOf = (cursor, open) => {
      const close = cursor.text.indexOf(open.close, cursor.at);
      if (close < 0) return Token(open.cls, cursor.text.slice(cursor.at), open.close);
      return Token(open.cls, cursor.text.slice(cursor.at, close + open.close.length));
    };

    /**
     * 字句を読んだ後の括弧の並び。色の無い字句だけを括弧として見る。
     *
     * 閉じ括弧は、一番上の開き括弧と種類が合うときだけ外し、合わなければ無視する。正規表現の文字クラスの `}` が、外側の `{` を
     * 閉じないため。正規表現の `\[` のように対にならない開き括弧は、並びに残ったままになる。
     */
    const bracketsAfter = (brackets, token) => {
      if (token.cls !== null) return brackets;
      if (Openers.has(token.value)) return brackets + token.value;
      const isClosingTop = Object.hasOwn(Closers, token.value) && brackets.endsWith(Closers[token.value]);
      return isClosingTop ? brackets.slice(0, -1) : brackets;
    };

    /**
     * `.tsx` / `.jsx` で字句を読んだ後の、括弧と JSX の段の並び。タグは段を積み外しし、開きタグを閉じる `>` は子の段へ移り、
     * 自己閉じは段を外す。段の中では `{` だけを積み、段の外は `bracketsAfter` に渡す。
     *
     * 段の外で来た閉じタグ(要素の途中から読み始めた)は何も積まない。後ろが子か JS かは分からず、子として読むと `);` 以降を本文にしてしまうため。
     */
    const jsxBracketsAfter = (brackets, token) => {
      const top = brackets.slice(-1);
      const outer = brackets.slice(0, -1);
      if (isTagToken(JsxTag, token)) {
        if (isClosingTag(token.value)) return top === TagLevels.Children ? outer : brackets;
        return brackets + (isFragment(token.value) ? TagLevels.Children : TagLevels.OpeningTag);
      }
      const closesOpeningTag = top === TagLevels.OpeningTag && token.value === ">";
      if (closesOpeningTag) return outer + TagLevels.Children;
      const selfCloses = top === TagLevels.OpeningTag && isWhole(JsxSelfClosing, token.value);
      if (selfCloses) return outer;
      // 本文の字句は `(` か `[` 1 文字だけにもなる(`<p>(</p>`)ので、JsxText では積むのを防げない。
      if (isTagLevel(top)) return token.value === "{" ? brackets + token.value : brackets;
      return bracketsAfter(brackets, token);
    };

    /**
     * HTML で字句を読んだ後の段。タグの `<名前`(閉じタグの `</名前` も)で開きタグの段に入り、`>` で出る。開きタグの中かどうかだけを
     * 持ち、要素の入れ子と本文の括弧は数えない(閉じタグを書かない要素があり、本文の括弧は色に効かない)。
     */
    const htmlBracketsAfter = (brackets, token) => {
      if (isTagToken(TagName, token)) return TagLevels.OpeningTag;
      const closesOpeningTag = brackets === TagLevels.OpeningTag && token.value === ">";
      return closesOpeningTag ? Start.brackets : brackets;
    };

    /** 文法ごとの、字句を読んだ後の括弧と段の並び。 */
    const bracketsAfterIn = (grammar) => {
      if (grammar.jsx === true) return jsxBracketsAfter;
      if (grammar.tags === true) return htmlBracketsAfter;
      return bracketsAfter;
    };

    /** 文法と段ごとの、字句を読む関数。 */
    const tokenReaderOf = (grammar, bracket) => {
      if (grammar.tags === true) return htmlTokenAt;
      const readsJsx = grammar.jsx === true && isTagLevel(bracket);
      return readsJsx ? jsxTokenAt : tokenAt;
    };

    /** ヒアドキュメントの区切りの行か。`<<-` で開いたものは、行頭のタブを除いて比べる。 */
    const isClosingLine = (text, heredoc) => (heredoc.stripsTabs ? text.replace(/^\t+/, "") : text) === heredoc.delimiter;

    /** 埋め込みの中を読む文法。 */
    const grammarIn = (region) => Grammars[region.kind === "element" ? Embeddings.elements[region.name] : Embeddings.heredocs[region.delimiter]];

    /** タグの字句(開きタグの `<` と名前)が開く埋め込みの要素。埋め込みでない要素・閉じタグなら null。 */
    const elementOpenedBy = (tag) => {
      const name = tag.slice(1).toLowerCase();
      return Object.hasOwn(Embeddings.elements, name) ? { kind: "element", name } : null;
    };

    /**
     * 行が開くヒアドキュメント。行の中の最初の `<<` の区切りの語が `Embeddings.heredocs` に無ければ null。
     * `<<` は字句に分けずに行の生の文字で探すので、文字列・コメントの中の `<<` でも開く。
     */
    const heredocOpenedBy = (text) => {
      const match = HeredocStart.exec(text);
      const isKnown = match !== null && Object.hasOwn(Embeddings.heredocs, match[3]);
      return isKnown ? { kind: "heredoc", delimiter: match[3], stripsTabs: match[1] === "-" } : null;
    };

    /** 1 行を字句に分ける。埋め込みの要素には、行の途中でも出入りする(ヒアドキュメントの開閉は `tokenizeLine` が行ごとに見る)。 */
    const tokensOf = (text, base, carry) => {
      const tokens = [];
      // 要素に出入りするのは html の文法の行だけなので、閉じタグを大文字小文字を問わず探すための写しはそのときだけ作る。
      const lower = base.tags === true ? text.toLowerCase() : null;
      // その位置から読む文法と、要素の閉じタグ(無ければ -1)で切った行。行の頭と、埋め込みに出入りしたときに 1 度だけ求める
      // (字句ごとに閉じタグを探し直さない)。閉じ記号は Embeddings.elements のキーから組み立て、script 要素の開きタグ・閉じタグの
      // 綴りをこのスクリプトに文字のまま書かない。閉じタグの綴りがあるとページのスクリプトがそこで切れ、開きタグの綴りは
      // check-pr-explain-template.py がスクリプトの 1 本と数える。
      const readingFrom = (inside, from) => {
        const grammar = inside === null ? base : grammarIn(inside);
        const closeAt = inside !== null && inside.kind === "element" ? lower.indexOf(`</${inside.name}`, from) : -1;
        const view = closeAt < 0 ? text : text.slice(0, closeAt);
        return { grammar, closeAt, view, declarationStops: grammar.css === true ? declarationStopsOf(view) : null };
      };
      let { open, region, brackets } = carry;
      let at = 0;
      let lineStart = true;
      let solid = Unread;
      let element = null;
      let reading = readingFrom(region, 0);
      // 埋め込みに入る・出るときは、中の言語を何も読んでいないところから読む。
      const switchTo = (next) => {
        ({ open, region, brackets } = { ...Start, region: next });
        solid = Unread;
        reading = readingFrom(next, at);
      };
      while (at < text.length) {
        if (reading.closeAt === at) {
          switchTo(null);
          continue;
        }
        const { grammar, view, declarationStops } = reading;
        const cursor = { text: view, at, prev: at > 0 ? text[at - 1] : "\n", lineStart, bracket: brackets.slice(-1), declarationStops, ...solid };
        const readAt = tokenReaderOf(grammar, cursor.bracket);
        const token = open ? continuationOf(cursor, open) : readAt(cursor, grammar) || Token(null, text[at]);
        tokens.push(token);
        at += token.value.length;
        open = token.opens === null ? null : { cls: token.cls, close: token.opens };
        lineStart = lineStart && !/\S/.test(token.value);
        const trimmed = token.value.trimEnd();
        const isSolid = token.cls !== "tok-com" && trimmed !== "";
        if (isSolid) solid = { prevSolid: trimmed.slice(-1), prevSolidAt: at - 1 - (token.value.length - trimmed.length), prevWord: /^[\w$]+$/.test(token.value) ? token.value : "" };
        brackets = bracketsAfterIn(grammar)(brackets, token);
        const isTag = grammar.tags === true && token.cls === "tok-kw";
        if (isTag) element = elementOpenedBy(token.value);
        const entersElement = grammar.tags === true && token.value === ">" && element !== null;
        if (entersElement) {
          switchTo(element);
          element = null;
        }
      }
      return { tokens, carry: { open, region, brackets } };
    };

    /**
     * 1 行を字句に分ける。ヒアドキュメントは、区切りの語が `Embeddings.heredocs` にあるものを開いた行の次から区切りの行の前まで、
     * その言語で読む(区切りの行はシェルで読む)。
     * @param grammar ファイルの文法(`grammarOf`)。null なら行全体を色の無い 1 字句にし、持ち越しをそのまま返す
     * @param carry 前の行から持ち越した状態。中身は `Start` の doc
     * @returns 字句の並び(`cls` が null のものは色を付けない)と、次の行へ持ち越す状態
     */
    const tokenizeLine = (text, grammar, carry) => {
      if (grammar === null) return { tokens: [Token(null, text)], carry };
      const closesHeredoc = carry.region !== null && carry.region.kind === "heredoc" && isClosingLine(text, carry.region);
      if (closesHeredoc) return { tokens: tokensOf(text, grammar, Start).tokens, carry: Start };
      const read = tokensOf(text, grammar, carry);
      const canOpenHeredoc = grammar.heredocs === true && carry.region === null;
      const heredoc = canOpenHeredoc ? heredocOpenedBy(text) : null;
      return heredoc === null ? read : { tokens: read.tokens, carry: { ...Start, region: heredoc } };
    };

    return Object.freeze({
      Embeddings,
      /** 色分けの規則を引く拡張子(`.` を除いたもの)。埋め込みを読む拡張子を、解説の検査の拡張子と突き合わせるために出す。 */
      Extensions: Object.freeze(Object.keys(LanguageByExtension)),
      /**
       * パスの拡張子から色分けの規則を引く。
       * @param path ファイルのパス
       * @returns 規則。知らない拡張子なら null(色を付けない)
       */
      grammarOf: (path) => {
        const extension = (path.match(/\.(\w+)$/) || [])[1] || "";
        const language = Object.hasOwn(LanguageByExtension, extension) ? LanguageByExtension[extension] : "";
        return Object.hasOwn(Grammars, language) ? Grammars[language] : null;
      },
      /**
       * 途中の行から読み始めるときの持ち越し。開いた行を何も開いていない状態から読み、埋め込みだけを残す。
       * 括弧とタグの段(`brackets`)は持ち越さないので、hunk・抜粋が開きタグや JSX の子の途中から始まると、段の外(JSX は JS / TS、
       * HTML は本文)として読み始める。
       * @param openingLine 読み始める行の頭で効いている埋め込みを開いた行(検査の `openingLine` / 地図の `hunkOpeningLines`)。無ければ null
       * @param grammar ファイルの文法(`grammarOf`。null の文法はどの行でも埋め込みを開かない)
       * @returns 埋め込みだけを残した持ち越し。開いた行が null のとき・開いた行が埋め込みを開いていないときは、何も開いていない持ち越し
       */
      startAfter: (openingLine, grammar) => {
        if (openingLine === null) return Start;
        const { region } = tokenizeLine(openingLine, grammar, Start).carry;
        return region === null ? Start : { ...Start, region };
      },
      /**
       * 続いた行を、前の行の持ち越しを次の行へ渡しながら字句に分ける。
       * @param texts 続いた行(改行を含まない)
       * @param grammar ファイルの文法(`grammarOf`)。null ならどの行も色の無い 1 字句
       * @param start 1 行目の頭の持ち越し(`startAfter` が返すもの)
       * @returns 行ごとの字句の並び(`tokens`)と、その行を読み終えた後の持ち越し(`carry`)。`texts` と同じ順
       */
      tokenizeLines: (texts, grammar, start) => {
        const lines = [];
        let carry = start;
        for (const text of texts) {
          const read = tokenizeLine(text, grammar, carry);
          lines.push(read);
          carry = read.carry;
        }
        return lines;
      },
    });
  })();

  /**
   * 解説の語彙と、ページでの呼び名。キーの集合は `build-pr-explain.py` の語彙と同じで、`pr-explain-core-cases.sh` が
   * 突き合わせる。やりとりの種類は、キーの順がそのまま並べる順(コマンド → クエリ → イベント)。
   */
  const Vocabulary = Object.freeze({
    techniques: {
      boundary: { label: "境界値", description: "ちょうど境目の値(0・上限・丸めの境など)で確かめる" },
      equivalence: { label: "同値分割", description: "同じ扱いになる値のまとまりから、代表を1つずつ選んで確かめる" },
      error: { label: "異常系", description: "失敗したとき・想定外のときにどう振る舞うかを確かめる" },
      state: { label: "状態遷移", description: "操作の前後で、状態が正しく移り変わるかを確かめる" },
      regression: { label: "回帰", description: "作り直しても、以前と同じ結果になるかを確かめる" },
      idempotence: { label: "冪等性", description: "同じ操作を繰り返しても、結果が1回分になるかを確かめる" },
      type: { label: "型", description: "書けてはいけない値がコンパイルで弾かれるか・推論される型を確かめる" },
    },
    phases: { prep: "下ごしらえ", core: "本体", hard: "安定化", revise: "指摘の反映", fin: "仕上げ" },
    messageKinds: {
      cmd: { label: "コマンド", meaning: "依頼", verb: "依頼する" },
      qry: { label: "クエリ", meaning: "問い合わせ", verb: "問い合わせる" },
      evt: { label: "イベント", meaning: "通知", verb: "通知する" },
    },
    vias: { call: "関数呼び出し(同期)", http: "HTTP 通信(外部)", state: "状態の購読(再描画)", log: "ログ出力", exec: "コマンドの実行", file: "ファイルの読み書き" },
    // やりとりの状態と色の区分。省いたもの(前からあって変えていない)はここに無い。
    messageStatuses: {
      added: { tone: "A", label: "このブランチで追加" },
      changed: { tone: "M", label: "このブランチで変更" },
      removed: { tone: "D", label: "このブランチで削除" },
    },
    // 技術の手引き(この PR の実装)の節の状態と色の区分。省いたもの(前からある)はここに無い。
    primerStatuses: {
      added: { tone: "A", label: "この PR で追加" },
      changed: { tone: "M", label: "この PR で変更" },
    },
    // 技術の手引きの注意メモの種類と見出し。色はキーごとに CSS の `data-remark` が持つ。キーの順は解説の検査の `RemarkKinds` と同じ。
    remarkKinds: {
      caution: { label: "注意" },
      memo: { label: "メモ" },
      rule: { label: "規約" },
      spec: { label: "仕様" },
      history: { label: "経緯" },
    },
  });
  const MessageKindOrder = Object.keys(Vocabulary.messageKinds);
  /** やりとりを種類の順(コマンド → クエリ → イベント)に並べる比較。 */
  const byMessageKind = (a, b) => MessageKindOrder.indexOf(a.kind) - MessageKindOrder.indexOf(b.kind);

  /** 確認の印の鍵。 */
  const ReviewCheck = Object.freeze({
    /**
     * レビューの文 1 つに付ける確認の印の鍵を作る。
     * 番号で持つと、解説を書き直したときに別の文へ印が移る。だから文そのもので持つ。
     * @param sha その文を書いたコミットの sha
     * @param text レビューの文
     * @returns sha と文のどちらかが違えば別になる鍵
     */
    keyOf: (sha, text) => JSON.stringify([sha, text]),
  });

  /** 解説の Target(概要の「このブランチで起きていること」の 1 件が指す先)。 */
  const Target = Object.freeze({
    /**
     * Target を、ページで選ぶ先にする。kind ごとに読むキーは `build-pr-explain.py` の `Variants` と同じで、
     * `pr-explain-core-cases.sh` が突き合わせる。
     * @returns `group`(`grouping` のまとめ方の組の `id`)/ `file`(`id` はパス)/ `message` / `flow`。指す先が地図に
     *   あるかは見ない
     */
    selectionOf: (go) => {
      switch (go.kind) {
        case "feature":
          return { kind: "group", id: `feature:${go.id}`, grouping: "feature" };
        case "layer":
          return { kind: "group", id: `layer:${go.layer}`, grouping: "layer" };
        case "file":
          return { kind: "file", id: go.path };
        case "message":
          return { kind: "message", id: go.id };
        case "flow":
          return { kind: "flow", id: go.id };
      }
    },
  });

  const Screens = Object.freeze({ Map: "map", Story: "story", Test: "test", Impact: "impact", Primer: "primer" });
  const isScreen = (value) => Object.values(Screens).includes(value);

  /** どの画面を開くか。 */
  const ScreenChoice = Object.freeze({
    Screens,
    isScreen,
    /**
     * ハッシュ → 保存値 → 構造マップの順に選ぶ。
     * @param hash `location.hash`(`#` の有無は問わない)
     * @param saved 最後に開いた画面として保存してある値。無ければ null
     * @returns 開く画面
     */
    choose: ({ hash, saved }) => {
      const fromHash = hash.replace(/^#/, "");
      if (isScreen(fromHash)) return fromHash;
      if (isScreen(saved)) return saved;
      return Screens.Map;
    },
  });

  /** ページの文字サイズ。保存値は 80〜200% の 10% 刻みだけを受け付ける。 */
  const TextScale = (() => {
    const Default = 100;
    const Minimum = 80;
    const Maximum = 200;
    const Step = 10;
    const choose = (value) => {
      if (!Number.isInteger(value)) {
        return Default;
      }
      if (value < Minimum || value > Maximum) {
        return Default;
      }
      if (value % Step !== 0) {
        return Default;
      }
      return value;
    };
    return Object.freeze({
      choose,
      increase: (value) => Math.min(Maximum, choose(value) + Step),
      decrease: (value) => Math.max(Minimum, choose(value) - Step),
      reset: () => Default,
    });
  })();

  const isRecord = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
  const isListOfRecords = (value) => Array.isArray(value) && value.every(isRecord);
  const isString = (value) => typeof value === "string";
  const isStringList = (value) => Array.isArray(value) && value.every(isString);
  /** 配列ならそのまま、それ以外(書いていない・型が違う)なら空の配列にする。 */
  const listOf = (value) => (Array.isArray(value) ? value : []);
  /** id の並びのうち表に有るものを、表の値にして id の順に並べる。表に無い id は外す。 */
  const valuesIn = (table, ids) => listOf(ids).filter((id) => table.has(id)).map((id) => table.get(id));
  const optionalText = (value) => (isString(value) ? value : null);
  /** 行番号が、行の範囲(`{start, end}`。両端を含む)に入るか。 */
  const isWithin = (number, span) => span.start <= number && number <= span.end;
  /** 解説の道筋(`a[].b`)の 1 段を、キーと、そのキーの配列の各要素へ進むか(`[]` で終わる段)にする。 */
  const routeStepOf = (step) => ({ key: step.replace(/\[\]$/, ""), isEach: step.endsWith("[]") });

  /** テストを、確かめているものとして数えるか。未実装(提案)と、このブランチで消したものは数えない。 */
  const isVerifying = (test) => test.status !== "todo" && test.status !== "removed";

  /**
   * 解説のテストの id を、テスト画面と同じテスト(状態つき)にする。解説のテストに無い id は外す。
   *
   * 判定なし(テスト名を調べていないファイルのテスト)も確かめているものに数える。追加か既存かが分からないだけで、テストはあるため。
   * @param ids 根拠に挙げた解説のテストの id(書いていなければ undefined)
   * @param testAt 解説のテストの id から、テスト画面と同じテストを引く表(`ExplainedMap` の `testAt`)
   * @returns `verifying`(確かめているもの)・`missing`(未実装で、まだ無いもの)・`isGuarded`(確かめているものが 1 件以上)
   */
  const testEvidenceOf = (ids, testAt) => {
    const found = valuesIn(testAt, ids);
    const verifying = found.filter(isVerifying);
    return { verifying, missing: found.filter((test) => test.status === "todo"), isGuarded: verifying.length > 0 };
  };

  /**
   * やりとりの両端が図の箱か。構造マップで選べるのは、両端が箱のやりとりだけ。
   * @param message 解説のやりとり
   * @param entryAt パスから木の項目を引く表(`ExplainedMap` の `entryAt`)
   * @returns 両端とも木の項目にあり、図に出す(`inGraph`)ものなら true
   */
  const isDrawnMessage = (message, entryAt) => [message.from, message.to].every((path) => entryAt.has(path) && entryAt.get(path).inGraph);

  /**
   * 振る舞いの画面の節の並び。解説の `impact` を、変わったこと → 状況の表 → 増えた状況 → 変わらないこと の節にする。
   *
   * 節を `section` と呼ばないのは、ページでは `section` が画面(`<section class="screen">`)と画面の中の区画(`.section`)を指しているため。
   */
  const ImpactTopics = (() => {
    const Labels = Object.freeze({ changed: "変わったこと", kept: "変わらないこと" });

    const linesOf = (lines) => listOf(lines).map((line) => ({ text: line.text, message: optionalText(line.message) }));

    /** 前後の行が指すやりとりを、書いた順に重複なく。解説に無い id は外し、両端が図の箱かを添える。 */
    const mechanismsOf = (lines, { messages, entryAt }) => {
      const ids = [...new Set(lines.map((line) => line.message).filter((id) => id !== null && messages.has(id)))];
      return ids.map((id) => ({ message: messages.get(id), isDrawn: isDrawnMessage(messages.get(id), entryAt) }));
    };

    /** 前後の組(変わったこと・増えた状況が同じ形で持つ)。前後の行と、それが指すやりとり(仕組み)にする。 */
    const sidesOf = (source, context) => {
      const before = linesOf(source.before);
      const after = linesOf(source.after);
      return { before, after, text: optionalText(source.text), mechanisms: mechanismsOf([...before, ...after], context) };
    };

    /** 見出しの id が重複していれば先のものだけを残す。 */
    const firstById = (heads) => heads.filter((head, index) => heads.findIndex((other) => other.id === head.id) === index);

    /** マスの状況の文。マスに書いてあればそれを、無ければ見出しから「行 · 列(行の注)」を組む。 */
    const situationOf = ({ outcome, row, column }) => {
      if (typeof outcome.situation === "string") return outcome.situation;
      return typeof row.note === "string" ? `${row.label} · ${column.label}(${row.note})` : `${row.label} · ${column.label}`;
    };

    /** 表のマス。同じ組み合わせを 2 回書いていれば先のもの、書いていなければ null(空き)。 */
    const outcomeOf = ({ outcomes, row, column, testAt }) => {
      const outcome = outcomes.find((candidate) => candidate.rowHead === row.id && candidate.columnHead === column.id);
      if (outcome === undefined) return null;
      return {
        row: row.id,
        column: column.id,
        result: outcome.result,
        was: optionalText(outcome.was),
        note: optionalText(outcome.note),
        isChanged: typeof outcome.was === "string",
        situation: situationOf({ outcome, row, column }),
        tests: testEvidenceOf(outcome.tests, testAt),
      };
    };

    const headOf = (head) => ({ id: head.id, label: head.label, note: optionalText(head.note) });

    /**
     * 状況の表を、行の見出し × 列の見出しの順のマスにする。見出しに無い id のマスは並べない。
     * @returns 表の節。`rows[].outcomes` は行ごとのマス(空きは null)、`outcomes` は空きを除いて行の順に並べたマス
     */
    const tableTopicOf = (table, index, { testAt }) => {
      const rowHeads = firstById(listOf(table.rowHeads));
      const columnHeads = firstById(listOf(table.columnHeads));
      const outcomes = listOf(table.outcomes);
      const rows = rowHeads.map((row) => ({ head: headOf(row), outcomes: columnHeads.map((column) => outcomeOf({ outcomes, row, column, testAt })) }));
      const filled = rows.flatMap((row) => row.outcomes).filter((outcome) => outcome !== null);
      return {
        kind: "table",
        id: `table-${index}`,
        label: table.label,
        gist: optionalText(table.gist),
        text: optionalText(table.text),
        columns: columnHeads.map(headOf),
        rows,
        outcomes: filled,
        changedCount: filled.filter((outcome) => outcome.isChanged).length,
      };
    };

    const addedTopicOf = (added, index, context) => ({ kind: "added", id: `added-${index}`, label: added.label, ...sidesOf(added, context), tests: testEvidenceOf(added.tests, context.testAt) });

    const changedTopicsOf = (changed, context) => (isRecord(changed) ? [{ kind: "changed", id: "changed", label: Labels.changed, ...sidesOf(changed, context) }] : []);

    const keptTopicsOf = (kept, { testAt }) => {
      const lines = listOf(kept).map((line) => ({ text: line.text, tests: testEvidenceOf(line.tests, testAt) }));
      return lines.length === 0 ? [] : [{ kind: "kept", id: "kept", label: Labels.kept, lines }];
    };

    /**
     * 節の中で根拠のテストを挙げている箇所を、節の中の順に並べる。表はマスごと、増えた状況は節ごと、変わらないことは行ごと。
     * @returns `{evidence, cell, placeText}` の並び。`cell` は表のマス(`{row, column}`。表のほかは null)、`placeText` はその箇所の
     *   文(マスの状況・変わらないことの行。増えた状況は null)
     */
    const evidencePlacesOf = (topic) => {
      switch (topic.kind) {
        case "changed":
          return [];
        case "table":
          return topic.outcomes.map((outcome) => ({ evidence: outcome.tests, cell: { row: outcome.row, column: outcome.column }, placeText: outcome.situation }));
        case "added":
          return [{ evidence: topic.tests, cell: null, placeText: null }];
        case "kept":
          return topic.lines.map((line) => ({ evidence: line.tests, cell: null, placeText: line.text }));
      }
    };

    /** 根拠がそのテストを挙げているか(確かめているもの・無いもののどちらで挙げていても)。 */
    const isMentionedIn = (evidence, explainTestId) => [...evidence.verifying, ...evidence.missing].some((test) => test.test.id === explainTestId);

    return Object.freeze({
      /** 使える解説が無いとき。 */
      Unexplained: Object.freeze({ kind: "none" }),
      /**
       * 解説の `impact` を節の並びにする。書かなかった節は作らない(変わらないことが 0 件のときも)。
       * @param impact 形の検査を通った解説の `impact`(書いていなければ undefined)
       * @param testAt 解説のテストの id から、テスト画面と同じテストを引く表(`ExplainedMap` の `testAt`)
       * @param entryAt パスから木の項目を引く表(やりとりの両端が図の箱かを見る)
       * @param messages 解説のやりとりを id で引く表
       * @returns `{kind: "unwritten"}`(`impact` が無い)か `{kind: "written", title, lead, topics}`
       */
      create: ({ impact, testAt, entryAt, messages }) => {
        if (impact === undefined) return { kind: "unwritten" };
        const context = { testAt, entryAt, messages };
        const topics = [
          ...changedTopicsOf(impact.changed, context),
          ...listOf(impact.tables).map((table, index) => tableTopicOf(table, index, context)),
          ...listOf(impact.added).map((added, index) => addedTopicOf(added, index, context)),
          ...keptTopicsOf(impact.kept, context),
        ];
        return { kind: "written", title: impact.title, lead: impact.lead, topics };
      },
      evidencePlacesOf,
      /**
       * 表で初めに選んでおくマス。行の順で最初の「変わった」マス、それが無ければ先頭のマス。
       * @param topic 表の節
       * @returns `{row, column}`。マスが 1 つも無ければ null
       */
      firstCellOf: (topic) => {
        const outcome = topic.outcomes.find((candidate) => candidate.isChanged) ?? topic.outcomes[0];
        return outcome === undefined ? null : { row: outcome.row, column: outcome.column };
      },
      /**
       * そのテストを根拠に挙げている箇所を、節の順に引く(テストの画面の「この状況を確かめている」)。
       * @param explainTestId 解説のテストの id(テスト画面の中の位置ではない)
       * @returns `{topic, topicLabel, cell, placeText}` の並び(`cell` と `placeText` は `evidencePlacesOf` と同じ)
       */
      mentionsOf: (impactTopics, explainTestId) => {
        if (impactTopics.kind !== "written") return [];
        return impactTopics.topics.flatMap((topic) => evidencePlacesOf(topic)
          .filter((place) => isMentionedIn(place.evidence, explainTestId))
          .map((place) => ({ topic: topic.id, topicLabel: topic.label, cell: place.cell, placeText: place.placeText })));
      },
    });
  })();

  /** 振る舞いと技術の手引きの画面の「今の節」。本文のスクロールの位置から、目次と右の欄が指す節を決める。 */
  const TopicScroll = (() => {
    // 読む線。本文の末尾には「欄の高さ − 読む線」の余白を CSS で取ってあり(`.topic-body`)、どの節も読む線まで送れる。
    const ReadingLine = 140;
    return Object.freeze({
      /**
       * 読む線(スクロールする領域の上端から 140px)より上に来た最後の節を、今の節にする。
       * @param tops 節の上端の、スクロールする領域の上端からの距離(節の順)
       * @returns 今の節の添字。上端が読む線(140 を含む)まで来た最後の節で、どれも来ていなければ最初の節。節が無ければ null
       */
      currentOf: (tops) => {
        if (tops.length === 0) return null;
        const passed = tops.findLastIndex((top) => top <= ReadingLine);
        return passed < 0 ? 0 : passed;
      },
    });
  })();

  /** ページが組み立てに使う解説の形。道筋とその先の値の種類(`Routes`)と、欠けてはいけない道筋(`Required`)で持つ。 */
  const ExplainShape = (() => {
    // 形を見る道筋と、その先の値の種類。`build-pr-explain.py` の Shapes から導いたものと同じ並びで、`pr-explain-core-cases.sh` が
    // 突き合わせる。primers・terms の下は Shapes から機械的に導くので、文字列をすべて見る(組み立てが落ちるキーを選り分けない)。
    // 必須の欠けも kind ごとに見る(`Required`)。`Dom.proseParts` と `TermMarks.piecesOf` は文を文字列として割り、抜粋の段は
    // `excerptBoxesOf` が `excerpt` の中を読むので、文字列でない値も欠けた値も組み立てを落とし、ページ全体を出なくする。impact は
    // 構造だけを見る(文は文字として入れるだけなので、表示できている解説を「解説なし」に変えない)。tests の下は Excerpt の中だけ
    // 見る(`ExcerptRows` が強調の要素を読む)。
    const ShapeKinds = Object.freeze({
      record: isRecord,
      records: isListOfRecords,
      ids: isStringList,
      id: isString,
      texts: isStringList,
      text: isString,
    });
    const Routes = Object.freeze([
      ["impact", "record"],
      ["impact.changed", "record"],
      ["impact.changed.before", "records"],
      ["impact.changed.before[].message", "id"],
      ["impact.changed.after", "records"],
      ["impact.changed.after[].message", "id"],
      ["impact.tables", "records"],
      ["impact.tables[].rowHeads", "records"],
      ["impact.tables[].rowHeads[].id", "id"],
      ["impact.tables[].columnHeads", "records"],
      ["impact.tables[].columnHeads[].id", "id"],
      ["impact.tables[].outcomes", "records"],
      ["impact.tables[].outcomes[].rowHead", "id"],
      ["impact.tables[].outcomes[].columnHead", "id"],
      ["impact.tables[].outcomes[].tests", "ids"],
      ["impact.added", "records"],
      ["impact.added[].before", "records"],
      ["impact.added[].before[].message", "id"],
      ["impact.added[].after", "records"],
      ["impact.added[].after[].message", "id"],
      ["impact.added[].tests", "ids"],
      ["impact.kept", "records"],
      ["impact.kept[].tests", "ids"],
      ["primers", "records"],
      ["primers[].id", "id"],
      ["primers[].category", "text"],
      ["primers[].label", "text"],
      ["primers[].gist", "text"],
      ["primers[].passages", "records"],
      ["primers[].passages[].text", "text"],
      ["primers[].passages[].code", "text"],
      ["primers[].passages[].parameters", "records"],
      ["primers[].passages[].parameters[].name", "text"],
      ["primers[].passages[].parameters[].type", "text"],
      ["primers[].passages[].parameters[].text", "text"],
      ["primers[].passages[].parameters[].note", "text"],
      ["primers[].passages[].excerpt", "record"],
      ["primers[].passages[].excerpt.path", "text"],
      ["primers[].passages[].excerpt.emphasis", "records"],
      ["primers[].occurrences", "records"],
      ["primers[].occurrences[].path", "text"],
      ["primers[].occurrences[].lineRange", "record"],
      ["primers[].occurrences[].text", "text"],
      ["primers[].occurrences[].shas", "texts"],
      ["primers[].seeAlso", "ids"],
      ["primers[].tests", "ids"],
      ["primers[].flows", "ids"],
      ["terms", "records"],
      ["terms[].id", "id"],
      ["terms[].label", "text"],
      ["terms[].text", "text"],
      ["tests[].excerpt.emphasis", "records"],
    ]);
    // 欠けていれば崩れとする道筋。primers・terms の下の必須のキーのうち、値が文(text)か 1 つのオブジェクト(record)のもの。
    // `kinds` は、手前のオブジェクトが kind で持つキーの決まるもの(Variant)なら、そのキーを必須とする kind の並びで、それ以外の
    // kind のオブジェクトには求めない。kind に依らないオブジェクト(Shape)なら null で、どれにも求める。Shapes と Variants から
    // 導いたものと同じ並びで、`pr-explain-core-cases.sh` が突き合わせる。配列は欠けても `listOf` が空として読むので入れない。
    const Required = Object.freeze([
      { route: "primers[].category", kinds: ["language", "codebase"] },
      { route: "primers[].label", kinds: ["language", "codebase"] },
      { route: "primers[].gist", kinds: ["language", "codebase"] },
      { route: "primers[].passages[].text", kinds: ["text", "caution", "memo", "rule", "spec", "history"] },
      { route: "primers[].passages[].code", kinds: ["declaration"] },
      { route: "primers[].passages[].parameters[].name", kinds: null },
      { route: "primers[].passages[].parameters[].type", kinds: null },
      { route: "primers[].passages[].parameters[].text", kinds: null },
      { route: "primers[].passages[].excerpt", kinds: ["excerpt"] },
      { route: "primers[].passages[].excerpt.path", kinds: null },
      { route: "primers[].occurrences[].path", kinds: null },
      { route: "primers[].occurrences[].text", kinds: null },
      { route: "terms[].label", kinds: null },
      { route: "terms[].text", kinds: null },
    ]);

    /** 道筋の先の値を集める。途中が欠けていれば集めない(必須の欠けは `lacks` が見る)。 */
    const valuesAt = (value, steps) => {
      if (steps.length === 0) return [value];
      const [step, ...rest] = steps;
      const { key, isEach } = routeStepOf(step);
      if (!isRecord(value) || value[key] === undefined) return [];
      const inner = value[key];
      if (!isEach) return valuesAt(inner, rest);
      return Array.isArray(inner) ? inner.flatMap((item) => valuesAt(item, rest)) : [];
    };
    /** `Required` の 1 件の道筋の最後の段のキーが、その手前のオブジェクトのうち、そのキーを求めるもの(`kinds`)のどれかに無いか。 */
    const lacks = (explain, { route, kinds }) => {
      const steps = route.split(".");
      const key = steps[steps.length - 1];
      const isAsked = (owner) => isRecord(owner) && (kinds === null || kinds.includes(owner.kind));
      return valuesAt(explain, steps.slice(0, -1)).some((owner) => isAsked(owner) && owner[key] === undefined);
    };
    const depthOf = (route) => route.split(".").length;

    return Object.freeze({
      Routes,
      Required,
      /**
       * ページが組み立てに使う形を見る。
       * @returns 型の違う道筋か、必須のキー(`Required`)が欠けた道筋(`impact.tables[].outcomes` の形)。崩れが 2 か所以上なら最も外側のもの。
       *   崩れていなければ null
       */
      problemOf: (explain) => {
        const mistyped = Routes.filter(([route, kind]) => valuesAt(explain, route.split(".")).some((value) => !ShapeKinds[kind](value))).map(([route]) => route);
        const lacking = Required.filter((required) => lacks(explain, required)).map(({ route }) => route);
        const broken = [...mistyped, ...lacking];
        if (broken.length === 0) return null;
        return broken.reduce((outer, candidate) => (depthOf(candidate) < depthOf(outer) ? candidate : outer));
      },
    });
  })();

  /** 解説の文の中の `` `…` ``(コード)。 */
  const CodeSpans = Object.freeze({
    /**
     * 文を `` ` `` で割り、コードの切れ端とそうでない切れ端を文の順に並べる。閉じていない最後の `` ` `` はコードにせず、文字のまま
     * 前の切れ端につなぐ(閉じているかは、渡した文の単位で決まる)。割り方は `build-pr-explain.py` の `code_spans_of` と同じで、
     * `pr-explain-core-cases.sh` が突き合わせる。
     * @returns `{isCode, text}` の並び。空の切れ端も出す
     */
    create: (text) => {
      const parts = text.split("`");
      const hasUnclosed = parts.length % 2 === 0;
      const paired = hasUnclosed ? [...parts.slice(0, -2), `${parts[parts.length - 2]}\`${parts[parts.length - 1]}`] : parts;
      return paired.map((part, index) => ({ isCode: index % 2 === 1, text: part }));
    },
  });

  /** 技術の手引きの本文に書く用語の印 `[[表示|用語の id]]`。 */
  const TermMarks = (() => {
    // 綴りは `build-pr-explain.py` の `TermMarkPattern` と同じで、`pr-explain-core-cases.sh` が突き合わせる。
    const Pattern = /\[\[([^\[\]|]+)\|([A-Za-z0-9][A-Za-z0-9_-]{0,63})\]\]/g;
    // 印を読む道筋。`build-pr-explain.py` の `routes_with(MarkedText)` と同じ綴り・同じ並びで、`pr-explain-core-cases.sh` が突き合わせる。
    const Routes = Object.freeze(["primers[].gist", "primers[].passages[].text", "primers[].passages[].parameters[].text"]);
    // 節の中の道筋(`primers[].` を外し、段に割ったもの)。
    const InPrimer = Routes.map((route) => route.replace(/^primers\[\]\./, "").split("."));
    /** 道筋の並びの最初の段を、並びの順に重複なく。 */
    const headsOf = (routes) => [...new Set(routes.map(([step]) => step))];
    /** 最初の段が `step` の道筋の、残りの段。 */
    const restsOf = (routes, step) => routes.filter(([head]) => head === step).map(([, ...rest]) => rest);
    const isRouteEnd = (routes) => routes.some((route) => route.length === 0);

    /**
     * 文を、印の外の文字と印に割る。空の文字は出さず、印になっていない `[[` は文字のまま残す。
     * @returns `{kind: "plain", text}` と `{kind: "term", label, id}` の並び(文の順)
     */
    const piecesOf = (text) => {
      const parts = text.split(Pattern);
      const plainAt = (index) => (parts[index] === "" ? [] : [{ kind: "plain", text: parts[index] }]);
      const marks = Array.from({ length: (parts.length - 1) / 3 }, (_, index) => ({ kind: "term", label: parts[index * 3 + 1], id: parts[index * 3 + 2] }));
      return [...plainAt(0), ...marks.flatMap((mark, index) => [mark, ...plainAt(index * 3 + 3)])];
    };

    /**
     * 道筋の先の値を `replace` で置き換える。途中が欠けていれば、その先は置き換えない。
     * @returns 置き換えた写し(`value`)と、置き換えた値を文書の順(道筋の段を並びの順に進む)に並べたもの(`ends`)
     */
    const replacedAlong = (value, routes, replace) => {
      if (isRouteEnd(routes)) {
        const replaced = replace(value);
        return { value: replaced, ends: [replaced] };
      }
      return headsOf(routes).reduce((sofar, step) => {
        const { key, isEach } = routeStepOf(step);
        if (sofar.value[key] === undefined) return sofar;
        const rests = restsOf(routes, step);
        const items = (isEach ? sofar.value[key] : [sofar.value[key]]).map((item) => replacedAlong(item, rests, replace));
        const inner = items.map((item) => item.value);
        return { value: { ...sofar.value, [key]: isEach ? inner : inner[0] }, ends: [...sofar.ends, ...items.flatMap((item) => item.ends)] };
      }, { value, ends: [] });
    };

    return Object.freeze({
      Pattern,
      Routes,
      piecesOf,
      /**
       * 節の、印を読む道筋の先の文を `piecesOf` の並びに置き換えた写しを返す。
       * @param primer 形の検査を通った解説の primers の 1 件
       */
      withPieces: (primer) => replacedAlong(primer, InPrimer, piecesOf).value,
      /**
       * 節の印が指す用語の id を、文書の順(要するに → 段を書いた順。段の中は text → 引数の順)に重複なく並べる。JSON に
       * キーを書いた順には依らない。
       * @param primer `withPieces` を通した節
       */
      termIdsOf: (primer) => {
        const pieces = replacedAlong(primer, InPrimer, (written) => written).ends.flat();
        return [...new Set(pieces.filter((piece) => piece.kind === "term").map((piece) => piece.id))];
      },
    });
  })();

  /** 抜粋の行。 */
  const ExcerptRows = Object.freeze({
    /**
     * 抜粋の行を、ファイルの行番号と強調の有無と字句にする。
     *
     * 強調の要素がオブジェクトかどうかは、骨組みの検査が見ている。start / end が数でなくても組み立ては落ちない(どの行が強調に
     * なるかは比較の型変換しだい。数かどうかは解説の検査が落とす)。
     * @param excerpt 中身(`text`)と、あれば開いた行(`openingLine`)を足した抜粋
     * @returns `{number, text, isEmphasized, tokens}` の並び。`number` は抜粋の `start` から数え、強調を省けばどの行も強調しない。
     *   `tokens` は 1 行目から読み進めた字句で、開いた行が文字列ならその埋め込みの中から読み始める
     */
    create: (excerpt) => {
      const emphasis = listOf(excerpt.emphasis);
      const grammar = Tokenizer.grammarOf(excerpt.path);
      const texts = excerpt.text.split("\n");
      const read = Tokenizer.tokenizeLines(texts, grammar, Tokenizer.startAfter(isString(excerpt.openingLine) ? excerpt.openingLine : null, grammar));
      return texts.map((text, index) => {
        const number = excerpt.start + index;
        return { number, text, isEmphasized: emphasis.some((span) => isWithin(number, span)), tokens: read[index].tokens };
      });
    },
  });

  /**
   * 技術の手引きの節の並び。解説の `primers` を、kind ごとのタブ(言語・フレームワーク / この PR の実装)に、書いた順で分ける。
   * 用語は `terms` を印から引き、節の用語とタブの用語集はどちらも印から導く(書かせない)。
   */
  const PrimerTopics = (() => {
    const PrimerKinds = Object.freeze({ Language: "language", Codebase: "codebase" });
    // この PR の実装の節で、状態を省いたもの(前からある)。言語・フレームワークの節は状態を持たない(null)。
    const Existing = "existing";
    // 段の kind。順と綴りは `build-pr-explain.py` の Variants の Passage と同じで、`pr-explain-core-cases.sh` が突き合わせる。
    const PassageKinds = Object.freeze(["text", "declaration", "parameters", "excerpt", ...Object.keys(Vocabulary.remarkKinds)]);

    /** 印を、用語に解く。terms に無い id の印は、表示の文字のまま(plain)にする。 */
    const resolvedPiecesOf = (pieces, termAt) => listOf(pieces).map((piece) => {
      if (piece.kind === "plain") return piece;
      if (!termAt.has(piece.id)) return { kind: "plain", text: piece.label };
      return { kind: "term", label: piece.label, term: termAt.get(piece.id) };
    });

    /** 段を描く形にそろえる。知らない kind の段は外す。 */
    const passagesOf = (passage, resolve) => {
      if (Object.hasOwn(Vocabulary.remarkKinds, passage.kind)) {
        const remark = Vocabulary.remarkKinds[passage.kind];
        return [{ kind: "remark", remark: passage.kind, label: remark.label, pieces: resolve(passage.text) }];
      }
      switch (passage.kind) {
        case "text":
          return [{ kind: "text", pieces: resolve(passage.text) }];
        case "declaration":
          return [{ kind: "declaration", code: passage.code }];
        case "parameters":
          return [{ kind: "parameters", parameters: listOf(passage.parameters).map((parameter) => ({ name: parameter.name, type: parameter.type, pieces: resolve(parameter.text), note: parameter.note ?? null })) }];
        case "excerpt":
          return [{ kind: "excerpt", excerpt: passage.excerpt }];
      }
      return [];
    };

    /** 出てくる場所。`destinations` は `shas` を書いた順に、そのコミットへの届き方を添える。 */
    const occurrenceOf = (occurrence, reachOf) => {
      const lineRange = occurrence.lineRange ?? null;
      const destinations = listOf(occurrence.shas).map((sha) => ({ sha, reach: reachOf({ sha, path: occurrence.path, lineRange }) }));
      return { path: occurrence.path, lineRange, text: occurrence.text, destinations };
    };

    const statusOf = (primer) => {
      if (primer.kind !== PrimerKinds.Codebase) return null;
      return Object.hasOwn(Vocabulary.primerStatuses, primer.status) ? primer.status : Existing;
    };

    const topicOf = (primer, { termAt, positionAt, testAt, flows, reachOf }) => {
      const marked = TermMarks.withPieces(primer);
      const resolve = (pieces) => resolvedPiecesOf(pieces, termAt);
      return {
        id: primer.id,
        kind: primer.kind,
        category: primer.category,
        label: primer.label,
        gist: resolve(marked.gist),
        passages: listOf(marked.passages).flatMap((passage) => passagesOf(passage, resolve)),
        occurrences: listOf(primer.occurrences).map((occurrence) => occurrenceOf(occurrence, reachOf)),
        seeAlso: valuesIn(positionAt, primer.seeAlso),
        terms: valuesIn(termAt, TermMarks.termIdsOf(marked)),
        status: statusOf(primer),
        tests: testEvidenceOf(primer.tests, testAt),
        flows: valuesIn(flows, primer.flows),
      };
    };

    /** タブの節と用語集。用語集は、節の用語を最初に出た順に重複なくつなぐ(1 つも無ければ null)。 */
    const tabOf = (topics) => {
      const terms = [...new Map(topics.flatMap((topic) => topic.terms).map((term) => [term.id, term])).values()];
      return { topics, glossary: terms.length === 0 ? null : { terms } };
    };

    return Object.freeze({
      PrimerKinds,
      Existing,
      PassageKinds,
      /** 使える解説が無いとき。 */
      Unexplained: Object.freeze({ kind: "none" }),
      /**
       * 最初に開くタブ。
       * @param primerTopics `create` が返した、書かれている技術の手引き
       * @returns 言語・フレームワークに節があればそれ、無くてこの PR の実装にあればそれ。どちらにも無ければ言語・フレームワーク
       */
      firstTabOf: (primerTopics) => {
        const hasLanguage = primerTopics.tabs[PrimerKinds.Language].topics.length > 0;
        const hasOnlyCodebase = !hasLanguage && primerTopics.tabs[PrimerKinds.Codebase].topics.length > 0;
        return hasOnlyCodebase ? PrimerKinds.Codebase : PrimerKinds.Language;
      },
      /**
       * 解説の `primers` を、タブごとの節の並びにする。
       * @param primers 形の検査を通った解説の `primers`(書いていなければ undefined)
       * @param terms 解説の `terms`(書いていなければ undefined)
       * @param testAt 解説のテストの id から、テスト画面と同じテストを引く表(`ExplainedMap` の `testAt`)
       * @param flows 解説の流れを id で引く表
       * @param reachOf 出てくる場所の 1 つの sha が、変更の経緯のどこまで届くかを返す(`{sha, path, lineRange}` を受け取る)
       * @returns `{kind: "unwritten"}`(`primers` が無いか空)か `{kind: "written", tabs}`。`tabs` はタブ(kind)ごとの
       *   `{topics, glossary}`。節の `status` は、この PR の実装の節なら added / changed / `Existing`、言語・フレームワークの節は null
       */
      create: ({ primers, terms, testAt, flows, reachOf }) => {
        const written = listOf(primers);
        if (written.length === 0) return { kind: "unwritten" };
        const termAt = new Map(listOf(terms).map((term) => [term.id, { id: term.id, label: term.label, text: term.text }]));
        const byTab = Object.fromEntries(Object.values(PrimerKinds).map((tab) => [tab, written.filter((primer) => primer.kind === tab)]));
        const positionAt = new Map(Object.entries(byTab).flatMap(([tab, list]) => list.map((primer, index) => [primer.id, { tab, index, label: primer.label }])));
        const context = { termAt, positionAt, testAt, flows, reachOf };
        return { kind: "written", tabs: Object.fromEntries(Object.entries(byTab).map(([tab, list]) => [tab, tabOf(list.map((primer) => topicOf(primer, context)))])) };
      },
    });
  })();

  /** 変更の地図(change-map.json)と解説(explain.json)の合流。 */
  const ExplainedMap = (() => {
    const MapVersion = 2;
    const ExplainVersion = 1;
    const ExplainListKeys = ["features", "layerRoles", "concepts", "messages", "flows", "commitStories", "suites", "tests"];

    const isBrokenList = (value) => value !== undefined && !isListOfRecords(value);
    const explainListOf = (explain, key) => (explain === null ? [] : listOf(explain[key]));
    const sumOf = (values) => values.reduce((sum, value) => sum + (typeof value === "number" ? value : 0), 0);
    const missing = (reason) => ({ kind: "missing", reason });

    const parsedJson = (text) => {
      try {
        return { isParsed: true, value: JSON.parse(text) };
      } catch (error) {
        return { isParsed: false, detail: error.message };
      }
    };

    /**
     * ページが組み立てに使う大まかな形だけを見る。細かい形は公開する前に build-pr-explain.py が見ている。
     * @returns 型が違うか、必須なのに欠けたキー(`impact`・`primers`・`terms`・`tests[].excerpt.emphasis` は道筋)。どちらも無ければ null
     */
    const shapeProblemOf = (explain) => {
      const overview = explain.overview;
      const hasOverview = isRecord(overview) && Array.isArray(overview.before) && Array.isArray(overview.after);
      if (typeof explain.sha !== "string") return "sha";
      if (!hasOverview) return "overview";
      const broken = ExplainListKeys.find((key) => isBrokenList(explain[key]));
      return broken === undefined ? ExplainShape.problemOf(explain) : broken;
    };

    /**
     * 読み込んだ解説を、使える解説か「解説なし」とその理由にする。
     * @param source `{kind: "text", text}`(読めた中身)/ `{kind: "absent"}`(置かれていない)/ `{kind: "failed", detail}`(読み込みの失敗)
     * @param pr 地図の PR 番号
     */
    const readingOf = (source, pr) => {
      if (source.kind === "absent") return missing({ kind: "absent" });
      if (source.kind === "failed") return missing({ kind: "unreadable", detail: source.detail });
      const json = parsedJson(source.text);
      if (!json.isParsed) return missing({ kind: "unreadable", detail: json.detail });
      const explain = json.value;
      if (!isRecord(explain)) return missing({ kind: "shape", key: null });
      if (explain.version !== ExplainVersion) return missing({ kind: "version", actual: explain.version });
      if (explain.pr !== pr) return missing({ kind: "pr", actual: explain.pr });
      const problem = shapeProblemOf(explain);
      return problem === null ? { kind: "explained", explain } : missing({ kind: "shape", key: problem });
    };

    /**
     * 箱と木に出すときのファイルの名前。`index.*` は名前がありふれているので親フォルダを付ける。
     * @returns `Hub.ts` / `px/index.ts` の形
     */
    const fileNameOf = (path) => {
      const parts = path.split("/");
      const name = parts[parts.length - 1];
      const isIndex = /^index\./.test(name) && parts.length > 1;
      return isIndex ? `${parts[parts.length - 2]}/${name}` : name;
    };

    const entryOf = (file, layer, concept) => {
      const hasFeature = concept !== null && typeof concept.feature === "string";
      const isDrawn = concept === null || concept.graph !== false;
      return {
        path: file.path,
        layer,
        changed: file.changed,
        status: file.changed ? file.status : null,
        oldPath: file.oldPath ?? null,
        additions: file.additions ?? null,
        deletions: file.deletions ?? null,
        target: file.target ?? null,
        conceptName: concept === null ? null : concept.name,
        fileName: fileNameOf(file.path),
        feature: hasFeature ? concept.feature : null,
        inGraph: isDrawn,
        concept,
      };
    };

    /** 木に出すファイル。変更ファイルと、concepts が名指ししたファイル(変更していなくても)。 */
    const entriesOf = (groups, conceptOf) => groups.flatMap((group) => group.files
      .filter((file) => file.changed || conceptOf.has(file.path))
      .map((file) => entryOf(file, group.label, conceptOf.get(file.path) ?? null)));

    /** 依存の線の向こう側にあって箱にならないファイル(「ほかに n ファイル」に畳むもの)を、箱ごとに足す。 */
    const withOthers = (entries, dependencies) => {
      const boxes = new Set(entries.filter((entry) => entry.inGraph).map((entry) => entry.path));
      const neighborsOf = (path) => dependencies.flatMap((edge) => {
        if (edge.from === path) return [edge.to];
        if (edge.to === path) return [edge.from];
        return [];
      });
      return entries.map((entry) => ({ ...entry, others: [...new Set(neighborsOf(entry.path))].filter((path) => !boxes.has(path)).sort() }));
    };

    const pathsOf = (entries) => entries.filter((entry) => entry.inGraph).map((entry) => entry.path);
    const treePathsOf = (entries) => entries.map((entry) => entry.path);

    const layerGroupsOf = (groups, entries, layerRoles) => groups.map((group) => {
      const members = entries.filter((entry) => entry.layer === group.label);
      const named = new Set(treePathsOf(members));
      const layerRole = layerRoles.find((candidate) => candidate.layer === group.label);
      return {
        kind: "layer",
        layer: group.label,
        role: layerRole === undefined ? null : layerRole.role,
        paths: pathsOf(members),
        treePaths: treePathsOf(members),
        others: group.files.map((file) => file.path).filter((path) => !named.has(path)),
      };
    });

    const featureGroupsOf = (features, entries) => {
      const known = new Set(features.map((feature) => feature.id));
      const assigned = features.map((feature) => {
        const members = entries.filter((entry) => entry.feature === feature.id);
        return { kind: "feature", feature, paths: pathsOf(members), treePaths: treePathsOf(members) };
      });
      const unassignedMembers = entries.filter((entry) => !known.has(entry.feature));
      if (unassignedMembers.length === 0) return assigned;
      return [...assigned, { kind: "unassigned", paths: pathsOf(unassignedMembers), treePaths: treePathsOf(unassignedMembers) }];
    };

    /** まとめ方ごとの組。`layer` は常にあり、`feature` は解説が features を持つときだけある。 */
    const groupingsOf = ({ groups, entries, explain }) => {
      const features = explainListOf(explain, "features");
      const byLayer = layerGroupsOf(groups, entries, explainListOf(explain, "layerRoles"));
      if (features.length === 0) return { layer: byLayer };
      return { layer: byLayer, feature: featureGroupsOf(features, entries) };
    };

    /**
     * 解説がいつの時点のものか。
     * @param explainedAt 解説の sha が地図のコミットの何番目か(無ければ -1)
     */
    const freshnessOf = ({ explain, head, commits, explainedAt }) => {
      if (explain === null) return { kind: "none" };
      if (explain.sha === head) return { kind: "latest", sha: explain.sha };
      if (explainedAt < 0) return { kind: "unknown", sha: explain.sha };
      return { kind: "stale", sha: explain.sha, after: commits.length - 1 - explainedAt };
    };

    /**
     * 出てくる場所の 1 つの sha が、変更の経緯のどこまで届くかを決める関数を作る。
     * @param commits 地図のコミット(古い順)
     * @param explainedAt 解説の sha が地図のコミットの何番目か(無ければ -1)
     * @returns `{sha, path, lineRange}` を受け取り、届き方を返す関数。地図に無い sha は `unmapped`、マージコミットは `merge`、
     *   そのコミットが `path` のファイルを変えていなければ `untouched`。行まで(`line`)届くのは、`lineRange` があり、そのコミットが
     *   解説の sha 以前で、あいだ(解説の sha を含む)にマージコミットも `path` を変えたコミットも無いときだけで、ほかは `file`
     */
    const reachOfIn = (commits, explainedAt) => ({ sha, path, lineRange }) => {
      const index = commits.findIndex((commit) => commit.sha === sha);
      if (index < 0) return { kind: "unmapped" };
      const commit = commits[index];
      if (commit.merge) return { kind: "merge" };
      if (!commit.files.some((file) => file.path === path)) return { kind: "untouched" };
      const shiftsLines = (later) => later.merge || later.files.some((file) => file.path === path || file.oldPath === path);
      const isLatestChange = index <= explainedAt && !commits.slice(index + 1, explainedAt + 1).some(shiftsLines);
      const reachesLine = lineRange !== null && isLatestChange;
      return reachesLine ? { kind: "line", lineRange } : { kind: "file" };
    };

    const commitsOf = ({ commits, explain, explainedAt }) => {
      const stories = new Map(explainListOf(explain, "commitStories").map((story) => [story.sha, story]));
      return commits.map((commit, index) => {
        const additions = sumOf(commit.files.map((file) => file.additions));
        const deletions = sumOf(commit.files.map((file) => file.deletions));
        const afterExplained = explainedAt >= 0 && index > explainedAt;
        return { ...commit, additions, deletions, story: stories.get(commit.sha) ?? null, afterExplained };
      });
    };

    const testKeyOf = (file, name) => JSON.stringify([file, name]);

    /**
     * テストの一覧。解説があれば解説のテストを並べ、解説に無い追加と、削除は地図から足す。
     * 追加か既存かは、テスト名を調べたファイルなら地図の追加にあるかで、このブランチで足したファイルなら追加、
     * それ以外のファイル(テスト名を調べていない)は判定なし(`unjudged`)にする。
     * @param addedFiles このブランチで足したファイルのパス
     */
    const testsOf = ({ mapTests, explain, targetOf, addedFiles }) => {
      const added = new Set(mapTests.added.map((test) => testKeyOf(test.file, test.name)));
      const examined = new Set(mapTests.files);
      const fromMap = (status) => (test) => ({ name: test.name, file: test.file, status, targets: targetOf(test.file), test: null, suite: null });
      const removed = mapTests.removed.map(fromMap("removed"));
      const suites = new Map(explainListOf(explain, "suites").map((suite) => [suite.id, suite]));
      const statusOf = (test, file) => {
        if (test.todo === true) return "todo";
        if (examined.has(file)) return added.has(testKeyOf(file, test.name)) ? "new" : "old";
