      const gist = sentences.length === 0 ? [] : [el("div", { class: "gist" }, [el("span", { class: "eyebrow", text: "要するに" }), ...sentences.map((sentence) => el("div", { class: "gist-line", "data-kind": sentence.kind }, [el("span", { class: "gist-mark" }), el("span", { text: sentenceTextOf(sentence, names) })]))])];
      const directed = (from) => between.filter((message) => unitIdOf(model, message.from) === from).toSorted(byMessageKind);
      const sections = [[edge.from, edge.to], [edge.to, edge.from]].map(([from, to]) => ({ from, to, messages: directed(from) })).filter((section) => section.messages.length > 0).map((section) => messageSectionOf({ title: `${names.get(section.from)} → ${names.get(section.to)}`, sub: `${section.messages.length} 件`, cards: section.messages.map((message) => messageCardOf(message, { peer: null, view })) }));
      const role = between.length > 0 ? "この2つが何を受け渡ししているか。矢印の向きは「頼む側 → 頼まれる側」。" : "コード上の依存はあるが、登録されたやりとりはありません(型の参照や見た目の部品など)。";
      return [
        detailHeadOf({ kind: "つながり", status: null, title: `${names.get(edge.from)} ⇄ ${names.get(edge.to)}`, path: null, role, actions: [] }),
        ...gist,
        ...sections,
        importsOf(dependenciesBetween(model, edge.key)),
      ];
    };

    const messageDetailOf = (view) => {
      const { model, focus } = view;
      const message = focus.message;
      const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
      const [fromName, toName] = [nameOfPath(message.from), nameOfPath(message.to)];
      const role = message.kind === "evt" ? `「${fromName}」から「${toName}」へ${verbOf("evt")}。` : `「${fromName}」が「${toName}」に${verbOf(message.kind)}。`;
      const members = [["送る側", fromName, ends[0]], ["受ける側", toName, ends[1]]].map(([key, name, id]) => pressable("button", { class: "member-button" }, [el("span", { class: "muted", text: key }), name], () => selectPlace(model.places.get(id))));
      const edge = focus.edge === null ? undefined : model.edgeAt.get(focus.edge);
      const siblings = edge === undefined || !model.isMessageView ? [] : edge.items.filter((item) => item.id !== message.id).toSorted(byMessageKind);
      const between = model.dependencies.filter((link) => (link.from === message.from && link.to === message.to) || (link.from === message.to && link.to === message.from));
      return [
        detailHeadOf({ kind: Vocabulary.messageKinds[message.kind].label, status: messageStatusOf(message), title: messageTextOf(message, state.naming), path: state.naming === "concept" ? message.code : message.name, role, actions: [el("div", { class: "member-row" }, members)] }),
        messageSectionOf({ title: "受け渡しの中身", sub: "", cards: [messageCardOf(message, { peer: null, view })] }),
        ...(siblings.length === 0 ? [] : [messageSectionOf({ title: "同じつながりの他のやりとり", sub: `${siblings.length} 件`, cards: siblings.map((item) => messageCardOf(item, { peer: null, view })) })]),
        importsOf(between),
      ];
    };

    const fileDetailOf = (view) => {
      const entry = view.focus.file;
      const role = entry.concept !== null && typeof entry.concept.role === "string" ? `${entry.concept.role} 依存グラフの対象外です。` : "依存グラフの対象外です。";
      const changes = entry.changed ? [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "コードの変更" }), changeItemOf(entry, false)])] : [];
      return [detailHeadOf({ kind: "ファイル", status: entryStatusOf(entry), title: ExplainedMap.nameOf(entry, state.naming), path: entry.path, role, actions: [] }), ...changes];
    };

    const detailOf = (view) => {
      switch (view.selected.kind) {
        case "file":
          return fileDetailOf(view);
        case "message":
          return messageDetailOf(view);
        case "edge":
          return edgeDetailOf(view);
        case "box":
          return boxDetailOf(view);
        case "group":
          return groupDetailOf(view);
      }
    };

    /** シーケンス図の 1 行。やりとりは番号つきの矢印(イベントは破線)、同じ単位の中は「内部で n 件」にまとめる。 */
    const sequenceRowOf = (row, { index, sequence, view }) => {
      const count = sequence.parts.length;
      const centerOf = (unit) => ((sequence.parts.indexOf(unit) + 0.5) / count) * 100;
      const isSelectedMessage = state.step === null && view.focus.message !== null && row.kind === "message" && row.message.id === view.focus.message.id;
      const isActive = state.step === index || isSelectedMessage;
      const node = pressable("div", { class: classesOf("sequence-row", { "is-active": isActive }), title: row.kind === "self" ? row.messages.map((message) => message.name).join(" → ") : `${Vocabulary.messageKinds[row.message.kind].label}:${row.message.name} (${row.message.code})` }, [], () => update({ step: state.step === index ? null : index }));
      if (row.kind === "self") {
        const self = el("div", { class: "sequence-self" }, [el("span", { class: "sequence-loop" }), el("span", { text: `内部で ${row.messages.length} 件` })]);
        self.style.left = `${centerOf(row.unit)}%`;
        node.append(self);
        return node;
      }
      const [from, to] = [centerOf(row.from), centerOf(row.to)];
      const isRightward = to > from;
      const span = { left: `${Math.min(from, to)}%`, width: `${Math.abs(to - from)}%` };
      const label = el("div", { class: "sequence-label" }, [el("span", { class: classesOf("sequence-text", { "is-code": state.naming === "file" }), "data-kind": row.message.kind }, [el("span", { class: "sequence-number mono", text: String(index + 1) }), el("span", { class: "kind-swatch" }), messageTextOf(row.message, state.naming), el("span", { class: "label-dot", "data-tone": messageToneOf(row.message) })])]);
      const line = el("div", { class: classesOf("sequence-line", { "is-event": row.message.kind === "evt" }), "data-kind": row.message.kind });
      const head = el("div", { class: classesOf("sequence-head", { "is-left": !isRightward }), "data-kind": row.message.kind });
      Object.assign(label.style, span);
      Object.assign(line.style, span);
      head.style.left = isRightward ? `calc(${to}% - 7px)` : `${to}%`;
      node.append(label, line, head);
      return node;
    };

    const sequenceDiagramOf = (sequence, view) => {
      const count = sequence.parts.length;
      const columns = `repeat(${count}, minmax(0, 1fr))`;
      const parts = sequence.parts.map((id) => {
        const place = view.model.places.get(id);
        const isPicked = view.focus.units.has(id);
        const isStep = view.step !== null && view.step.units.has(id);
        const sub = place.kind === "group" ? "グループ" : entryAt.get(place.path).layer;
        const isCode = place.kind === "box" && isFileNamed(entryAt.get(place.path));
        return el("div", { class: "sequence-part-cell" }, [el("div", { class: classesOf("sequence-part", { "is-picked": isPicked, "is-step": !isPicked && isStep }), title: placeNameOf(place) }, [el("span", { class: classesOf("sequence-part-name", { "is-code": isCode }), text: placeNameOf(place) }), el("span", { class: "sequence-part-sub", text: sub })])]);
      });
      const lifelines = sequence.parts.map((id, index) => {
        const line = el("div", { class: classesOf("sequence-lifeline", { "is-lit": view.focus.units.has(id) || (view.step !== null && view.step.units.has(id)) }) });
        line.style.left = `${((index + 0.5) / count) * 100}%`;
        return line;
      });
      const head = el("div", { class: "sequence-parts" }, parts);
      head.style.gridTemplateColumns = columns;
      const body = el("div", { class: "sequence-body" }, [...lifelines, head, el("div", { class: "sequence-rows" }, sequence.rows.map((row, index) => sequenceRowOf(row, { index, sequence, view })))]);
      body.style.minWidth = `${count * SequenceColumnWidth}px`;
      const note = `${count} の参加者 · ${sequence.rows.length} ステップ${count > 5 ? " — グループを折りたたむと簡潔になります" : ""}`;
      return [
        el("div", { class: "sequence" }, [body]),
        el("span", { class: "muted small", text: note }),
        el("div", { class: "sequence-legend" }, [
          el("span", {}, [el("span", { class: "legend-line" }), "コマンド・クエリ"]),
          el("span", {}, [el("span", { class: "legend-line is-event" }), "イベント(通知)"]),
          ...Object.values(MessageStatuses).map((status) => el("span", { "data-tone": status.tone }, [el("span", { class: "status-dot" }), status.label])),
          el("span", { text: "行をクリックでグラフに表示" }),
        ]),
      ];
    };

    const renderFlows = (view) => {
      const { sequence, selected } = view;
      const isFileOnly = selected !== null && selected.kind === "file";
      flowSection.hidden = flows.length === 0 || isFileOnly;
      if (flowSection.hidden) return;
      const tabs = sequence.relevant.map((flow) => pressable("button", { class: "pill-button", "aria-pressed": String(sequence.flow !== null && flow.id === sequence.flow.id), text: flow.label }, [], () => update({ flow: flow.id, step: null })));
      const empty = sequence.relevant.length === 0 ? [el("span", { class: "side-sub", text: "この要素を通る代表的な操作の流れは登録されていません。" })] : [];
      const diagram = sequence.parts.length === 0 ? [] : sequenceDiagramOf(sequence, view);
      flowSection.replaceChildren(eyebrowOf("やりとりの流れ", selected === null ? "代表的なユーザー操作" : "これを通る操作"), el("div", { class: "pill-row" }, tabs), ...empty, ...diagram);
    };

    const renderSide = (view, isNewSelection) => {
      renderSideBar(view);
      const body = view.selected === null ? overviewOf(view.model) : detailOf(view);
      renderFlows(view);
      const scrollTop = side.scrollTop;
      side.replaceChildren(...body, flowSection);
      side.scrollTop = isNewSelection ? 0 : scrollTop;
    };

    let shownKey = null;
    const render = () => {
      const model = modelOf(state);
      const selected = validSelectionOf(state.selected, model);
      state = { ...state, selected };
      const focus = focusOf(model, selected);
      const sequence = sequenceOf(model, focus, selected);
      const view = { model, selected, focus, sequence, step: stepOf(model, sequence) };
      lastView = view;
      const key = selectionKeyOf(selected);
      const isNewSelection = key !== shownKey;
      shownKey = key;
      renderControls();
      renderCanvasControls(model);
      renderTree(view);
      renderGraph(view);
      renderSide(view, isNewSelection);
      const current = isNewSelection ? treeBody.querySelector(".tree-row.is-current") : null;
      if (current !== null) current.scrollIntoView({ block: "nearest" });
    };

    /** 流れを選んだ状態にし、右のパネルをその流れまで送る。 */
    const showFlow = (id) => {
      pick(null, { flow: id });
      flowSection.scrollIntoView({ block: "start" });
    };

    /**
     * やりとりを選んだ状態にする。表示範囲の絞り込みは外す(絞り込んで他を非表示にしているときは、範囲の外のやりとりが図に無いため)。
     * 両端が図の箱でないやりとりは、絞り込みを外しても図に無いので選ばない。
     */
    const showMessage = (id) => {
      if (isDrawnMessage(lookup.messages.get(id), entryAt)) pick({ kind: "message", id }, { scope: null });
    };

    render();

    /** Backspace / Alt+← で前の選択に戻る。入力欄の中では戻らない。 */
    const onKey = (event) => {
      const isBackspace = event.key === "Backspace" && !event.metaKey && !event.ctrlKey;
      const isAltLeft = event.altKey && event.key === "ArrowLeft";
      const isBack = (isBackspace || isAltLeft) && !isTypingIn(event);
      if (!isBack) return;
      event.preventDefault();
      goBack();
    };

    return {
      summary: [countsOf(`${explained.totals.files} files`, explained.totals.additions, explained.totals.deletions)],
      controls: [controlNodes.grouping, controlNodes.level, controlNodes.scope, controlNodes.focus],
      tablist: null,
      left: panelOf("left", [panelHead("ファイル", `${changedCount} 件の変更`, [el("span", { class: "spacer" }), changedOnlySwitch]), treeBody]),
      main: graph.element,
      right: panelOf("right", [sideBar, side]),
      onKey,
      showFlow,
      showMessage,
    };
  };

  // 振る舞いの画面の節の小見出し(節の種類ごと)。
  const ImpactEyebrows = { changed: "前と後", table: "状況ごと", added: "増えた状況", kept: "前と同じ" };
  // 節の頭の札を、節の種類から引く表。表の札は変わったマスの件数から組むので、ここには無い。
  const ImpactChipLabelsByKind = { changed: "この PR で変わった", added: "この PR で増えた状況", kept: "変わらない" };

  /** 節が、この PR で変わった・増えたことを書いているか(目次の印・節の札・目次の小見出しの件数)。 */
  const isChangeTopic = (topic) => {
    switch (topic.kind) {
      case "changed":
      case "added":
        return true;
      case "table":
        return topic.changedCount > 0;
      case "kept":
        return false;
    }
  };

  /** 節の頭の札。変わったマスの無い表には付けない。 */
  const impactChipOf = (topic) => {
    const isChange = isChangeTopic(topic);
    if (topic.kind !== "table") return { tone: isChange ? "A" : "", label: ImpactChipLabelsByKind[topic.kind] };
    return isChange ? { tone: "A", label: `変わったマス ${topic.changedCount}` } : null;
  };

  /** 目次の小見出し。変わったマスのある表は件数を添える。 */
  const tocEyebrowOf = (topic) => {
    const hasChangedOutcomes = topic.kind === "table" && isChangeTopic(topic);
    return hasChangedOutcomes ? `${ImpactEyebrows.table} · 変わった ${topic.changedCount}` : ImpactEyebrows[topic.kind];
  };

  /** 節の根拠のうち、まだ書かれていないテスト(2 か所で挙げていても 1 件)。 */
  const missingTestsOf = (topic) => [...new Map(ImpactTopics.evidencePlacesOf(topic).flatMap((place) => place.evidence.missing).map((test) => [test.test.id, test])).values()];

  /**
   * 変わらないことの行の札。
   *
   * 「テストあり」とは書かない。未実装のテストだけを挙げた行も「あり」と読めるので、確かめているテストがあるかを札にする。
   */
  const guardOf = (evidence) => el("span", { class: classesOf("impact-guard", { "is-missing": !evidence.isGuarded }), text: evidence.isGuarded ? "テストで守っている" : "この PR では未確認" });

  /** これまで / これからのカード。行は使う人の言葉なので、書いたまま出す。 */
  const impactSidesOf = (topic) => beforeAfterCardsOf({
    cards: [
      { title: "これまで", sub: "", lines: topic.before, empty: "(この PR より前には無かった)" },
      { title: "これから", sub: "", lines: topic.after, empty: null },
    ],
    itemOf: (line) => el("div", { class: "behavior-item" }, [el("span", { text: line.text })]),
  });
  const impactTextOf = (text) => (text === null ? [] : [el("p", { class: "topic-text", text })]);

  /**
   * 節を 3 列(左に目次・中に節・右に今の節の欄)に並べ、本文のスクロールに合わせて今の節を決める。振る舞いと技術の手引きの
   * 2 画面が使う。狭い幅では右の欄を隠し、同じ中身を各節に畳んで出す(CSS)。節の頭・右の欄の頭・目次の行はここで組む。
   *
   * ここの DOM の配線(スクロールの購読・目次の押下・右の欄と畳んだ根拠の描き直し)と、2 画面がそれぞれ足す配線は判定表を
   * 通らず、表示確認(`rules/ui-verification.md`)でしか守られていない。見た目の比べには比べる写しと解説が要るので、繰り返し走る
   * 検査にはしていない。
   */
  const TopicColumns = (() => {
    const chipOf = ({ tone, label }) => el("span", { class: "chip", "data-tone": tone, text: label });
    const headOf = (topic) => el("div", { class: "topic-head" }, [
      el("div", { class: "section-head" }, [el("span", { class: "topic-eyebrow", text: topic.eyebrow }), ...topic.chips.map(chipOf)]),
      el("h2", { class: "prose" }, [el("span", { class: "topic-hash", text: "#" }), ...topic.labelPartsOf()]),
    ]);
    const sideHeadOf = (topic) => el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: topic.eyebrow }), el("h2", { class: "prose" }, topic.labelPartsOf())]);
    const tocPartsOf = (topic) => {
      const dot = topic.dotTone === null ? [] : [el("span", { class: "status-dot", "data-tone": topic.dotTone })];
      return [el("span", { class: "row-sub", text: topic.tocEyebrow }), el("span", { class: "change-head" }, [...dot, el("span", { class: "row-title prose" }, topic.labelPartsOf())])];
    };

    return Object.freeze({
      /**
       * 節の 3 列を組み、最初に 1 回描く。今の節は、節が 0 件なら null、ほかは最初の節から始める。
       * @param topics 節の並び。1 件は次のものを持つ
       *   - `attributes` 節の要素(article)に付ける属性
       *   - `eyebrow` 節の頭と右の欄の頭の小見出し。`tocEyebrow` 目次の行の小見出し
       *   - `chips` 節の頭の札(`{tone, label}`)の並び。`dotTone` 目次の行の点の色(点を出さないなら null)
       *   - `labelPartsOf` 題の中身を返す。節の頭・右の欄の頭・目次の 3 か所に出すので、呼ぶたびに新しく作る
       *   - `tocDivider` 目次で、その行の前に挟む区切りの文(無ければ null)
       *   - `inlineSummary` 畳んだ欄の summary の文。`body` 本文の要素の並び
       *   - `sideBlocksOf` 右の欄と畳んだ欄の中身を返す。呼ぶたびに新しく作る
       * @param emptySide 節が無いときの右の欄の文
       * @returns `articles`(節の要素)・`toc`(目次の欄。節が無ければ空の文)・`inlineHolders`(畳んだ欄の中身を入れる要素)・
       *   `side`(右の欄)と、`follow(top)`(スクロールに合わせて今の節を決め直す)・`sendTo(index)`(節へ送る)・`render()`(描き直す)
       */
      create: ({ topics, emptySide }) => {
        let current = topics.length === 0 ? null : 0;
        let shownCurrent = null;
        const side = el("div", { class: "side" });
        const inlineHolders = topics.map(() => el("div", { class: "side" }));
        const articles = topics.map((topic, index) => el("article", { class: "topic", ...topic.attributes }, [
          headOf(topic),
          el("details", { class: "topic-inline" }, [el("summary", { text: topic.inlineSummary }), inlineHolders[index]]),
          ...topic.body,
        ]));

        const render = () => {
          for (const [index, row] of tocRows.entries()) row.classList.toggle("is-current", index === current);
          for (const [index, holder] of inlineHolders.entries()) holder.replaceChildren(...topics[index].sideBlocksOf());
          side.replaceChildren(...(current === null ? [el("p", { class: "side-note", text: emptySide })] : [sideHeadOf(topics[current]), ...topics[current].sideBlocksOf()]));
          if (current !== shownCurrent) side.scrollTop = 0;
          shownCurrent = current;
        };

        /**
         * 節へ送る。今の節はスクロールを待たずにその節にする。
         *
         * 今の節が同じでも描き直す(`showMention` が選び直したマスの根拠を、ここで描かせるため)。
         */
        const sendTo = (index) => {
          current = index;
          render();
          articles[index].scrollIntoView({ block: "start" });
        };
        const tocRows = topics.map((topic, index) => pressable("button", { class: "row plain-button" }, tocPartsOf(topic), () => sendTo(index)));
        const tocItems = topics.flatMap((topic, index) => [...(topic.tocDivider === null ? [] : [el("div", { class: "topic-toc-divider", text: topic.tocDivider })]), tocRows[index]]);
        const toc = el("div", { class: "panel-scroll" }, tocItems.length > 0 ? tocItems : [emptyOf("節がありません。")]);

        /**
         * スクロールに合わせて今の節を決め直す。変わったときだけ描き直す。
         * @param top スクロールしている領域の上端の、表示領域の上端からの距離
         */
        const follow = (top) => {
          const next = TopicScroll.currentOf(articles.map((article) => article.getBoundingClientRect().top - top));
          if (next === current) return;
          current = next;
          render();
        };

        render();
        return { articles, toc, inlineHolders, side, follow, sendTo, render };
      },
      /**
       * 本文の欄とページ全体のスクロールを `follow` へ渡す。
       * @param main 本文の欄(`main.stage`)
       * @param follow スクロールしている領域の上端の位置を受け取る
       */
      subscribe: ({ main, follow }) => {
        const isShown = () => {
          const screen = main.closest(".screen");
          return screen !== null && !screen.hidden;
        };
        // スクロールしているのが本文の欄(広い幅)かページ全体(狭い幅)かは CSS の `@media` が決めるので、イベントの出どころで見分ける。
        main.addEventListener("scroll", () => follow(main.getBoundingClientRect().top), { passive: true });
        // ページ全体のスクロールは、その画面が隠れているあいだはほかの画面のものなので見ない。
        window.addEventListener("scroll", () => {
          if (isShown()) follow(0);
        }, { passive: true });
      },
    });
  })();

  /**
   * 振る舞い。左に節の目次、中に使う人から見た変化の節、右に今の節の根拠(テストと仕組み)を出す。
   *
   * 表示確認でしか守られていない DOM の配線(理由は `TopicColumns`): マスの押下と `aria-pressed`。
   */
  const ImpactScreen = (explained, go) => {
    const impactTopics = explained.impactTopics;
    const topics = impactTopics.kind === "written" ? impactTopics.topics : [];
    // `selected` は表ごとに選んでいるマス(節の id → `{row, column}`)。表は最初の「変わった」マス(無ければ先頭のマス)を選んで始める。
    let selected = Object.fromEntries(topics.filter((topic) => topic.kind === "table").map((topic) => [topic.id, ImpactTopics.firstCellOf(topic)]));

    /** マスの鍵。`cell` は `{row, column}` を持つもの(マスか選択)。 */
    const cellKeyOf = (topicId, cell) => JSON.stringify([topicId, cell.row, cell.column]);
    const cellNodes = new Map();
    const body = el("div", { class: "stage-body topic-body" });
    const main = el("main", { class: "stage" }, [body]);

    /** その表で選んでいるマス。マスが 1 つも無い表は null。 */
    const selectedOutcomeIn = (topic) => {
      const cell = selected[topic.id];
      if (cell === null) return null;
      return topic.outcomes.find((outcome) => outcome.row === cell.row && outcome.column === cell.column);
    };

    const testCardOf = (test) => testJumpCardOf(test, go);

    /** 仕組みのチップ。両端が図の箱でないやりとりは構造マップで選べないので、押せなくして「図に無い」と出す。 */
    const mechanismChipOf = ({ message, isDrawn }) => {
      const title = isDrawn ? "構造マップでこのやりとりを見る" : "両端が図の箱でないので、構造マップでは選べません";
      const chip = pressable("button", { class: "flow-chip", title }, [message.name, el("span", { class: "arrow", text: isDrawn ? "↗" : "図に無い" })], () => go.toMessage(message.id));
      chip.disabled = !isDrawn;
      return chip;
    };
    const mechanismsBlockOf = (mechanisms) => (mechanisms.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("仕組みを知りたいとき", "構造マップ"), el("div", { class: "flow-chips" }, mechanisms.map(mechanismChipOf))])]);

    /**
     * 節の根拠の要素。右の欄と、狭い幅で各節に畳んだ根拠の両方がこれを出す。
     * @param topic 根拠を出す節(表なら、その表で選んでいるマスの根拠)
     */
    const evidenceBlocksOf = (topic) => {
      switch (topic.kind) {
        case "changed": {
          const blocks = mechanismsBlockOf(topic.mechanisms);
          return blocks.length > 0 ? blocks : [el("p", { class: "side-note", text: "前後の行が指しているやりとりはありません。" })];
        }
        case "table": {
          const outcome = selectedOutcomeIn(topic);
          if (outcome === null) return [el("p", { class: "side-note", text: "この表には、書かれたマスがありません。" })];
          return [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "状況" }), el("span", { class: "side-sub", text: outcome.situation })]), ...testsBlocksOf(outcome.tests, go)];
        }
        case "added":
          return [...testsBlocksOf(topic.tests, go), ...mechanismsBlockOf(topic.mechanisms)];
        case "kept":
          return topic.lines.map((line) => el("div", { class: "side-block" }, [
            el("span", { class: "side-sub", text: line.text }),
            guardOf(line.tests),
            ...line.tests.verifying.map(testCardOf),
            ...(line.tests.missing.length === 0 ? [] : [eyebrowOf("無いテスト", "未実装(提案)"), ...line.tests.missing.map(testCardOf)]),
          ]));
      }
    };

    /** 表のマス。書かれていない組み合わせは空きにする。押すとそのマスを選ぶ(選び直すまで、スクロールしても外さない)。 */
    const outcomeNodeOf = (topic, outcome) => {
      if (outcome === null) return el("div", { class: "impact-cell is-missing", text: "(書かれていない)" });
      const was = outcome.was === null ? [] : [el("span", { class: "impact-cell-was" }, ["これまで: ", el("s", { text: outcome.was })])];
      const note = outcome.note === null ? [] : [el("span", { class: "impact-cell-was", text: outcome.note })];
      const node = pressable("button", { class: classesOf("impact-cell", { "is-changed": outcome.isChanged }), "aria-pressed": "false", title: outcome.situation }, [
        el("span", { class: "impact-cell-badge", text: outcome.isChanged ? "変わった" : "変わらない" }),
        el("span", { class: "impact-cell-result", text: outcome.result }),
        ...was,
        ...note,
      ], () => selectCell(topic.id, outcome));
      cellNodes.set(cellKeyOf(topic.id, outcome), node);
      return node;
    };

    const situationTableOf = (topic) => el("div", { class: "impact-table-wrap" }, [el("table", { class: "impact-table" }, [
      el("thead", {}, [el("tr", {}, [el("td"), ...topic.columns.map((column) => el("th", { scope: "col", text: column.label }))])]),
      el("tbody", {}, topic.rows.map((row) => el("tr", {}, [
        el("th", { scope: "row" }, [row.head.label, ...(row.head.note === null ? [] : [el("small", { text: row.head.note })])]),
        ...row.outcomes.map((outcome) => el("td", {}, [outcomeNodeOf(topic, outcome)])),
      ]))),
    ])]);

    /** 本文には、まだ書かれていないテストの件数だけを出す。中身は根拠の「無いテスト」にある。 */
    const missingNoteOf = (topic) => {
      const count = missingTestsOf(topic).length;
      if (count === 0) return [];
      return [el("div", { class: "topic-note", "data-remark": "caution" }, [el("span", { class: "topic-note-label", text: "まだ書かれていないテスト" }), el("span", { text: `${count} 件あります。中身は根拠の「無いテスト」に出ています。` })])];
    };

    const topicBodyOf = (topic) => {
      switch (topic.kind) {
        case "changed":
          return [impactSidesOf(topic), ...impactTextOf(topic.text)];
        case "table": {
          const gist = topic.gist === null ? [] : [el("div", { class: "topic-gist" }, [el("span", { class: "topic-gist-label", text: "要するに" }), el("span", { class: "topic-gist-text", text: topic.gist })])];
          return [...gist, situationTableOf(topic), ...impactTextOf(topic.text), ...missingNoteOf(topic)];
        }
        case "added":
          return [impactSidesOf(topic), ...impactTextOf(topic.text), ...missingNoteOf(topic)];
        case "kept":
          return [el("ul", { class: "impact-kept" }, topic.lines.map((line) => el("li", {}, [el("span", { class: "impact-kept-text", text: line.text }), guardOf(line.tests)]))), ...missingNoteOf(topic)];
      }
    };

    const ledeOfImpact = () => {
      const eyebrow = el("span", { class: "eyebrow", text: "振る舞い · 使う人から見て変わったこと" });
      switch (impactTopics.kind) {
        case "none":
          return [el("div", { class: "lede" }, [eyebrow, emptyOf("解説が無いので、振る舞いは出せません。理由は上の帯に出ています。")])];
        case "unwritten":
          return [el("div", { class: "lede" }, [eyebrow, emptyOf("この解説には、使う人から見て何が変わったか(振る舞い)が書かれていません。変更の経緯の「ブランチ全体の流れ」に、これまで / このブランチのあとがあります。")])];
        case "written": {
          const lede = el("div", { class: "lede" }, [eyebrow, el("h1", { text: impactTopics.title }), el("p", { text: impactTopics.lead })]);
          return topics.length > 0 ? [lede] : [lede, emptyOf("状況ごとの振る舞いは書かれていません。")];
        }
      }
    };

    const columns = TopicColumns.create({
      topics: topics.map((topic) => {
        const chip = impactChipOf(topic);
        return {
          attributes: { "data-topic": topic.id },
          eyebrow: ImpactEyebrows[topic.kind],
          tocEyebrow: tocEyebrowOf(topic),
          chips: chip === null ? [] : [chip],
          dotTone: isChangeTopic(topic) ? "A" : "",
          labelPartsOf: () => [topic.label],
          tocDivider: null,
          inlineSummary: "根拠(テストと仕組み)",
          body: topicBodyOf(topic),
          sideBlocksOf: () => evidenceBlocksOf(topic),
        };
      }),
      emptySide: "根拠を出す節がありません。",
    });

    /** 選んでいるマスに `aria-pressed` を付け直す。 */
    const renderPressed = () => {
      const selectedKeys = new Set(Object.entries(selected).filter(([, cell]) => cell !== null).map(([topicId, cell]) => cellKeyOf(topicId, cell)));
      for (const [key, node] of cellNodes) node.setAttribute("aria-pressed", String(selectedKeys.has(key)));
    };
    /** 表のマスを選び直す。今の節は変えない。 */
    const selectCell = (topicId, outcome) => {
      selected = { ...selected, [topicId]: { row: outcome.row, column: outcome.column } };
      renderPressed();
      columns.render();
    };
    renderPressed();

    body.replaceChildren(...ledeOfImpact(), ...columns.articles);
    TopicColumns.subscribe({ main, follow: columns.follow });

    return {
      summary: [],
      controls: [],
      tablist: null,
      left: panelOf("left", [panelHead("目次", "変わった → 変わらない"), columns.toc]),
      main,
      right: panelOf("right", [panelHead("根拠", "テストと仕組み"), columns.side]),
      /**
       * 他の画面から、その節へ送る。表のマスを指していれば、そのマスを選んで見える位置へ送る。
       * @param mention `ImpactTopics.mentionsOf` の 1 件
       */
      showMention: (mention) => {
        const index = topics.findIndex((topic) => topic.id === mention.topic);
        if (mention.cell === null) {
          columns.sendTo(index);
          return;
        }
        selected = { ...selected, [mention.topic]: mention.cell };
        renderPressed();
        columns.sendTo(index);
        cellNodes.get(cellKeyOf(mention.topic, mention.cell)).scrollIntoView({ block: "nearest", inline: "nearest" });
      },
    };
  };

  // 技術の手引きのタブごとの文言。`chip` は関連のチップに添える、移る先のタブの短い名前。
  const PrimerTabTexts = {
    language: {
      label: "言語・フレームワーク",
      chip: "言語",
      description: "言語とフレームワークの書き方",
      tocNote: "差分に出てくる順",
      eyebrow: "技術の手引き · 言語・フレームワーク",
      title: "この PR を読むのに要る、言語とフレームワークの知識",
      lead: "この PR の差分に出てくる書き方を、出てくる場所と一緒にまとめています。順に読む必要はありません。差分を読んでいて引っかかったところだけ引いてください。このリポジトリ固有の仕組みは「この PR の実装」タブにあります。",
    },
    codebase: {
      label: "この PR の実装",
      chip: "実装",
      description: "このリポジトリで決めている形と、この PR で足した仕組み",
      tocNote: "全体から部品へ",
      eyebrow: "技術の手引き · この PR の実装",
      title: "この PR が使っている、このリポジトリの仕組み",
      lead: "言語の機能ではなく、pdfmod の中で決めている形です。全体の流れから入り、部品へ降りる順に並べています。この PR で足したもの・変えたもの・前からあるものを札で分けています。",
    },
  };
  const PrimerSideTitle = "この PR で出てくる場所";
  const PrimerEmptySide = "出てくる場所を出す節がありません。";
  const TabMoveKeys = { ArrowRight: 1, ArrowLeft: -1 };

  /** 実装の節の札(状態の色と名前)。状態を省いた節(`PrimerTopics.Existing`)は「前からある」で、色の区分を持たない(`.chip` の地と文字の色)。 */
  const primerChipOf = (status) => (status === PrimerTopics.Existing ? { tone: "", label: "前からある" } : Vocabulary.primerStatuses[status]);

  /**
   * 技術の手引き。上にタブ、左に目次、中に今のタブの節、右に今の節の出てくる場所・根拠・用語を出す。
   *
   * 表示確認でしか守られていない DOM の配線(理由は `TopicColumns`): タブの切り替えと位置の保存・復元・最初に開くタブの適用・
   * 関連のチップ・用語の光・出てくる場所のボタンの移り先(行 / ファイル / コミット)。
   */
  const PrimerScreen = (explained, go) => {
    const primerTopics = explained.primerTopics;
    const main = el("main", { class: "stage" });
    const left = panelOf("left", []);
    const right = panelOf("right", []);
    const screenParts = { summary: [], controls: [], main, left, right };

    const emptyLedeOf = (text) => el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "技術の手引き" }), emptyOf(text)]);
    /** 節の無いときの 3 列。本文は小見出しと空の文だけ。 */
    const emptyScreenOf = (text) => {
      const columns = TopicColumns.create({ topics: [], emptySide: PrimerEmptySide });
      main.replaceChildren(el("div", { class: "stage-body topic-body" }, [emptyLedeOf(text)]));
      left.replaceChildren(panelHead("目次", ""), columns.toc);
      right.replaceChildren(panelHead(PrimerSideTitle, ""), columns.side);
      return { ...screenParts, tablist: null };
    };
    switch (primerTopics.kind) {
      case "none":
        return emptyScreenOf("解説が無いので、技術の手引きは出せません。理由は上の帯に出ています。");
      case "unwritten":
        return emptyScreenOf("この解説には、技術の手引きが書かれていません。");
      case "written":
        break;
    }

    const tabs = Object.values(PrimerTopics.PrimerKinds);
    const termListOf = (terms) => el("dl", { class: "primer-terms" }, terms.map((term) => el("div", { class: "primer-term", "data-term": term.id }, [el("dt", { text: term.label }), prose("dd", {}, term.text)])));

    /** 出てくる場所の 1 つの sha の、ボタンの名前と押したときの移り先。届かない sha は、何が起きるかの注意(`warning`)を添える。 */
    const destinationOf = ({ sha, reach }, path) => {
      const toCommit = () => go.toCommit(sha);
      switch (reach.kind) {
        case "line":
        case "file":
          return { label: "差分で見る", onPress: () => go.toCommitFile({ sha, path, lineRange: reach.kind === "line" ? reach.lineRange : null }), warning: null };
        case "untouched":
          return { label: "コミットを見る", onPress: toCommit, warning: "このコミットは、このパスのファイルを変えていません。当時は別のパスだったのかもしれません(コミットの先頭を開きます)" };
        case "merge":
          return { label: "コミットを見る", onPress: toCommit, warning: "マージコミットなので差分がありません(コミットの先頭を開きます)" };
        case "unmapped":
          return { label: "ブランチ全体の流れを見る", onPress: toCommit, warning: "変更の地図に無いコミットなので差分がありません(ブランチ全体の流れを開きます)" };
      }
    };
    const destinationNodesOf = (destination, path) => {
      const { label, onPress, warning } = destinationOf(destination, path);
      const link = commitLinkOf({ sha: destination.sha, label, commitAt: explained.commitAt, onPress });
      return [link, ...(warning === null ? [] : [el("span", { class: "warn-text", text: warning })])];
    };

    const occurrencesBlockOf = (topic) => el("div", { class: "side-block" }, [
      eyebrowOf("出てくる場所", `${topic.occurrences.length} か所`),
      ...topic.occurrences.map((occurrence) => el("div", { class: "primer-occurrence" }, [
        el("span", { class: "primer-occurrence-path", text: occurrence.lineRange === null ? occurrence.path : `${occurrence.path} ${lineRangeOf(occurrence.lineRange)}` }),
        prose("span", { class: "side-sub" }, occurrence.text),
        ...occurrence.destinations.flatMap((destination) => destinationNodesOf(destination, occurrence.path)),
      ])),
    ]);

    /** 節の右の欄(と畳んだ欄)の中身。出てくる場所 → (実装だけ)テスト・構造マップ → 関連 → 用語。 */
    const topicSideBlocksOf = (topic, showSeeAlso) => {
      const isCodebase = topic.kind === PrimerTopics.PrimerKinds.Codebase;
      const showsTests = isCodebase && topic.tests.verifying.length + topic.tests.missing.length > 0;
      const tests = showsTests ? testsBlocksOf(topic.tests, go) : [];
      const showsFlows = isCodebase && topic.flows.length > 0;
      const flows = showsFlows ? [el("div", { class: "side-block" }, [eyebrowOf("構造マップで見る"), el("div", { class: "flow-chips" }, topic.flows.map((flow) => flowChipOf(flow, go)))])] : [];
      const seeAlsoChips = topic.seeAlso.map((position) => pressable("button", { class: "flow-chip", title: `「${PrimerTabTexts[position.tab].label}」のこの節を見る` }, [
        ...proseParts(position.label),
        el("span", { class: "arrow", text: PrimerTabTexts[position.tab].chip }),
      ], () => showSeeAlso(position)));
      const seeAlso = seeAlsoChips.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("関連"), el("div", { class: "flow-chips" }, seeAlsoChips)])];
      const terms = topic.terms.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("用語"), termListOf(topic.terms)])];
      return [occurrencesBlockOf(topic), ...tests, ...flows, ...seeAlso, ...terms];
    };

    /** 段を本文の要素にする。抜粋は中身(`text`)が足されたものだけを出す。 */
    const passageNodesOf = (passage, onMark) => {
      const marked = (tag, props, pieces) => markedProseOf({ tag, props, pieces, onMark });
      switch (passage.kind) {
        case "text":
          return [marked("p", { class: "topic-text" }, passage.pieces)];
        case "declaration":
          return [el("pre", { class: "primer-declaration", text: passage.code })];
        case "parameters":
          return [el("div", { class: "primer-parameters" }, [el("table", {}, [
            el("thead", {}, [el("tr", {}, ["引数", "型", "何を表すか"].map((text) => el("th", { text })))]),
            el("tbody", {}, passage.parameters.map((parameter) => el("tr", {}, [
              el("td", {}, [parameter.name, ...(parameter.note === null ? [] : [el("span", { class: "primer-parameter-note", text: parameter.note })])]),
              el("td", { text: parameter.type }),
              el("td", {}, [marked("span", {}, parameter.pieces)]),
            ]))),
          ])])];
        case "excerpt":
          return codeExampleOf(passage.excerpt);
        case "remark":
          return [el("div", { class: "topic-note", "data-remark": passage.remark }, [el("span", { class: "topic-note-label", text: passage.label }), marked("span", {}, passage.pieces)])];
      }
    };

    const topicBodyOf = (topic, onMark) => [
      el("div", { class: "topic-gist" }, [el("span", { class: "topic-gist-label", text: "要するに" }), markedProseOf({ tag: "span", props: { class: "topic-gist-text" }, pieces: topic.gist, onMark })]),
      ...topic.passages.flatMap((passage) => passageNodesOf(passage, onMark)),
    ];

    const ledeOf = (tab) => {
      const texts = PrimerTabTexts[tab];
      const statuses = [...Object.keys(Vocabulary.primerStatuses), PrimerTopics.Existing].map(primerChipOf);
      const legend = tab === PrimerTopics.PrimerKinds.Codebase ? [el("div", { class: "primer-legend" }, statuses.map((chip) => el("span", {}, [el("span", { class: "status-dot", "data-tone": chip.tone }), chip.label])))] : [];
      return el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: texts.eyebrow }), el("h1", { text: texts.title }), el("p", { text: texts.lead }), ...legend]);
    };

    /** タブの末尾の用語集の節。用語集は節の目次の後に REFERENCE の区切りを挟んで並べる。 */
    const glossaryTopicOf = (glossary) => ({
      attributes: { "data-glossary": "" },
      eyebrow: "reference",
      tocEyebrow: "reference",
      chips: [],
      dotTone: null,
      labelPartsOf: () => ["用語集"],
      tocDivider: "REFERENCE",
      inlineSummary: PrimerSideTitle,
      body: [el("div", { class: "primer-glossary-wrap" }, [el("table", { class: "primer-glossary" }, [
        el("thead", {}, [el("tr", {}, [el("th", { text: "用語" }), el("th", { text: "意味" })])]),
        el("tbody", {}, glossary.terms.map((term) => el("tr", {}, [el("td", { text: term.label }), prose("td", {}, term.text)]))),
      ])])],
      sideBlocksOf: () => [el("p", { class: "side-sub" }, [
        el("span", { class: "primer-glossary-note is-side", text: "本文の点線の語にカーソルを合わせると、右の欄の同じ語が光ります。" }),
        el("span", { class: "primer-glossary-note is-inline", text: "本文の点線の語にカーソルを合わせると、その節の畳んだ欄(この PR で出てくる場所)の中の同じ語が光ります。" }),
        "ここには、このタブに出てくる語をまとめています。",
      ])],
    });

    /**
     * 1 つのタブの 3 列。節のあとに、用語があれば用語集の節を足す。
     * @param showSeeAlso 関連のチップを押したときに、指した節(`{tab, index}`)へ移る
     */
    const tabColumnsOf = (tab, { topics, glossary }, showSeeAlso) => {
      // 印に乗ると、右の欄とその節の畳んだ欄の同じ語を光らせる。`columns` は光らせる時点で読むので、組み立ての後でよい。
      const onMarkIn = (index) => (mark, term) => lightWhileHoveredOrFocused(mark, () => [columns.side, columns.inlineHolders[index]]
        .flatMap((node) => [...node.querySelectorAll(".primer-term")])
        .filter((node) => node.dataset.term === term.id));
      const columnTopics = topics.map((topic, index) => ({
        attributes: { "data-topic": topic.id },
        eyebrow: topic.category,
        tocEyebrow: topic.category,
        chips: topic.status === null ? [] : [primerChipOf(topic.status)],
        dotTone: topic.status === null ? null : primerChipOf(topic.status).tone,
        labelPartsOf: () => proseParts(topic.label),
        tocDivider: null,
        inlineSummary: PrimerSideTitle,
        body: topicBodyOf(topic, onMarkIn(index)),
        sideBlocksOf: () => topicSideBlocksOf(topic, showSeeAlso),
      }));
      const glossaryTopics = glossary === null ? [] : [glossaryTopicOf(glossary)];
      const columns = TopicColumns.create({ topics: [...columnTopics, ...glossaryTopics], emptySide: PrimerEmptySide });
      const empty = topics.length === 0 ? [emptyOf("このタブに書かれた技術はありません。")] : [];
      const stageBody = el("div", { class: "stage-body topic-body", role: "tabpanel", id: `primer-panel-${tab}`, "aria-labelledby": `primer-tab-${tab}` }, [ledeOf(tab), ...empty, ...columns.articles]);
      // 件数は節だけを数え、用語集を入れない(デザイン案のタブの件数も節だけを数える)。
      return { columns, stageBody, count: topics.length };
    };

    let currentTab = PrimerTopics.firstTabOf(primerTopics);
    let saved = Object.fromEntries(tabs.map((tab) => [tab, { main: 0, page: 0 }]));
    const parts = Object.fromEntries(tabs.map((tab) => [tab, tabColumnsOf(tab, primerTopics.tabs[tab], (position) => showSeeAlso(position))]));
    const tocNote = el("span", { class: "panel-sub" });
    const tabButtons = tabs.map((tab) => {
      const button = pressable("button", { class: "primer-tab", role: "tab", id: `primer-tab-${tab}`, "aria-controls": `primer-panel-${tab}`, "data-tab": tab }, [
        el("span", { class: "primer-tab-label", text: PrimerTabTexts[tab].label }),
        el("span", { class: "primer-tab-count", text: String(parts[tab].count) }),
        el("span", { class: "primer-tab-desc", text: PrimerTabTexts[tab].description }),
      ], () => showTab(tab));
      button.addEventListener("keydown", (event) => {
        const step = Object.hasOwn(TabMoveKeys, event.key) ? TabMoveKeys[event.key] : 0;
        if (step === 0) return;
        event.preventDefault();
        const next = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length];
        showTab(next);
        tabButtons[tabs.indexOf(next)].focus();
      });
      return button;
    });

    /** 今のタブの 3 列だけを出す。 */
    const renderTab = () => {
      for (const [index, tab] of tabs.entries()) {
        const isCurrent = tab === currentTab;
        tabButtons[index].setAttribute("aria-selected", String(isCurrent));
        tabButtons[index].setAttribute("tabindex", isCurrent ? "0" : "-1");
        parts[tab].columns.toc.hidden = !isCurrent;
        parts[tab].stageBody.hidden = !isCurrent;
        parts[tab].columns.side.hidden = !isCurrent;
      }
      tocNote.textContent = PrimerTabTexts[currentTab].tocNote;
    };

    /** タブを切り替える。離れるタブの位置(本文の欄とページ全体)を覚え、戻るタブの位置を戻す(初めてなら先頭)。 */
    const showTab = (tab) => {
      if (tab === currentTab) return;
      saved = { ...saved, [currentTab]: { main: main.scrollTop, page: window.scrollY } };
      currentTab = tab;
      renderTab();
      main.scrollTop = saved[tab].main;
      window.scrollTo(0, saved[tab].page);
    };

    /** 関連のチップ。指したタブへ切り替えて(位置の保存と復元を通る)から、その節へ送る。 */
    const showSeeAlso = (position) => {
      showTab(position.tab);
      parts[position.tab].columns.sendTo(position.index);
    };

    main.replaceChildren(...tabs.map((tab) => parts[tab].stageBody));
    left.replaceChildren(el("div", { class: "panel-head" }, [el("span", { class: "panel-title", text: "目次" }), tocNote]), ...tabs.map((tab) => parts[tab].columns.toc));
    right.replaceChildren(panelHead(PrimerSideTitle, ""), ...tabs.map((tab) => parts[tab].columns.side));
    renderTab();
    TopicColumns.subscribe({ main, follow: (top) => parts[currentTab].columns.follow(top) });

    return { ...screenParts, tablist: el("div", { class: "primer-tablist", role: "tablist", "aria-label": "技術の種類" }, tabButtons) };
  };

  const ScreenBuilders = { map: MapScreen, story: StoryScreen, test: TestScreen, impact: ImpactScreen, primer: PrimerScreen };

  /** 解説が使えない理由を帯の 1 行にする。 */
  const missingTextOf = (reason) => {
    switch (reason.kind) {
      case "absent":
        return "解説なし(explain.json がまだ置かれていません)。変更の地図だけで組んでいます";
      case "unreadable":
        return `解説なし(explain.json を読めません: ${reason.detail})`;
      case "version":
        return `解説なし(explain.json の version が ${JSON.stringify(reason.actual)} で、このページが読めるのは 1)`;
      case "pr":
        return `解説なし(explain.json は PR ${JSON.stringify(reason.actual)} のもの)`;
      case "shape":
        return `解説なし(explain.json の ${reason.key ?? "トップ"} の形が想定と違います)`;
    }
  };

  const freshnessTextOf = (freshness) => {
    switch (freshness.kind) {
      case "stale":
        return `解説は ${shortSha(freshness.sha)} 時点、以降 ${freshness.after} コミットは解説なし`;
      case "unknown":
        return `解説の sha(${shortSha(freshness.sha)})が地図に無い。force push などで履歴が変わった可能性があります`;
      case "latest":
      case "none":
        return null;
    }
  };

  /** 上の帯に出す文。解説なし(理由)/ 古い / sha が地図に無い / 地図に無い解説。 */
  const bandTextsOf = (explained) => [
    explained.reading.kind === "missing" ? missingTextOf(explained.reading.reason) : null,
    freshnessTextOf(explained.freshness),
    explained.strayStories.length > 0 ? `地図に無い解説 ${explained.strayStories.length} 件(地図のコミットに無い sha への commitStories)` : null,
  ].filter((text) => text !== null);

  const linksOf = (pr, issue) => {
    const prLink = pr === null ? [] : [el("a", { href: `https://github.com/${Repo}/pull/${pr}`, title: `PR #${pr}` }, [el("span", { class: "link-kind", text: "PR " }), `#${pr}`])];
    const issueLink = issue === null ? [] : [el("a", { href: `https://github.com/${Repo}/issues/${issue}`, title: `Issue #${issue}` }, [el("span", { class: "link-kind", text: "Issue " }), `#${issue}`])];
    return el("nav", { class: "links" }, [...prLink, ...issueLink]);
  };

  /** 地図が読めないときの全体の案内。画面は組めないので、ヘッダと案内だけを出す。 */
  const mountGuide = (root, { pr, detail }) => {
    document.title = pr === null ? "PR 解説" : `PR #${pr} · PR 解説`;
    const screenNames = Object.values(Screens).map((screen) => ScreenLabels[screen]);
    root.replaceChildren(
      el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("span", { class: "top-main" }), textSizeControls(), linksOf(pr, null)]),
      el("div", { class: "bands" }),
      el("div", { class: "screens" }, [el("div", { class: "guide" }, [
        el("h1", { text: "変更の地図を読めません" }),
        el("p", { text: `change-map.json を読めませんでした(${detail})。PR に push すると、Actions が地図とこのページを置き直します。地図が置かれると、解説が無くても${screenNames.join("・")}の ${screenNames.length} 画面が出ます。` }),
      ])]),
    );
  };

  /** ヘッダ・帯・5 画面を組み、画面を切り替える。 */
  const Frame = Object.freeze({
    mount: (root, explained) => {
      const pr = explained.map.pr;
      const explain = explained.explain;
      const hasIssue = explain !== null && typeof explain.issue === "number";
      const issue = hasIssue ? explain.issue : null;
      document.title = explain === null ? `PR #${pr} · PR 解説` : `${explain.overview.title} · PR #${pr}`;
      /** 画面をまたぐ移動。移った先の画面で、渡したものを選んだ状態にする。 */
      const go = {
        toCommit: (sha) => {
          navigateTo(Screens.Story);
          built.story.select(sha);
        },
        toFlow: (id) => {
          navigateTo(Screens.Map);
          built.map.showFlow(id);
        },
        toMessage: (id) => {
          navigateTo(Screens.Map);
          built.map.showMessage(id);
        },
        toTest: (explainTestId) => {
          navigateTo(Screens.Test);
          built.test.showTest(explainTestId);
        },
        toImpact: (mention) => {
          navigateTo(Screens.Impact);
          built.impact.showMention(mention);
        },
        toCommitFile: (target) => {
          navigateTo(Screens.Story);
          built.story.showFile(target);
        },
      };
      const built = Object.fromEntries(Object.values(Screens).map((screen) => [screen, ScreenBuilders[screen](explained, go)]));
      const tabs = Object.values(Screens).map((screen) => el("a", { href: `#${screen}`, "data-screen": screen, text: ScreenLabels[screen] }));
      const controls = el("div", { class: "screen-controls" });
      const summary = el("span", { class: "screen-summary" });
      const branch = el("span", { class: "branch" }, [explained.map.headBranch, el("span", { class: "arrow", text: "→" }), explained.map.baseBranch]);
      const sections = Object.values(Screens).map((screen) => {
        const parts = built[screen];
        const tablist = parts.tablist === null ? [] : [parts.tablist];
        const grid = el("section", { class: "screen", "data-screen": screen, "aria-label": ScreenLabels[screen] }, [...tablist, parts.left, parts.main, ...(parts.right === null ? [] : [parts.right])]);
        PanelResizer.attach({ screen, grid, panels: parts.right === null ? { left: parts.left } : { left: parts.left, right: parts.right } });
        return grid;
      });
      root.replaceChildren(
        el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("nav", { class: "segmented", "aria-label": "画面" }, tabs), el("div", { class: "top-main" }, [branch, summary]), controls, textSizeControls(), linksOf(pr, issue)]),
        el("div", { class: "bands" }, bandTextsOf(explained).map((text) => el("div", { class: "band", role: "status", text }))),
        el("div", { class: "screens" }, sections),
      );
      let current = null;
      const show = (screen) => {
        current = screen;
        for (const tab of tabs) {
          if (tab.dataset.screen === screen) tab.setAttribute("aria-current", "page");
          else tab.removeAttribute("aria-current");
        }
        for (const section of sections) section.hidden = section.dataset.screen !== screen;
        summary.replaceChildren(...built[screen].summary);
        controls.replaceChildren(...built[screen].controls);
      };
      const choose = () => ScreenChoice.choose({ hash: location.hash, saved: BrowserStore.read(ScreenStoreKey) });
      /** 開いた画面を保存して出す。 */
      const openScreen = (screen) => {
        BrowserStore.write(ScreenStoreKey, screen);
        show(screen);
      };
      /** ハッシュをその画面のものに書き換えてから開く。 */
      const navigateTo = (screen) => {
        history.replaceState(null, "", `#${screen}`);
        openScreen(screen);
      };
      for (const tab of tabs) {
        tab.addEventListener("click", (event) => {
          event.preventDefault();
          navigateTo(tab.dataset.screen);
        });
      }
      window.addEventListener("hashchange", () => openScreen(choose()));
      window.addEventListener("keydown", (event) => {
        const onKey = built[current].onKey;
        if (onKey !== undefined) onKey(event);
      });
      show(choose());
    },
  });

  const fetchFresh = (name) => fetch(`${name}?t=${Date.now()}`, { cache: "no-store" });
  const prFromPath = (location.pathname.match(/pr-(\d+)/) || [])[1] ?? null;

  /** 読み込みの失敗だけを受ける。組み立ての失敗は握らず、コンソールにそのまま出す。 */
  const mapRequest = fetchFresh("change-map.json")
    .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
    .then((map) => ({ isLoaded: true, map }), (error) => ({ isLoaded: false, detail: error.message }));
  const explainRequest = fetchFresh("explain.json")
    .then((response) => {
      if (response.status === 404) return { kind: "absent" };
      if (!response.ok) return { kind: "failed", detail: `HTTP ${response.status}` };
      return response.text().then((text) => ({ kind: "text", text }));
    })
    .catch((error) => ({ kind: "failed", detail: error.message }));

  /** 地図を読めない理由。読めれば null。 */
  const mapProblemOf = (mapResult) => {
    if (!mapResult.isLoaded) return mapResult.detail;
    if (!ExplainedMap.isReadableMap(mapResult.map)) return `version が ${JSON.stringify(mapResult.map?.version ?? null)} で、このページが読めるのは 2`;
    return null;
  };

  Promise.all([mapRequest, explainRequest]).then(([mapResult, source]) => {
    const root = document.getElementById("app");
    const problem = mapProblemOf(mapResult);
    if (problem !== null) {
      mountGuide(root, { pr: prFromPath, detail: problem });
      return;
    }
    Frame.mount(root, ExplainedMap.create(mapResult.map, source));
  });
})();
</script>
</body>
</html>
