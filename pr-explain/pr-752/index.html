        return addedFiles.has(file) ? "new" : "unjudged";
      };
      const explained = explainListOf(explain, "tests").map((test) => {
        const suite = suites.get(test.suite) ?? null;
        const file = suite === null ? null : suite.file;
        return { name: test.name, file, status: statusOf(test, file), targets: Array.isArray(test.targets) ? test.targets : [], test, suite };
      });
      const covered = new Set(explained.map((test) => testKeyOf(test.file, test.name)));
      const unexplained = mapTests.added.filter((test) => !covered.has(testKeyOf(test.file, test.name))).map(fromMap("new"));
      return [...explained, ...unexplained, ...removed];
    };

    /** 解説から、ページが名前で引く一覧。 */
    const lookupOf = (explain) => ({
      conceptNames: new Map(explainListOf(explain, "concepts").map((concept) => [concept.path, concept.name])),
      flows: new Map(explainListOf(explain, "flows").map((flow) => [flow.id, flow])),
      messages: new Map(explainListOf(explain, "messages").map((message) => [message.id, message])),
    });

    /**
     * 地図と解説を合わせる。解説が無い・使えないときも、地図だけで 5 画面の材料を作る。
     * @param map change-map.json の中身(`isReadableMap` が真のもの)
     * @param source 解説の読み込み結果(`readingOf` の source と同じ)
     * @returns 画面が使う材料。解説の状態は `reading`(`explained` / `missing` と理由)と `freshness` に出る。
     *   `explain` は使える解説(無ければ null)、`lookup` はそこから名前で引く一覧、`entryAt` はパスから木の項目を、
     *   `testAt` は解説のテストの id から `tests` の 1 件を引く表、`commitAt` は地図のコミットを sha で引く表、`impactTopics` は
     *   振る舞いの節の並び(`ImpactTopics`。振る舞いとテストの 2 画面が読む)、`primerTopics` は技術の手引きの節の並び(`PrimerTopics`)
     */
    const create = (map, source) => {
      const reading = readingOf(source, map.pr);
      const explain = reading.kind === "explained" ? reading.explain : null;
      const concepts = explainListOf(explain, "concepts");
      const conceptOf = new Map(concepts.map((concept) => [concept.path, concept]));
      const files = map.groups.flatMap((group) => group.files);
      const mapPaths = new Set(files.map((file) => file.path));
      const entries = withOthers(entriesOf(map.groups, conceptOf), map.dependencies);
      const targets = new Map(files.map((file) => [file.path, file.target ?? null]));
      const targetOf = (path) => (targets.get(path) ? [targets.get(path)] : []);
      const addedFiles = new Set(files.filter((file) => file.changed && file.status === "A").map((file) => file.path));
      const explainedAt = explain === null ? -1 : map.commits.findIndex((commit) => commit.sha === explain.sha);
      const changed = entries.filter((entry) => entry.changed);
      const commits = commitsOf({ commits: map.commits, explain, explainedAt });
      const ownCommits = commits.filter((commit) => !commit.merge);
      const lookup = lookupOf(explain);
      const tests = testsOf({ mapTests: map.tests, explain, targetOf, addedFiles });
      const entryAt = new Map(entries.map((entry) => [entry.path, entry]));
      const testAt = new Map(tests.filter((test) => test.test !== null).map((test) => [test.test.id, test]));
      return Object.freeze({
        map: { pr: map.pr, head: map.head, mergeBase: map.mergeBase, headBranch: map.headBranch, baseBranch: map.baseBranch },
        reading,
        explain,
        lookup,
        freshness: freshnessOf({ explain, head: map.head, commits: map.commits, explainedAt }),
        entries,
        entryAt,
        dependencies: map.dependencies,
        groupings: groupingsOf({ groups: map.groups, entries, explain }),
        unmappedConcepts: concepts.filter((concept) => !mapPaths.has(concept.path)),
        commits,
        commitAt: new Map(commits.map((commit) => [commit.sha, commit])),
        strayStories: explainListOf(explain, "commitStories").filter((story) => !map.commits.some((commit) => commit.sha === story.sha)),
        tests,
        testAt,
        impactTopics: explain === null ? ImpactTopics.Unexplained : ImpactTopics.create({ impact: explain.impact, testAt, entryAt, messages: lookup.messages }),
        primerTopics: explain === null
          ? PrimerTopics.Unexplained
          : PrimerTopics.create({ primers: explain.primers, terms: explain.terms, testAt, flows: lookup.flows, reachOf: reachOfIn(map.commits, explainedAt) }),
        totals: {
          files: changed.length,
          additions: sumOf(changed.map((entry) => entry.additions)),
          deletions: sumOf(changed.map((entry) => entry.deletions)),
          commits: map.commits.length,
          // 変更の経緯のヘッダの数。ファイルごとの差し引きと違い、あとのコミットで書き直した行もコミットごとに数える。
          commitLines: { additions: sumOf(ownCommits.map((commit) => commit.additions)), deletions: sumOf(ownCommits.map((commit) => commit.deletions)) },
        },
      });
    };

    return Object.freeze({
      create,
      /** @returns このページが読める版(2)の地図か。違えば画面を組まず、版を添えて案内を出す */
      isReadableMap: (map) => isRecord(map) && map.version === MapVersion,
      /**
       * 箱と木に出す名前。
       * @param naming `concept`(concept 名。無ければファイル名)/ `file`(ファイル名)
       */
      nameOf: (entry, naming) => (naming === "concept" && entry.conceptName !== null ? entry.conceptName : entry.fileName),
    });
  })();

  /** コミットの差分。patch を hunk の行に分け、行への注釈を hunk に割り当て、行を字句に分け、コードの表示では消した行を畳む。 */
  const CommitDiff = (() => {
    const HunkHeader = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/;
    const ChangeSigns = new Set(["+", "-"]);

    const sideOf = (note) => (note.side === "old" ? "old" : "new");
    const numberOn = (line, side) => (side === "old" ? line.oldNo : line.newNo);

    /**
     * 注釈の行の範囲に、その行が入るか。行番号は注釈の `side` の側で見る。
     * @param line hunk の行(`oldNo` / `newNo` は、その側に無い行なら null)
     */
    const hasLine = (note, line) => {
      const number = numberOn(line, sideOf(note));
      return number !== null && isWithin(number, note);
    };

    /** hunk の見出しから後の 1 行を、記号と両側の行番号の付いた行にする。 */
    const lineOf = (raw, next) => {
      const sign = ChangeSigns.has(raw[0]) ? raw[0] : " ";
      return { sign, oldNo: sign === "+" ? null : next.old, newNo: sign === "-" ? null : next.new, text: raw.slice(1) };
    };

    /** 地図の開いた行の 1 つ。オブジェクトのときだけ読み、`old` / `new` はそれぞれ文字列でなければ null にする。 */
    const openingLinesOf = (hunkOpening) => {
      const openingLineOn = (side) => (isRecord(hunkOpening) && isString(hunkOpening[side]) ? hunkOpening[side] : null);
      return { old: openingLineOn("old"), new: openingLineOn("new") };
    };

    // 地図とページは pr-explain.yml の put-map が同じ checkout から一緒に置くので、開いた行は普通は欠けない。ただし外から読む JSON なので、形を確かめてから読む。
    // 開いた行は hunk の並び順で対応させる。`@@` の読み方はここ(`HunkHeader`)と地図の `HunkHeader` の 2 か所にあり、ずれると隣の hunk の色になるので、数が合わなければすべて頭から読む。
    /**
     * patch を hunk に分け、n 番目の hunk に地図の開いた行の n 番目を `openingLines` として付ける。`\ No newline at end of file` は
     * 行ではないので落とす。
     * @param hunkOpeningLines 地図のファイルの `hunkOpeningLines`。配列で長さが hunk の数と同じときだけ読み、そうでなければどの hunk も
     *   `{old: null, new: null}`
     */
    const hunksOf = (patch, hunkOpeningLines) => {
      const hunks = [];
      let next = null;
      for (const raw of patch.split("\n")) {
        const header = HunkHeader.exec(raw);
        if (header !== null) {
          next = { old: Number(header[1]), new: Number(header[2]) };
          hunks.push({ header: raw, lines: [] });
          continue;
        }
        const isLine = next !== null && !raw.startsWith("\\");
        if (!isLine) continue;
        const line = lineOf(raw, next);
        next = { old: next.old + (line.oldNo === null ? 0 : 1), new: next.new + (line.newNo === null ? 0 : 1) };
        hunks[hunks.length - 1].lines.push(line);
      }
      const fits = Array.isArray(hunkOpeningLines) && hunkOpeningLines.length === hunks.length;
      return hunks.map((hunk, index) => ({ ...hunk, openingLines: openingLinesOf(fits ? hunkOpeningLines[index] : null) }));
    };

    /** 注釈に、ファイルの中で通した番号(`from` の次から)を付ける。 */
    const numbered = (notes, from) => notes.map((note, index) => ({ ...note, side: sideOf(note), n: from + index + 1 }));

    const hunkBodyOf = (file, notes) => {
      const hunks = hunksOf(file.patch, file.hunkOpeningLines);
      const placedAt = notes.map((note) => hunks.findIndex((hunk) => hunk.lines.some((line) => hasLine(note, line))));
      const placed = hunks.map((hunk, index) => notes.filter((note, noteIndex) => placedAt[noteIndex] === index));
      const firstNumbers = placed.map((group, index) => placed.slice(0, index).reduce((sum, earlier) => sum + earlier.length, 0));
      const placedCount = placed.reduce((sum, group) => sum + group.length, 0);
      const remaining = file.truncated === true ? file.patchLines - file.patch.split("\n").length : 0;
      return {
        body: { kind: "hunks", hunks: hunks.map((hunk, index) => ({ ...hunk, notes: numbered(placed[index], firstNumbers[index]) })), remaining },
        unplaced: numbered(notes.filter((note, index) => placedAt[index] < 0), placedCount),
      };
    };

    /** patch が null のとき。消したファイルなら、変更前の行への注釈をそこに付ける。 */
    const missingBodyOf = (file, notes) => {
      if (file.status !== "D") return { body: { kind: "binary" }, unplaced: numbered(notes, 0) };
      const lines = typeof file.deletions === "number" ? file.deletions : null;
      const isOnDeletedLine = (note) => sideOf(note) === "old" && (lines === null || note.start <= lines);
      const onDeleted = notes.filter(isOnDeletedLine);
      return { body: { kind: "deleted", lines, notes: numbered(onDeleted, 0) }, unplaced: numbered(notes.filter((note) => !isOnDeletedLine(note)), onDeleted.length) };
    };

    const fileOf = (file, notes) => {
      const shown = { path: file.path, oldPath: file.oldPath ?? null, status: file.status, additions: file.additions, deletions: file.deletions };
      if (file.patch === "") return { ...shown, body: { kind: "unchanged" }, unplaced: numbered(notes, 0) };
      if (file.patch === null) return { ...shown, ...missingBodyOf(file, notes) };
      return { ...shown, ...hunkBodyOf(file, notes) };
    };

    return Object.freeze({
      hasLine,
      /**
       * コミットのファイルごとに差分を組み、解説の注釈を `side` の行番号が入る最初の hunk に付ける(番号はファイルの
       * 中で hunk の順に通す)。どの hunk にも入らない注釈は `unplaced` に回す。
       * @param commit 地図のコミット(マージは files が空)
       * @param story そのコミットの commitStory。無ければ null
       * @returns `files`(本文の `body` は `hunks` / `unchanged`(patch が空)/ `deleted` / `binary`)と、そのコミットに無い
       *   パスへの注釈 `strayNotes`。`hunks` の hunk は `header` / `lines` / `openingLines`(変更前と変更後の開いた行)/ `notes` を持つ
       */
      create: (commit, story) => {
        const hasNotes = story !== null && Array.isArray(story.notes);
        const notes = hasNotes ? story.notes : [];
        const paths = new Set(commit.files.map((file) => file.path));
        return {
          files: commit.files.map((file) => fileOf(file, notes.filter((item) => item.path === file.path))),
          strayNotes: notes.filter((item) => !paths.has(item.path)),
        };
      },
      /**
       * hunk の行を字句に分ける。変更前は `openingLines.old`、変更後は `openingLines.new` から読み始め、`-` の行は変更前だけ、`+` の
       * 行は変更後だけ、前後の行は両方で読み進める。
       * @param grammar ファイルの文法(`Tokenizer.grammarOf`)
       * @returns 行ごとの字句の並び(`hunk.lines` と同じ順)。前後の行は変更後の字句
       */
      lineTokensOf: (hunk, grammar) => {
        const tokensBy = (lines, openingLine) => {
          const read = Tokenizer.tokenizeLines(lines.map((line) => line.text), grammar, Tokenizer.startAfter(openingLine, grammar));
          return new Map(lines.map((line, index) => [line, read[index].tokens]));
        };
        const before = tokensBy(hunk.lines.filter((line) => line.sign !== "+"), hunk.openingLines.old);
        const after = tokensBy(hunk.lines.filter((line) => line.sign !== "-"), hunk.openingLines.new);
        return hunk.lines.map((line) => after.get(line) ?? before.get(line));
      },
      /**
       * コードの表示の行。続けて消した行は 1 つの畳み(`gap`)にまとめる。
       * @returns `{kind: "line", line}` と `{kind: "gap", lines}`(畳んだ消した行)の並び
       */
      codeRowsOf: (hunk) => {
        const rows = [];
        for (const line of hunk.lines) {
          const last = rows[rows.length - 1];
          const extendsGap = line.sign === "-" && last !== undefined && last.kind === "gap";
          if (extendsGap) rows[rows.length - 1] = { kind: "gap", lines: [...last.lines, line] };
          else rows.push(line.sign === "-" ? { kind: "gap", lines: [line] } : { kind: "line", line });
        }
        return rows;
      },
    });
  })();

  /**
   * 箱の図の配置。まとめ方の組と箱を依存の深さで段に並べ、線の道筋とラベルの置き場を決める。どの画面の図も
   * これで並べる。
   */
  const GraphLayout = (() => {
    const Group = Object.freeze({ width: 212, height: 72, head: 42, padX: 14, padBottom: 14 });
    const Box = Object.freeze({ width: 152, height: 30, gap: 12, rowGap: 40 });
    const Spacing = Object.freeze({ rowGap: 100, columnGap: 72 });
    const PerRow = 4;
    // 組を 1 段に並べる数の候補。置ける広さが渡されたら、この中から図が最も大きく(等倍まで)収まるものを選ぶ。
    const PerRowChoices = [PerRow, 3, 2, 1];
    // 横に並んだ組のあいだを、線のラベルが入る幅まで広げるときの上限。広げすぎると、組が 1 段に並んだときに図全体が
    // 縮んでどのラベルも読めなくなる。入らないラベルは置ける位置が無ければ出さない(線を押せば詳しいところは読める)。
    const MaxLabelGap = 240;
    const Levels = Object.freeze({ High: "high", Mid: "mid", Low: "low" });
    // 線の中ほどから端へ向かって、ラベルを置く位置を試す順(ベジェ曲線の媒介変数)。
    const LabelSpots = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.18, 0.82];
    const ObstaclePad = 4;
    const ContainerHeadHeight = 38;

    const sumOf = (values) => values.reduce((sum, value) => sum + value, 0);
    const chunksOf = (items, size) => Array.from({ length: Math.ceil(items.length / size) }, (_, index) => items.slice(index * size, (index + 1) * size));

    /**
     * 強連結成分(Tarjan)。
     * @param successorsOf id から、それが使う id の並びを引く
     * @returns 成分の並び。辺 a → b があれば、b の成分が a の成分より前に来る
     */
    const componentsOf = (ids, successorsOf) => {
      const order = new Map();
      const low = new Map();
      const stack = [];
      const onStack = new Set();
      const components = [];
      const visit = (id) => {
        order.set(id, order.size);
        low.set(id, order.get(id));
        stack.push(id);
        onStack.add(id);
        for (const next of successorsOf(id)) {
          if (!order.has(next)) visit(next);
          if (onStack.has(next)) low.set(id, Math.min(low.get(id), low.get(next)));
        }
        if (low.get(id) !== order.get(id)) return;
        const component = stack.splice(stack.lastIndexOf(id));
        for (const member of component) onStack.delete(member);
        components.push(component);
      };
      for (const id of ids) if (!order.has(id)) visit(id);
      return components;
    };

    /**
     * 使う側からの深さ。強連結成分を 1 つにまとめた DAG で最長の道のりを取り、同じ成分には同じ深さを付ける。
     * 循環を打ち切りで済ませると、打ち切る位置が入力の順で変わり、段も変わる。
     * @param pairs `[使う側, 使われる側]` の並び(どちらも ids にあるもの)
     * @returns id から深さ(誰にも使われていなければ 0)
     */
    const depthsOf = (ids, pairs) => {
      const successors = new Map(ids.map((id) => [id, pairs.filter(([from]) => from === id).map(([, to]) => to)]));
      const components = componentsOf(ids, (id) => successors.get(id));
      const componentOf = new Map(components.flatMap((members, index) => members.map((id) => [id, index])));
      // 成分は使われる側から並ぶので、使う側の成分の大きい順に辺をたどれば、どの成分も深さが決まってから先へ伸ばせる。
      const links = pairs.map(([from, to]) => [componentOf.get(from), componentOf.get(to)]).filter(([from, to]) => from !== to).toSorted((a, b) => b[0] - a[0]);
      const depths = links.reduce((sofar, [from, to]) => sofar.with(to, Math.max(sofar[to], sofar[from] + 1)), components.map(() => 0));
      return new Map(ids.map((id) => [id, depths[componentOf.get(id)]]));
    };

    /** 深さごとに変更行数の多い順(同じなら入力の順)に並べ、1 段 `perRow` 個ずつの行に割る。 */
    const rowsOf = (items, { depthOf, perRow }) => {
      const deepest = Math.max(0, ...items.map((item) => depthOf.get(item.id)));
      const levels = Array.from({ length: deepest + 1 }, (_, depth) => items.filter((item) => depthOf.get(item.id) === depth).toSorted((a, b) => b.lines - a.lines));
      return levels.filter((level) => level.length > 0).flatMap((level) => chunksOf(level, perRow));
    };

    /** 組 1 つの大きさ。開いた組は中の箱を同じ規則で段に並べる。 */
    const blockOf = (group, { links, isOpen }) => {
      const lines = sumOf(group.boxes.map((box) => box.lines));
      if (!isOpen) return { group, lines, isOpen, rows: [], width: Group.width, height: Group.height };
      const paths = new Set(group.boxes.map((box) => box.path));
      const isInside = (link) => paths.has(link.from) && paths.has(link.to);
      const inner = links.filter(isInside).map((link) => [link.from, link.to]);
      const rows = rowsOf(group.boxes.map((box) => ({ ...box, id: box.path })), { depthOf: depthsOf([...paths], inner), perRow: PerRow });
      const widest = Math.max(...rows.map((row) => row.length));
      const width = Math.max(Group.width, widest * Box.width + (widest - 1) * Box.gap + Group.padX * 2);
      const height = Group.head + rows.length * (Box.height + Box.rowGap) - Box.rowGap + Group.padBottom;
      return { group, lines, isOpen, rows, width, height };
    };

    /** 段の行を上から積み、各行を図の幅の中央に寄せて、組の位置を決める。 */
    const placedBlocksOf = (rows, columnGap) => {
      const rowWidths = rows.map((row) => sumOf(row.map((block) => block.width)) + (row.length - 1) * columnGap);
      const rowHeights = rows.map((row) => Math.max(...row.map((block) => block.height)));
      const width = Math.max(0, ...rowWidths);
      const height = rows.length === 0 ? 0 : sumOf(rowHeights) + (rows.length - 1) * Spacing.rowGap;
      const blocks = rows.flatMap((row, index) => {
        const top = sumOf(rowHeights.slice(0, index)) + index * Spacing.rowGap;
        const left = (width - rowWidths[index]) / 2;
        return row.map((block, at) => ({ ...block, x: left + sumOf(row.slice(0, at).map((before) => before.width)) + at * columnGap, y: top + (rowHeights[index] - block.height) / 2 }));
      });
      return { width, height, blocks };
    };

    /**
     * 広さに収めたときの縮尺。等倍より大きくは数えない。等倍で収まる並びどうしはどれも等倍で読めるので、1 段に多く
     * 並べるほう(段が少なく、離れた段を結ぶ線が間の組を横切りにくい)を選ばせるため。図が空なら 0。
     */
    const scaleIn = (placed, room) => (placed.width === 0 ? 0 : Math.min(1, room.width / placed.width, room.height / placed.height));

    /** 1 段に並べる数の候補ごとの配置から、広さに最も大きく収まるものを選ぶ(同じなら 1 段に多く並べるほう)。 */
    const fittestOf = (candidates, room) => candidates.reduce((best, candidate) => (scaleIn(candidate, room) > scaleIn(best, room) ? candidate : best));

    const groupIdOf = (id) => `group:${id}`;
    const pathsIn = (block) => block.group.boxes.map((box) => box.path);

    /** 箱の図に描く単位。畳んだ組は 1 つ、開いた組は中の箱ごとに 1 つ。 */
    const unitsOf = (block) => {
      if (!block.isOpen) return [{ id: groupIdOf(block.group.id), kind: "group", group: block.group.id, paths: pathsIn(block), x: block.x, y: block.y, width: block.width, height: block.height }];
      return block.rows.flatMap((row, index) => {
        const rowWidth = row.length * Box.width + (row.length - 1) * Box.gap;
        const left = block.x + (block.width - rowWidth) / 2;
        const top = block.y + Group.head + index * (Box.height + Box.rowGap);
        return row.map((box, at) => ({ id: `box:${box.path}`, kind: "box", group: block.group.id, path: box.path, paths: [box.path], x: left + at * (Box.width + Box.gap), y: top, width: Box.width, height: Box.height }));
      });
    };

    /**
     * 組と箱を並べる。
     * @param groups まとめ方の組 `{id, boxes: [{path, lines}]}`(lines は変更行数)。箱の無い組は描かない
     * @param links 依存 `{from, to, status}`(使う側 → 使われる側のパス)。消えた依存(`removed`)は段に使わない
     * @param expanded 開いて中の箱を並べる組の id
     * @param room 図を置ける広さ `{width, height}`。渡せば、組を 1 段に並べる数(4〜1)を図が最も大きく収まるものにする
     *   (等倍で収まるものどうしなら 1 段に多いほう)。null なら 1 段に 4 つ
     * @param labelWidth 横に並んだ組のあいだの線に置くラベルの幅。組の間隔をそれが入るまで広げる(上限 240px)。
     *   ラベルを描かないなら 0
     * @returns 図の大きさ、描く単位(`units`)、開いた組の枠(`containers`)、パスから単位の id を引く `unitOf`
     */
    const create = ({ groups, links, expanded, room = null, labelWidth = 0 }) => {
      const drawn = groups.filter((group) => group.boxes.length > 0);
      const groupOf = new Map(drawn.flatMap((group) => group.boxes.map((box) => [box.path, group.id])));
      const isLive = (link) => link.status !== "removed" && groupOf.has(link.from) && groupOf.has(link.to) && link.from !== link.to;
      const live = links.filter(isLive);
      const crossing = live.map((link) => [groupOf.get(link.from), groupOf.get(link.to)]).filter(([from, to]) => from !== to);
      const open = new Set(expanded);
      const blocks = drawn.map((group) => ({ ...blockOf(group, { links: live, isOpen: open.has(group.id) }), id: group.id }));
      const depthOf = depthsOf(drawn.map((group) => group.id), crossing);
      const columnGap = Math.min(MaxLabelGap, Math.max(Spacing.columnGap, labelWidth + ObstaclePad * 2));
      const candidates = PerRowChoices.map((perRow) => placedBlocksOf(rowsOf(blocks, { depthOf, perRow }), columnGap));
      const placed = room === null ? candidates[0] : fittestOf(candidates, room);
      const units = placed.blocks.flatMap(unitsOf);
      const containers = placed.blocks.filter((block) => block.isOpen).map((block) => ({ id: groupIdOf(block.group.id), group: block.group.id, paths: pathsIn(block), x: block.x, y: block.y, width: block.width, height: block.height }));
      return Object.freeze({ width: placed.width, height: placed.height, units, containers, unitOf: new Map(units.flatMap((unit) => unit.paths.map((path) => [path, unit.id]))) });
    };

    const rounded = (value) => Math.round(value * 10) / 10;
    /** 2 つの単位を結ぶ線の鍵。向きによらず同じになる。 */
    const edgeKeyOf = (one, other) => [one, other].sort().join("|");

    /** 矢じりの三角形。`direction` は線の進む向き(d / u / r / l)。 */
    const headAt = (x, y, direction) => {
      const half = 4.5;
      const length = 7;
      switch (direction) {
        case "d":
          return `M${x - half} ${y - length} L${x} ${y} L${x + half} ${y - length} Z`;
        case "u":
          return `M${x - half} ${y + length} L${x} ${y} L${x + half} ${y + length} Z`;
        case "r":
          return `M${x - length} ${y - half} L${x} ${y} L${x - length} ${y + half} Z`;
        case "l":
          return `M${x + length} ${y - half} L${x} ${y} L${x + length} ${y + half} Z`;
      }
    };

    /** 線の両端と制御点。上下に離れていれば上下の辺から、重なっていれば左右の辺から出す。 */
    const endsOf = (source, target) => {
      const sourceCenter = { x: source.x + source.width / 2, y: source.y + source.height / 2 };
      const targetCenter = { x: target.x + target.width / 2, y: target.y + target.height / 2 };
      if (target.y >= source.y + source.height + 2) {
        const from = [sourceCenter.x, source.y + source.height];
        const to = [targetCenter.x, target.y - 1];
        const bend = Math.max(24, (to[1] - from[1]) / 2);
        return { from, to, controls: [from[0], from[1] + bend, to[0], to[1] - bend], direction: "d", back: "u" };
      }
      if (target.y + target.height <= source.y - 2) {
        const from = [sourceCenter.x, source.y];
        const to = [targetCenter.x, target.y + target.height + 1];
        const bend = Math.max(40, (from[1] - to[1]) / 2);
        return { from, to, controls: [from[0], from[1] - bend, to[0], to[1] + bend], direction: "u", back: "d" };
      }
      if (targetCenter.x > sourceCenter.x) {
        const from = [source.x + source.width, sourceCenter.y];
        const to = [target.x - 1, targetCenter.y];
        const bend = Math.max(16, (to[0] - from[0]) / 2);
        return { from, to, controls: [from[0] + bend, from[1], to[0] - bend, to[1]], direction: "r", back: "l" };
      }
      const from = [source.x, sourceCenter.y];
      const to = [target.x + target.width + 1, targetCenter.y];
      const bend = Math.max(16, (from[0] - to[0]) / 2);
      return { from, to, controls: [from[0] - bend, from[1], to[0] + bend, to[1]], direction: "l", back: "r" };
    };

    /**
     * 2 つの単位を結ぶ線の道筋。
     * @returns SVG の `d`(`path`)、終わりの矢じり(`head`)、始まりの矢じり(`tail`、両向きの線に使う)、
     *   ラベルを置くためのベジェ曲線の 4 点(`bezier`)
     */
    const routeOf = (source, target) => {
      const { from, to, controls, direction, back } = endsOf(source, target);
      const points = [...from, ...controls, ...to].map(rounded);
      const [x1, y1, c1x, c1y, c2x, c2y, x2, y2] = points;
      return { path: `M${x1} ${y1} C${c1x} ${c1y} ${c2x} ${c2y} ${x2} ${y2}`, head: headAt(x2, y2, direction), tail: headAt(x1, y1, back), bezier: [...from, ...controls, ...to] };
    };

    const pointOn = (bezier, t) => {
      const u = 1 - t;
      const at = (offset) => u * u * u * bezier[offset] + 3 * u * u * t * bezier[offset + 2] + 3 * u * t * t * bezier[offset + 4] + t * t * t * bezier[offset + 6];
      return { x: at(0), y: at(1) };
    };

    const overlapOf = (rect, others) => sumOf(others.map((other) => {
      const width = Math.min(rect.x + rect.width, other.x + other.width) - Math.max(rect.x, other.x);
      const height = Math.min(rect.y + rect.height, other.y + other.height) - Math.max(rect.y, other.y);
      return width > 0 && height > 0 ? width * height : 0;
    }));

    /** 1 つのラベルの置き場。箱との重なりは 2 倍に数え、重なりの無い位置が見つかればそこで止める。 */
    const bestSpotOf = (candidate, { obstacles, placed }) => {
      const spots = LabelSpots.map((t) => {
        const center = pointOn(candidate.bezier, t);
        const rect = { x: center.x - candidate.width / 2, y: center.y - candidate.height / 2, width: candidate.width, height: candidate.height };
        return { center, rect, score: overlapOf(rect, obstacles) * 2 + overlapOf(rect, placed) };
      });
      const clear = spots.find((spot) => spot.score === 0);
      return clear ?? spots.reduce((best, spot) => (spot.score < best.score ? spot : best));
    };

    return Object.freeze({
      Levels,
      create,
      /**
       * 抽象度ごとに開く組。高はすべて畳み、低はすべて開き、中は変更行数の多い上位 ⌈n/3⌉ を開く。
       * @param groups `create` と同じ組(箱の無い組は数えない)
       * @returns 開く組の id(入力の順)
       */
      expandedAt: (level, groups) => {
        const drawn = groups.filter((group) => group.boxes.length > 0);
        const linesOf = (group) => sumOf(group.boxes.map((box) => box.lines));
        switch (level) {
          case Levels.High:
            return [];
          case Levels.Low:
            return drawn.map((group) => group.id);
          case Levels.Mid: {
            const top = new Set(drawn.toSorted((a, b) => linesOf(b) - linesOf(a)).slice(0, Math.ceil(drawn.length / 3)).map((group) => group.id));
            return drawn.map((group) => group.id).filter((id) => top.has(id));
          }
        }
      },
      edgeKeyOf,
      /**
       * 単位どうしの線。両端が同じ単位のものは描かず、同じ 2 つの単位を結ぶものは 1 本にまとめる。
       * @param links `{from, to, item, leads}`(パスどうし)。線の向きは、`leads` が真の最初のもので決め、無ければ最初のもの
       * @returns 線ごとに、`key`(`edgeKeyOf`)、向きの順の端(`from` / `to`)、まとめた `items`、両向きの link を含むか
       *   (`isBothWays`)、道筋(`route`)
       */
      edgesOf: (layout, links) => {
        const unitAt = new Map(layout.units.map((unit) => [unit.id, unit]));
        const ends = links.map((link) => ({ link, from: layout.unitOf.get(link.from), to: layout.unitOf.get(link.to) }));
        const isDrawn = (end) => end.from !== undefined && end.to !== undefined && end.from !== end.to;
        const byKey = new Map();
        for (const end of ends.filter(isDrawn)) {
          const key = edgeKeyOf(end.from, end.to);
          const edge = byKey.get(key) ?? { key, ends: null, first: null, items: [], directions: [] };
          const leadsHere = edge.ends === null && end.link.leads;
          const directions = [...new Set([...edge.directions, end.from])];
          byKey.set(key, { ...edge, ends: leadsHere ? [end.from, end.to] : edge.ends, items: [...edge.items, end.link.item], first: edge.first ?? [end.from, end.to], directions });
        }
        return [...byKey.values()].map((edge) => {
          const [from, to] = edge.ends ?? edge.first;
          return { key: edge.key, from, to, items: edge.items, isBothWays: edge.directions.length > 1, route: routeOf(unitAt.get(from), unitAt.get(to)) };
        });
      },
      /** ラベルの幅の見積もり。書体を読み込む前でも同じ置き場になるよう、測らずに全角 11.2px・半角 6.8px で数える。 */
      textWidthOf: (text) => sumOf([...text].map((char) => (char.charCodeAt(0) > 255 ? 11.2 : 6.8))),
      /** ラベルが避けるもの。単位(周りに 4px の余白)と、開いた組の見出し。 */
      obstaclesOf: (layout) => [
        ...layout.units.map((unit) => ({ x: unit.x - ObstaclePad, y: unit.y - ObstaclePad, width: unit.width + ObstaclePad * 2, height: unit.height + ObstaclePad * 2 })),
        ...layout.containers.map((container) => ({ x: container.x, y: container.y, width: container.width, height: ContainerHeadHeight })),
      ],
      /**
       * ラベルを線の上に置く。優先度の高い順に、線の中ほどから端へ向かって位置を試し、箱と置いたラベルに重なる
       * 面積が最も小さい所を選ぶ。
       * @param candidates `{key, bezier, width, height, priority, allowance}`。重なりが自分の面積の allowance 倍
       *   未満なら置く(0 なら重ならない所だけ、Infinity なら必ず)
       * @returns ラベルごとの `{key, x, y, isPlaced}`(中心)。置けなかったもの(`isPlaced` が偽)は、最も重なりの
       *   小さい位置を持ち、あとのラベルの置き場を避けさせない
       */
      placeLabels: ({ candidates, obstacles }) => {
        const ordered = candidates.toSorted((a, b) => b.priority - a.priority);
        const result = ordered.reduce((sofar, candidate) => {
          const spot = bestSpotOf(candidate, { obstacles, placed: sofar.rects });
          const isPlaced = spot.score === 0 || spot.score < candidate.width * candidate.height * candidate.allowance;
          const label = { key: candidate.key, x: spot.center.x, y: spot.center.y, isPlaced };
          return { rects: isPlaced ? [...sofar.rects, spot.rect] : sofar.rects, labels: [...sofar.labels, label] };
        }, { rects: [], labels: [] });
        return result.labels;
      },
    });
  })();

  /** つながり(2 つの単位を結ぶ線)の「要するに」の文。 */
  const ConnectionSentences = (() => {
    const isRemoved = (message) => message.status === "removed";
    return Object.freeze({
      /**

       * @param ends 線の向きの順の 2 つの単位の id
       * @param messages つながりのやりとり
       * @param unitOf パスから単位の id を引く
       * @returns `{kind, from, to, messages}` の並び(やりとりの無いものは含まない)。kind は cmd / qry / evt / removed で、

      collect: ({ ends, messages, unitOf }) => {
        const live = messages.filter((message) => !isRemoved(message));

  const BrowserStore = Object.freeze({

  const textSizeControls = () => {

  const PanelLayouts = {
    map: { left: "clamp(224px, 18vw, 264px)", right: "clamp(320px, 28vw, 404px)" },

  /** パネルの幅をドラッグで変え、画面ごとに残す。ダブルクリックで既定の幅へ戻す。 */
  const PanelResizer = (() => {
    const MinWidth = 180;
    const MaxWidth = 640;
    const MainMinWidth = 320;

    const columnsOf = (layout, widths) => {
      const widthOf = (side) => (typeof widths[side] === "number" ? `${widths[side]}px` : layout[side]);
      const right = layout.right === null ? [] : [widthOf("right")];
      return [widthOf("left"), "minmax(0, 1fr)", ...right].join(" ");

    const savedWidthsOf = (value) => {
      const isWidths = typeof value === "object" && value !== null;
      return isWidths ? value : {};
    };

    /** つまみを押したところからの移動量で幅を決める。本文の幅を 320px より狭くしない。 */
    const widthDuring = ({ drag, side, event }) => {
      const moved = side === "left" ? event.clientX - drag.x : drag.x - event.clientX;
      const room = drag.gridWidth - drag.otherWidth - MainMinWidth;
      return Math.round(Math.max(MinWidth, Math.min(MaxWidth, room, drag.width + moved)));
    };

    /**
     * @param screen 画面(保存の鍵に使う)
     * @param grid パネルと本文を並べている grid の要素
     * @param panels 幅を変えるパネル(`left` / `right`)
     */
    const attach = ({ screen, grid, panels }) => {
      const storeKey = `prExplain.panels.${screen}`;
      const layout = PanelLayouts[screen];
      let widths = savedWidthsOf(BrowserStore.read(storeKey));
      const apply = () => {
        grid.style.gridTemplateColumns = columnsOf(layout, widths);
      };
      for (const [side, panel] of Object.entries(panels)) {
        const handle = el("div", { class: "resize-handle", title: "ドラッグで幅を変更(ダブルクリックで元に戻す)" }, [el("span", { class: "resize-bar" })]);
        let drag = null;
        handle.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          handle.classList.add("is-dragging");
          const otherWidth = Object.entries(panels).filter(([other]) => other !== side).reduce((sum, [, other]) => sum + other.getBoundingClientRect().width, 0);
          drag = { x: event.clientX, width: panel.getBoundingClientRect().width, gridWidth: grid.getBoundingClientRect().width, otherWidth };
        });
        handle.addEventListener("pointermove", (event) => {
          if (drag === null) return;
          widths = { ...widths, [side]: widthDuring({ drag, side, event }) };
          apply();
        });
        handle.addEventListener("pointerup", () => {
          if (drag === null) return;
          drag = null;
          handle.classList.remove("is-dragging");
          BrowserStore.write(storeKey, widths);
        });
        handle.addEventListener("dblclick", () => {
          widths = Object.fromEntries(Object.entries(widths).filter(([other]) => other !== side));
          apply();
          BrowserStore.write(storeKey, widths);
        });
        panel.append(handle);
      }
      apply();
    };

    return Object.freeze({ attach });
  })();

        el("span", { class: "eyebrow", text: "レビューポイント" }),
        el("span", { class: "review-count" }, ["確認済み ", el("b", { text: String(counts.done) }), ` / ${counts.all}`]),
        el("span", { class: "spacer" }),
        el("div", { class: "toggle-group" }, filters),
      ]),
      ...cards,
      ...empty,
    ])];
  };

  const strayStoriesOf = (explained) => {
    if (explained.strayStories.length === 0) return [];
    return [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: `地図に無い解説(${explained.strayStories.length})` }),
      ...explained.strayStories.map((story) => el("div", { class: "row" }, [prose("span", { class: "row-title" }, story.role), el("span", { class: "row-meta" }, [el("span", { class: "sha", text: shortSha(story.sha) })])])),
    ])];
  };

  /** ブランチ全体の流れ。解説が無ければ、案内とコミットの件名だけの順番を出す。 */
  const storyOverviewOf = (story) => {
    const { explained } = story;
    if (explained.explain === null) {
      const guide = el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "ブランチ全体の流れ" }), emptyOf("解説はありません。変更の地図だけで組んでいます。左のコミットを選ぶと、件名・本文と差分を読めます。")]);
      return [guide, orderOf(story, "変更の順番")];
    }
    const overview = explained.explain.overview;
    const behaviors = behaviorsOf({
      eyebrow: "振る舞いの変化(ブランチ全体)",
      cards: [
        { title: "これまで", sub: explained.map.baseBranch, lines: overview.before, mark: "—", empty: null },
        { title: "このブランチのあと", sub: explained.map.headBranch, lines: overview.after, mark: "+", empty: null },
      ],
      story,
    });
    return [ledeOf(overview, "ブランチ全体の流れ"), behaviors, orderOf(story, "変更の順番と、それぞれの役割"), ...reviewSectionOf(story), ...strayStoriesOf(explained)];
  };

  const commitHeadOf = (commit, story) => {
    const index = story.commits.indexOf(commit);
    const older = index > 0 ? story.commits[index - 1].sha : OverviewId;
    const newer = index < story.commits.length - 1 ? story.commits[index + 1].sha : null;
    const total = story.steps.size;
    const stepText = commit.merge ? "マージ" : `${story.steps.get(commit.sha)} / ${total}`;
    const step = commit.story === null ? [el("span", { text: stepText })] : [el("span", { "data-phase": commit.story.phase, text: `${stepText} · ${phaseLabelOf(commit.story)}` })];
    const newerButton = pressable("button", { text: "次の変更 →" }, [], () => story.actions.select(newer));
    if (newer === null) newerButton.disabled = true;
    const message = commit.body ? [el("pre", { class: "commit-message", text: commit.body })] : [];
    const [added, deleted] = lineCountsOf(commit.additions, commit.deletions);
    return el("div", { class: "commit-head" }, [
      el("div", { class: "commit-facts" }, [
        el("span", { class: "sha-chip", text: shortSha(commit.sha) }),
        el("span", { text: commit.author }),
        el("span", { class: "muted", text: dateLabel(commit.date) }),
        el("span", { class: "mono" }, [added, " ", deleted]),
        el("span", { class: "muted", text: `${commit.files.length} ファイル` }),
        el("span", { class: "spacer" }),
        el("span", { class: "step-buttons" }, [pressable("button", { text: "← 前の変更" }, [], () => story.actions.select(older)), newerButton]),
      ]),
      el("div", { class: "commit-step" }, step),
      el("h1", { text: commit.subject }),
      ...message,
    ]);
  };

  const commitBehaviorsOf = (commitStory, story) => {
    const before = Array.isArray(commitStory.before) ? commitStory.before : [];
    const after = Array.isArray(commitStory.after) ? commitStory.after : [];
    if (before.length + after.length === 0) return [];
    return [behaviorsOf({
      eyebrow: "何の振る舞いが変わったか",
      cards: [
        { title: "これまで", sub: "", lines: before, mark: null, empty: "(新しく足しただけで、変わる振る舞いはない)" },
        { title: "この変更のあと", sub: "", lines: after, mark: null, empty: null },
      ],
      story,
    })];
  };

  /** 構造マップでその流れを選んだ状態にするチップ。変更の経緯の「影響する操作」と、技術の手引きの「構造マップで見る」が使う。 */
  const flowChipOf = (flow, go) => pressable("button", { class: "flow-chip", title: "構造マップでこの流れを見る" }, [flow.label, el("span", { class: "arrow", text: "↗" })], () => go.toFlow(flow.id));

  /** コミットの解説(なぜ・影響する操作・レビューで見るところ・振る舞いの前後)。 */
  const commitStoryOf = (commit, story) => {
    const commitStory = commit.story;
    const flows = valuesIn(story.lookup.flows, commitStory.flows);
    const flowChips = flows.length === 0 ? [] : [el("div", { class: "flow-chips" }, [
      el("span", { class: "label", text: "影響する操作" }),
      ...flows.map((flow) => flowChipOf(flow, story.go)),
    ])];
    const review = Array.isArray(commitStory.review) ? commitStory.review : [];
    const reviewBlock = review.length === 0 ? [] : [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "レビューで見るところ" }),
      ...review.map((text) => {
        const key = ReviewCheck.keyOf(commit.sha, text);
        return reviewCardOf({ text, isChecked: story.state.checked.has(key), onToggle: () => story.actions.toggleCheck(key), go: null });
      }),
    ])];
    return [
      el("div", { class: "why-grid" }, [el("div", { class: "section" }, [el("span", { class: "eyebrow", text: "なぜこの変更?" }), prose("p", { class: "why-text" }, commitStory.why), ...flowChips]), ...reviewBlock]),
      ...commitBehaviorsOf(commitStory, story),
    ];
  };

  const unexplainedCommitOf = (commit) => {
    if (commit.merge) return [];
    const reason = commit.afterExplained ? "このコミットは解説を書いた後に積まれたので、解説がありません。" : "このコミットには解説がありません。";
    return [emptyOf(`${reason}件名・本文と差分だけを出します。`)];
  };

  const lineRangeOf = (note) => {
    const lines = note.start === note.end ? `${note.start} 行目` : `${note.start}〜${note.end} 行目`;
    return note.side === "old" ? `${lines}(変更前)` : lines;
  };

  /** 光らせる行を持たない注釈(差分に出ていない行・消したファイル・地図に無いパス)。 */
  const plainNoteOf = (note, where) => el("div", { class: "note" }, [
    el("span", { class: "note-badge", text: String(note.n ?? "·") }),
    el("div", { class: "note-body" }, [el("span", { class: "note-lines", text: where }), prose("span", { class: "note-text" }, note.text)]),
  ]);

  /**
   * 載せる(フォーカスする)と、`trigger` と `targetsOf()` を光らせる。
   * @param targetsOf 光らせる要素の並びを返す。光らせる・消すたびに呼ぶ(描き直された要素も拾うため)
   */
  const lightWhileHoveredOrFocused = (trigger, targetsOf) => {
    const light = (isLit) => () => {
      for (const target of [trigger, ...targetsOf()]) target.classList.toggle("is-lit", isLit);
    };
    trigger.addEventListener("mouseenter", light(true));
    trigger.addEventListener("mouseleave", light(false));
    trigger.addEventListener("focus", light(true));
    trigger.addEventListener("blur", light(false));
  };

  /** 行に付いた注釈のカード。載せる(フォーカスする)と、カードと `targets`(行と番号)を光らせる。 */
  const litNoteOf = (note, targets) => {
    const card = el("div", { class: "note", tabindex: "0" }, [el("span", { class: "note-badge", text: String(note.n) }), prose("span", { class: "note-text" }, note.text)]);
    lightWhileHoveredOrFocused(card, () => targets);
    return card;
  };

  /** 字句の並びを 1 行の `code-text` の要素にする(色の無い字句は文字のまま置く)。 */
  const codeTextOf = (tokens) => el("span", { class: "code-text" }, tokens.map((token) => (token.cls === null ? token.value : el("span", { class: token.cls, text: token.value }))));

  const rowLinesOf = (row) => (row.kind === "gap" ? row.lines : [row.line]);

  // コードの表示の左端の線は、足した行のうち空でないものに引き、続く行どうしをつなげる。
  const hasBar = (row) => row !== undefined && row.kind === "line" && row.line.sign === "+" && row.line.text.trim() !== "";
  const barClassOf = (rows, index) => {
    if (!hasBar(rows[index])) return "bar";
    const start = hasBar(rows[index - 1]) ? "" : " is-start";
    const end = hasBar(rows[index + 1]) ? "" : " is-end";
    return `bar is-on${start}${end}`;
  };

  const diffRowOf = ({ row, text, markers, isSent }) => el("div", { class: classesOf("code-line", { "is-sent": isSent }), "data-sign": row.line.sign }, [
    el("span", { class: "ln", text: numberText(row.line.oldNo) }),
    el("span", { class: "ln", text: numberText(row.line.newNo) }),
    el("span", { class: "marks" }, markers),
    el("span", { class: "sign", text: row.line.sign === " " ? "" : row.line.sign }),
    text,
  ]);

  const codeRowOf = ({ row, text, markers, bar, isSent }) => {
    if (row.kind === "gap") return el("div", { class: "code-line is-gap" }, [el("span", { class: "ln" }), el("span", { class: "marks" }, markers), el("span", { class: "bar" }), el("span", { class: "code-text tok-com", text: `⋯ ここにあった ${row.lines.length} 行を削除` })]);
    return el("div", { class: classesOf("code-line", { "is-sent": isSent }), "data-sign": row.line.sign }, [el("span", { class: "ln", text: numberText(row.line.newNo) }), el("span", { class: "marks" }, markers), el("span", { class: bar }), text]);
  };

  /**
   * hunk の見出しと、行・注釈。注釈の番号は、その注釈の範囲に入る最初の行に付ける。送った範囲(`sentLineRange`。変更後の
   * 行番号)に入る行には `is-sent` を付ける(消した行・畳んだ削除には付けない)。
   */
  const hunkOf = (hunk, { grammar, view, sentLineRange }) => {
    const isCode = view === "code";
    const lineTokens = CommitDiff.lineTokensOf(hunk, grammar);
    const textOf = new Map(hunk.lines.map((line, index) => [line, codeTextOf(lineTokens[index])]));
    const rows = isCode ? CommitDiff.codeRowsOf(hunk) : hunk.lines.map((line) => ({ kind: "line", line }));
    const coveredBy = rows.map((row) => hunk.notes.filter((note) => rowLinesOf(row).some((line) => CommitDiff.hasLine(note, line))));
    const markerOf = new Map(hunk.notes.map((note) => [note, el("span", { class: "marker", text: String(note.n) })]));
    const isSentRow = (row) => {
      const isNewLine = sentLineRange !== null && row.kind === "line" && row.line.newNo !== null;
      return isNewLine && isWithin(row.line.newNo, sentLineRange);
    };
    const rowNodes = rows.map((row, index) => {
      const markers = hunk.notes.filter((note) => coveredBy.findIndex((notes) => notes.includes(note)) === index).map((note) => markerOf.get(note));
      const text = row.kind === "gap" ? null : textOf.get(row.line);
      const isSent = isSentRow(row);
      return isCode ? codeRowOf({ row, text, markers, bar: barClassOf(rows, index), isSent }) : diffRowOf({ row, text, markers, isSent });
    });
    const litTargetsOf = (note) => [...rowNodes.filter((node, index) => coveredBy[index].includes(note)), markerOf.get(note)];
    const firstNew = hunk.lines.find((line) => line.newNo !== null);
    const header = isCode ? (firstNew === undefined ? "" : `${firstNew.newNo} 行目から`) : hunk.header;
    const notes = hunk.notes.length === 0 ? [] : [el("div", { class: "hunk-notes" }, hunk.notes.map((note) => litNoteOf(note, litTargetsOf(note))))];
    return [el("div", { class: "hunk-head", text: header }), el("div", { class: "hunk" }, [el("div", { class: isCode ? "hunk-code is-code" : "hunk-code" }, rowNodes), ...notes])];
  };

  /** ファイルの中身。patch の値ごとに出し方を変える。 */
  const fileBodyOf = (file, context) => {
    const body = file.body;
    switch (body.kind) {
      case "hunks": {
        const more = body.remaining > 0 ? [el("div", { class: "file-more" }, [el("a", { href: context.commitUrl, text: `残り ${body.remaining} 行は GitHub で` })])] : [];
        return [...body.hunks.flatMap((hunk) => hunkOf(hunk, context)), ...more];
      }
      case "unchanged":
        return [el("div", { class: "file-omit", text: "中身の変更なし" })];
      case "deleted": {
        const text = body.lines === null ? "ファイルごと削除" : `ファイルごと削除(${body.lines} 行)`;
        const notes = body.notes.length === 0 ? [] : [el("div", { class: "file-notes" }, body.notes.map((note) => plainNoteOf(note, lineRangeOf(note))))];
        return [el("div", { class: "file-omit is-deleted", text }), ...notes];
      }
      case "binary":
        return [el("div", { class: "file-omit", text: "バイナリのため差分は出しません" })];
    }
  };

  const fileCardOf = (file, context) => {
    const conceptName = context.lookup.conceptNames.get(file.path);
    const unplaced = file.unplaced.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: "差分に出ていない行への注釈" }),
      ...file.unplaced.map((note) => plainNoteOf(note, lineRangeOf(note))),
    ])];
    const isSent = context.sentFile !== null && context.sentFile.path === file.path;
    // 送った行の光は注釈に乗ったときの光と同じ見た目なので、送ったカードであることを文で添える。
    const sentNote = isSent ? [el("div", { class: "file-sent-note", text: context.sentFile.lineRange === null ? "技術の手引きから送ったファイル" : `技術の手引きから送った行(${lineRangeOf(context.sentFile.lineRange)})` })] : [];
    const card = el("details", { class: classesOf("file-card", { "is-sent": isSent }), "data-status": file.status }, [
      el("summary", {}, [
        el("span", { class: "chev" }),
        el("span", { class: "status", "data-status": file.status, text: file.status }),
        el("span", { class: "file-path", title: file.path, text: file.oldPath === null ? file.path : `${file.oldPath} → ${file.path}` }),
        ...(conceptName === undefined ? [] : [el("span", { class: "concept-chip", text: conceptName })]),
        el("span", { class: "spacer" }),
        el("span", { class: "file-counts" }, countsTextOf(file)),
      ]),
      ...sentNote,
      ...fileBodyOf(file, { ...context, sentLineRange: isSent ? context.sentFile.lineRange : null }),
      ...unplaced,
    ]);
    const key = `${context.sha}:${file.path}`;
    card.open = !context.closed.has(key);
    card.addEventListener("toggle", () => context.setOpen(key, card.open));
    return card;
  };

  /** 実際のコード。差分 / コードの切り替え、すべて開閉、ファイルのカードと、そのコミットに無いパスへの注釈。 */
  const codeSectionOf = (commit, story) => {
    const { view, closed, sentFile } = story.state;
    const eyebrow = el("span", { class: "eyebrow", text: "実際のコード" });
    const diff = CommitDiff.create(commit, commit.story);
    const strays = diff.strayNotes.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: `地図に無いパスへの注釈(${diff.strayNotes.length})` }),
      ...diff.strayNotes.map((note) => plainNoteOf(note, `${note.path} ${lineRangeOf(note)}`)),
    ])];
    if (commit.merge) return el("div", { class: "section" }, [eyebrow, emptyOf("マージコミットなので、差分は出しません。"), ...strays]);
    const context = { view, closed, sentFile, sha: commit.sha, lookup: story.lookup, commitUrl: `https://github.com/${Repo}/commit/${commit.sha}`, setOpen: story.actions.setOpen };
    const cards = diff.files.map((file) => fileCardOf(file, { ...context, grammar: Tokenizer.grammarOf(file.path) }));
    const openAll = (isOpen) => () => {
      for (const card of cards) card.open = isOpen;
    };
    const views = Object.entries(DiffViews).map(([key, choice]) => pressable("button", { "aria-pressed": String(view === key), title: choice.title, text: choice.label }, [], () => story.actions.setView(key)));
    return el("div", { class: "section" }, [
      el("div", { class: "code-head" }, [
        eyebrow,
        el("div", { class: "toggle-group" }, views),
        el("span", { class: "hint", text: DiffViews[view].hint }),
        el("span", { class: "spacer" }),
        pressable("button", { class: "text-button plain-button", text: "すべて開く" }, [], openAll(true)),
        pressable("button", { class: "text-button plain-button", text: "すべて閉じる" }, [], openAll(false)),
      ]),
      ...cards,
      ...strays,
    ]);
  };

  const commitViewOf = (commit, story) => [
    commitHeadOf(commit, story),
    ...(commit.story === null ? unexplainedCommitOf(commit) : commitStoryOf(commit, story)),
    codeSectionOf(commit, story),
  ];

  /** 変更の経緯。左にコミットを新しい順に並べ、右に全体の流れか、選んだコミットの説明と差分を出す。 */
  const StoryScreen = (explained, go) => {
    const commits = explained.commits;
    const checkedKey = `prExplain.${explained.map.pr}.checked`;
    const fixed = { explained, commits, go, lookup: explained.lookup, steps: new Map(commits.filter((commit) => !commit.merge).map((commit, index) => [commit.sha, index + 1])) };
    const commitAt = explained.commitAt;
    const order = [OverviewId, ...commits.toReversed().map((commit) => commit.sha)];
    // `sentFile` は他の画面から送ったファイル(`{path, lineRange}`。行の範囲が無ければ null)。読み手が選び直したら外す。
    let state = { selected: OverviewId, view: "diff", filter: "all", checked: savedChecksOf(BrowserStore.read(checkedKey)), closed: new Set(), sentFile: null };
    const body = el("div", { class: "stage-body" });
    const main = el("main", { class: "stage" }, [body]);
    const rows = new Map();

    const render = () => {
      const story = { ...fixed, state, actions };
      const isOverview = state.selected === OverviewId;
      body.replaceChildren(...(isOverview ? storyOverviewOf(story) : commitViewOf(commitAt.get(state.selected), story)));
      for (const [id, row] of rows) row.classList.toggle("is-current", id === state.selected);
    };
    const update = (change) => {
      state = { ...state, ...change };
      render();
    };
    const withToggled = (set, key, isMember) => new Set(isMember ? [...set, key] : [...set].filter((member) => member !== key));
    const actions = {
      select: (id) => {
        update({ selected: id, sentFile: null });
        main.scrollTop = 0;
        rows.get(id).scrollIntoView({ block: "nearest" });
      },
      toggleCheck: (key) => {
        const checked = withToggled(state.checked, key, !state.checked.has(key));
        BrowserStore.write(checkedKey, [...checked]);
        update({ checked });
      },
      setFilter: (filter) => update({ filter }),
      setView: (view) => update({ view }),
      // 開閉は details が持っているので、開閉のたびには描き直さない。描き直し(差分 / コードの切り替え・`showFile`)で引き継ぐために
      // 覚える。`showFile` は送ったカードをここから外して開く。
      setOpen: (key, isOpen) => {
        state = { ...state, closed: withToggled(state.closed, key, !isOpen) };
      },
    };

    const story = { ...fixed, state, actions };
    rows.set(OverviewId, pressable("button", { class: "row overview-row plain-button" }, [el("span", { class: "row-title", text: "ブランチ全体の流れ" }), el("span", { class: "row-sub", text: "なぜ・何がこの順番で変わったか" })], () => actions.select(OverviewId)));
    for (const commit of commits.toReversed()) rows.set(commit.sha, commitRowOf(commit, story));
    render();

    /** ↑ ↓ / j k で左の並びを 1 つずつ移る。入力欄の中と、修飾キーを押しているときは移らない。 */
    const onKey = (event) => {
      const hasModifier = event.metaKey || event.ctrlKey || event.altKey;
      const step = Object.hasOwn(MoveKeys, event.key) ? MoveKeys[event.key] : 0;
      const isMove = step !== 0 && !isTypingIn(event) && !hasModifier;
      if (!isMove) return;
      event.preventDefault();
      const next = Math.max(0, Math.min(order.length - 1, order.indexOf(state.selected) + step));
      actions.select(order[next]);
    };

    const overviewRow = rows.get(OverviewId);
    const commitRows = commits.toReversed().map((commit) => rows.get(commit.sha));
    return {
      summary: [countsOf(`${explained.totals.commits} commits`, explained.totals.commitLines.additions, explained.totals.commitLines.deletions)],
      controls: [el("span", { class: "hint", text: "↑ ↓ でコミットを移動" })],
      tablist: null,
      left: panelOf("left", [panelHead("コミット", "新しい順"), el("div", { class: "panel-scroll" }, [overviewRow, el("div", { class: "commit-list" }, commitRows)])]),
      main,
      right: null,
      onKey,
      /** 他の画面から、そのコミットを選んだ状態にする。地図に無い sha なら全体の流れを出す。 */
      select: (sha) => actions.select(commitAt.has(sha) ? sha : OverviewId),
      /**
       * 他の画面から、そのコミットのそのファイルを開いた状態にする。`lineRange` があれば、その行に印を付けて送る。渡すのは
       * `PrimerTopics` が届くと判定したもの(地図にあり、マージでなく、そのパスのファイルを変えたコミット)だけ。
       */
      showFile: ({ sha, path, lineRange }) => {
        update({ selected: sha, sentFile: { path, lineRange }, closed: withToggled(state.closed, `${sha}:${path}`, false) });
        rows.get(sha).scrollIntoView({ block: "nearest" });
        const line = body.querySelector(".code-line.is-sent");
        if (line !== null) line.scrollIntoView({ block: "center" });
        else body.querySelector(".file-card.is-sent").scrollIntoView({ block: "start" });
      },
    };
  };

  /** 図の中の位置と大きさを要素に付ける。 */
  const placedAt = (node, rect) => {
    Object.assign(node.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px` });
    return node;
  };

  /** 真のものだけをクラスに足す。 */
  const classesOf = (base, flags) => [base, ...Object.entries(flags).filter(([, isOn]) => isOn).map(([name]) => name)].join(" ");

  /**
   * 箱の図を載せるキャンバス。4px 動かしてからのドラッグで動かし、ホイールと −/+ で 0.2〜2.5 倍に拡大縮小し、
   * 全体表示で収める。キャンバスの大きさが変わったときと、書体を読み込んだあと(読み手が動かしていなければ)にも
   * 収め直す。図を置ける広さ(上下の重ねもののあいだ)が変わったら画面に知らせ、画面はそれに合わせて並べ直す。
   * マウスが乗っている線(`data-edge` を持つ線とラベル)が変わったときも画面に知らせる。
   */
  const GraphView = (() => {
    const MinScale = 0.2;
    const MaxScale = 2.5;
    const MaxFitScale = 1.05;
    const ZoomStep = 1.2;
    const WheelRate = 0.0015;
    const DragThreshold = 4;
    const FitMargin = 24;
    const MinFreeHeight = 80;
    const ResizeSettle = 30;
    const clampScale = (scale) => Math.min(MaxScale, Math.max(MinScale, scale));

    /**
     * @param top 図の上に重ねるもの
     * @param legend 図の下に重ねる凡例
     * @param onBackground 何も無いところを押したときに呼ぶ
     * @param onFirstFit 初めて収めたときに、そのときの縮尺で呼ぶ
     * @param onRoom 図を置ける広さが変わったときに呼ぶ(収め直す前)
     * @param onHover マウスが乗っている線が変わったときに呼ぶ
     * @returns キャンバスの要素(`element`)、図の中身を差し替える `show`、図を置ける広さを返す `room`、マウスが乗っている
     *   線の鍵を返す `hoveredEdge`
     */
    const create = ({ top, legend, onBackground, onFirstFit, onRoom, onHover }) => {
      const world = el("div", { class: "graph-world" });
      const percent = el("span", { class: "zoom-percent", text: "100%" });
      const empty = el("div", { class: "graph-empty", text: "図に出す箱がありません", hidden: "" });
      const topOverlay = el("div", { class: "graph-overlay is-top" }, top);
      const zoomControls = el("div", { class: "zoom-controls" });
      const bottomOverlay = el("div", { class: "graph-overlay is-bottom" }, [...legend, zoomControls]);
      const canvas = el("main", { class: "graph-canvas" }, [world, empty, topOverlay, bottomOverlay]);
      let state = { view: { scale: 1, x: 0, y: 0 }, size: { width: 0, height: 0 }, signature: null, fitted: false, userMoved: false, box: null, measured: null, room: null, suppressClick: false };

      const moveTo = (view, animate) => {
        state = { ...state, view };
        world.classList.toggle("is-animated", animate);
        world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
        percent.textContent = `${Math.round(view.scale * 100)}%`;
      };

      /** `center`(キャンバスの中の点)の下にあるものを動かさずに拡大縮小する。 */
      const zoomAround = (scale, center, animate) => {
        const { view } = state;
        const next = clampScale(scale);
        moveTo({ scale: next, x: center.x - ((center.x - view.x) * next) / view.scale, y: center.y - ((center.y - view.y) * next) / view.scale }, animate);
      };

      /** 図を置ける広さ。左右に余白を取り、上下は重ねもののあいだ。`top` はその上端のキャンバスの中の位置。 */
      const freeAreaOf = (rect) => {
        const topEdge = topOverlay.getBoundingClientRect().bottom - rect.top + FitMargin;
        const bottomEdge = rect.bottom - bottomOverlay.getBoundingClientRect().top + FitMargin;
        return { top: topEdge, width: rect.width - FitMargin * 2, height: Math.max(MinFreeHeight, rect.height - topEdge - bottomEdge) };
      };

      /**
       * 図を上下の重ねもののあいだに収める。1.05 倍より大きくはしない。
       * @returns 収めた縮尺。キャンバスが隠れている・図が空で測れなければ null
       */
      const fit = (animate) => {
        const rect = canvas.getBoundingClientRect();
        const isMeasurable = rect.width > 0 && rect.height > 0 && state.size.width > 0;
        if (!isMeasurable) return null;
        const free = freeAreaOf(rect);
        const { width, height } = state.size;
        const scale = clampScale(Math.min(MaxFitScale, free.width / width, free.height / height));
        moveTo({ scale, x: (rect.width - width * scale) / 2, y: free.top + (free.height - height * scale) / 2 }, animate);
        return scale;
      };

      /** 収め直して、読み手が動かした印を消す。初めて収めたときは `onFirstFit` を呼ぶ。 */
      const refit = (animate) => {
        const scale = fit(animate);
        if (scale === null) return;
        const isFirst = !state.fitted;
        state = { ...state, fitted: true, userMoved: false };
        if (isFirst) onFirstFit(scale);
      };

      const onResize = () => {
        const rect = canvas.getBoundingClientRect();
        const isHidden = rect.width === 0 || rect.height === 0;
        if (isHidden) return;
        const box = `${Math.round(rect.width)}x${Math.round(rect.height)}`;
        const measured = `${box}|${Math.round(topOverlay.offsetHeight)}|${Math.round(bottomOverlay.offsetHeight)}`;
        const isUnchanged = measured === state.measured;
        // 読み手が動かした後は、重ねものの高さが変わっただけなら収め直さない。キャンバスの大きさが変われば収め直す。
        const keepsUserView = state.userMoved && box === state.box;
        const keepsView = state.fitted && (isUnchanged || keepsUserView);
        const free = freeAreaOf(rect);
        state = { ...state, box, measured, room: { width: free.width, height: free.height } };
        if (!isUnchanged) onRoom();
        if (!keepsView) refit(false);
      };

      const zoomBy = (factor) => {
        const rect = canvas.getBoundingClientRect();
        state = { ...state, userMoved: true };
        zoomAround(state.view.scale * factor, { x: rect.width / 2, y: rect.height / 2 }, true);
      };
      zoomControls.append(
        pressable("button", { class: "is-step", title: "縮小", text: "−" }, [], () => zoomBy(1 / ZoomStep)),
        percent,
        pressable("button", { class: "is-step", title: "拡大", text: "+" }, [], () => zoomBy(ZoomStep)),
        el("span", { class: "zoom-sep" }),
        pressable("button", { text: "全体表示" }, [], () => refit(true)),
      );

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        state = { ...state, userMoved: true };
        zoomAround(state.view.scale * Math.exp(-event.deltaY * WheelRate), { x: event.clientX - rect.left, y: event.clientY - rect.top }, false);
      }, { passive: false });

      canvas.addEventListener("pointerdown", (event) => {
        const isPan = event.button === 0 && event.target.closest("button") === null;
        if (!isPan) return;
        const start = { x: event.clientX, y: event.clientY, view: state.view };
        let isMoving = false;
        const onMove = (move) => {
          const dx = move.clientX - start.x;
          const dy = move.clientY - start.y;
          const isStill = !isMoving && Math.hypot(dx, dy) < DragThreshold;
          if (isStill) return;
          isMoving = true;
          canvas.classList.add("is-dragging");
          state = { ...state, userMoved: true };
          moveTo({ ...start.view, x: start.view.x + dx, y: start.view.y + dy }, false);
        };
        const onUp = () => {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          if (!isMoving) return;
          canvas.classList.remove("is-dragging");
          // 離した直後の click はドラッグの終わりで、箱や線を押したのではない。
          state = { ...state, suppressClick: true };
          setTimeout(() => {
            state = { ...state, suppressClick: false };
          }, 0);
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
      canvas.addEventListener("click", (event) => {
        if (!state.suppressClick) return;
        event.stopPropagation();
        event.preventDefault();
      }, true);
      canvas.addEventListener("click", (event) => {
        const isBackground = event.target === canvas || event.target === world;
        if (isBackground) onBackground();
      });

      // 画面が描き直して要素が入れ替わっても、次に動かしたときに同じ線を指していれば知らせない。
      let hovered = null;
      const hoverTo = (key) => {
        if (key === hovered) return;
        hovered = key;
        onHover();
      };
      canvas.addEventListener("mouseover", (event) => {
        const edge = event.target instanceof Element ? event.target.closest("[data-edge]") : null;
        hoverTo(edge === null ? null : edge.getAttribute("data-edge"));
      });
      canvas.addEventListener("mouseleave", () => hoverTo(null));

      let resizeTimer = null;
      const observer = new ResizeObserver(() => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(onResize, ResizeSettle);
      });
      for (const target of [canvas, topOverlay, bottomOverlay]) observer.observe(target);
      document.fonts.ready.then(() => {
        if (!state.userMoved) refit(false);
      });

      return {
        element: canvas,
        /** @returns 図を置ける広さ `{width, height}`。まだ測っていなければ null */
        room: () => state.room,
        /** @returns マウスが乗っている線の鍵。乗っていなければ null */
        hoveredEdge: () => hovered,
        /**
         * 図の中身を差し替える。配置が変わったとき(`signature` が前と違うとき)だけ収め直す。
         * @param signature 配置を表す文字列(まとめ方・開いた組など)
         * @param size 図の大きさ
         * @param children 図の中身(座標は図の左上から)
         */
        show: ({ signature, size, children }) => {
          const isRelayout = signature !== state.signature;
          // まだ一度も収めていなければ、キャンバスが見えたときに ResizeObserver が収める。
          const isRefitDue = isRelayout && state.fitted;
          state = { ...state, signature, size };
          world.replaceChildren(...children);
          empty.hidden = size.width > 0;
          if (isRefitDue) refit(true);
        },
      };
    };

    return Object.freeze({ create });
  })();

  /** 図の配置を表す文字列。描く単位か図の大きさが変われば変わり、GraphView が収め直す。 */
  const signatureOf = (grouping, layout) => `${grouping}|${layout.units.map((unit) => unit.id).join(",")}|${layout.width}x${layout.height}`;
  // 初めて収めたときにこれより小さくしか入らないなら、箱の字が読めないので組をすべて畳む。
  const isTooSmall = (scale) => scale < 0.5;

  /** まとめ方の組の id。図の組の id に使う。 */
  const groupKeyOf = (group) => {
    switch (group.kind) {
      case "layer":
        return `layer:${group.layer}`;
      case "feature":
        return `feature:${group.feature.id}`;
      case "unassigned":
        return "unassigned";
    }
  };

  /** まとめ方の組の見出し。 */
  const groupLabelOf = (group) => {
    switch (group.kind) {
      case "layer":
        return group.layer;
      case "feature":
        return group.feature.label;
      case "unassigned":
        return "未分類";
    }
  };

  const changedLinesOf = (entry) => (entry.additions ?? 0) + (entry.deletions ?? 0);

  /** まとめ方の組を、図の組(箱と、その変更行数)にする。 */
  const graphGroupsOf = (groups, entryAt) => groups.map((group) => ({
    id: groupKeyOf(group),
    label: groupLabelOf(group),
    boxes: group.paths.map((path) => ({ path, lines: changedLinesOf(entryAt.get(path)) })),
  }));

  const hasSameMembers = (some, others) => some.length === others.length && some.every((member) => others.includes(member));
  const withToggledMember = (list, member) => (list.includes(member) ? list.filter((other) => other !== member) : [...list, member]);

  /** 押した 1 つだけが選ばれるボタンの組。 */
  const toggleGroupOf = ({ options, current, onPick }) => el("div", { class: "toggle-group" }, options.map((option) => pressable("button", { "aria-pressed": String(option.value === current), title: option.title ?? "", text: option.label }, [], () => onPick(option.value))));
  /** 見出しの付いたボタンの組(ヘッダ・キャンバスの操作)。 */
  const labeledToggleOf = (label, toggle) => [el("span", { class: "control-label", text: label }), toggleGroupOf(toggle)];
  /** 入り切りのボタン。`aria-pressed` は呼び出し側が描くたびに付け直す。 */
  const switchButtonOf = ({ label, title, onPress }) => pressable("button", { class: "switch-button", title }, [el("span", { class: "switch" }), label], onPress);
  /** 箱の中のボタン。押しても箱を選んだことにしない。 */
  const withoutSelecting = (handler) => (event) => {
    event.stopPropagation();
    handler();
  };
  /** キー操作が入力欄の中で起きたか。入力欄の中では画面のキー操作を効かせない。 */
  const isTypingIn = (event) => event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]") !== null;

  const Techniques = Vocabulary.techniques;
  const TestStatuses = {
    new: { label: "追加", long: "このブランチで追加" },
    old: { label: "既存", long: "既存のテスト" },
    todo: { label: "未実装", long: "未実装(提案)" },
    removed: { label: "削除", long: "このブランチで削除" },
    unjudged: { label: "判定なし", long: "追加か既存かの判定なし(テスト名を調べていないファイル)" },
  };
  const GroupingLabels = { feature: "機能", layer: "層" };
  const LevelChoices = [
    { value: GraphLayout.Levels.High, label: "高", title: "すべてのグループを折りたたむ" },
    { value: GraphLayout.Levels.Mid, label: "中", title: "変更の多いグループだけ展開" },
    { value: GraphLayout.Levels.Low, label: "低", title: "すべて個別に表示" },
  ];
  const NamingChoices = [{ value: "concept", label: "概念" }, { value: "file", label: "ファイル" }];
  /** 開いている組が、どの抽象度の開き方と同じか。どれとも違えば null。 */
  const levelOf = (groups, expanded) => {
    const level = LevelChoices.find((choice) => hasSameMembers(GraphLayout.expandedAt(choice.value, groups), expanded));
    return level === undefined ? null : level.value;
  };
  /** やりとりの名前。表示名が概念なら名前、ファイルならコード。 */
  const messageTextOf = (message, naming) => (naming === "concept" ? message.name : message.code);
  /** 線のラベルに並べる名前のうち最も広いもの(逆向きの印を含む)に、`padding` を足した幅。やりとりが無ければ 0。 */
  const widestLabelOf = ({ messages, naming, padding }) => {
    if (messages.length === 0) return 0;
    return Math.max(...messages.map((message) => GraphLayout.textWidthOf(`↩ ${messageTextOf(message, naming)}`))) + padding;
  };
  const LabelChipHeight = 23;
  const LabelMoreHeight = 16;

  /** 線のラベルに並べるやりとりの名前。線の向きと逆のものには `↩` を付ける。 */
  const labelTextsOf = ({ messages, edge, layout, naming }) => messages.map((message) => `${layout.unitOf.get(message.from) !== edge.from ? "↩ " : ""}${messageTextOf(message, naming)}`);
  /** ラベルの大きさ。`padding` は文字の外側(余白・枠・印)の幅、`more` は並べきれなかった件数。 */
  const labelSizeOf = ({ texts, more, padding }) => ({ width: Math.max(...texts.map(GraphLayout.textWidthOf)) + padding, height: texts.length * LabelChipHeight + (more > 0 ? LabelMoreHeight : 0) });

  /** 構造マップとテストの画面が共有する図の材料。まとめ方ごとの図の組・組の見出し・まとめ方の並び・パスから木の項目を引く表・やりとり。 */
  const graphMaterialsOf = (explained) => {
    const { entryAt } = explained;
    const graphGroups = Object.fromEntries(Object.entries(explained.groupings).map(([grouping, groups]) => [grouping, graphGroupsOf(groups, entryAt)]));
    return {
      entryAt,
      graphGroups,
      groupLabels: new Map(Object.values(graphGroups).flat().map((group) => [group.id, group.label])),
      groupings: Object.keys(graphGroups),
      messages: [...explained.lookup.messages.values()],
    };
  };

  /** 図の初めの状態。機能でまとめられれば機能、解説があれば概念の名前で出し、抽象度は中。 */
  const initialGraphStateOf = (materials, explained) => ({
    grouping: materials.groupings.includes("feature") ? "feature" : "layer",
    naming: explained.explain === null ? "file" : "concept",
    expanded: Object.fromEntries(materials.groupings.map((grouping) => [grouping, GraphLayout.expandedAt(GraphLayout.Levels.Mid, materials.graphGroups[grouping])])),
  });

  /** 2 つの選択が同じものを指すか。どちらも null(何も選んでいない)なら同じ。 */
  const isSameSelection = (some, other) => {
    const hasNull = some === null || other === null;
    return hasNull ? some === other : some.kind === other.kind && some.id === other.id;
  };

  const MessageStatuses = Vocabulary.messageStatuses;
  const isMessageChanged = (message) => Object.hasOwn(MessageStatuses, message.status ?? "");
  /** やりとりの色の区分。前からあって変えていないものは空。 */
  const messageToneOf = (message) => (isMessageChanged(message) ? MessageStatuses[message.status].tone : "");

  // 1 つの線のラベルに並べるやりとりの数。選んだ線・マウスが乗っている線・選んだテストが 3 件以下で通る線は 5 件まで、他は 1 件。
  const LabelLimits = { important: 5, other: 1 };
  const LabelPadding = 64;
  const techniqueChipOf = (key) => el("span", { class: "technique", "data-technique": key, text: Techniques[key].label });
  /** テストの抜けとして数えるやりとり(このブランチで足した・変えたもの)か。 */
  const isGapCandidate = (message) => message.status === "added" || message.status === "changed";
  const matchesTechniques = (test, techniques) => techniques.length === 0 || test.techniques.some((key) => techniques.includes(key));

  /**
   * 別の画面へ移るカード。名前と札(`tag`)に、移る先(`goText`。「テストで見る」など)を矢印付きで添える。
   * テスト・振る舞い・技術の手引きの 3 画面が使い、`status` はテストの状態で札の色になる(テストでないカードは null)。
   */
  const jumpCardOf = ({ name, tag, status, goText, title, onPress }) => pressable("button", { class: "test-card plain-button", title }, [
    el("span", { class: "test-name", text: name }),
    el("span", { class: "test-facts" }, [el("span", { class: "test-status", ...(status === null ? {} : { "data-status": status }), text: tag }), el("span", { class: "spacer" }), el("span", { class: "review-go", text: `${goText} →` })]),
  ], onPress);

  /** テストの画面でそのテストを開くカード。 */
  const testJumpCardOf = (test, go) => jumpCardOf({
    name: test.name,
    tag: TestStatuses[test.status].long,
    status: test.status,
    goText: `${ScreenLabels.test}で見る`,
    title: "テストの画面でこのテストを見る",
    onPress: () => go.toTest(test.test.id),
  });

  /**
   * 根拠のテストの欄。確かめているテスト(無ければ「この PR では未確認」)と、無いテスト(未実装の提案。あるときだけ)。
   * @param evidence `testEvidenceOf` が返したもの
   */
  const testsBlocksOf = (evidence, go) => [
    el("div", { class: "side-block" }, [
      eyebrowOf("確かめているテスト", `${evidence.verifying.length} 件`),
      ...evidence.verifying.map((test) => testJumpCardOf(test, go)),
      ...(evidence.isGuarded ? [] : [el("span", { class: "warn-text", text: "この PR では未確認(確かめているテストがありません)" })]),
    ]),
    ...(evidence.missing.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("無いテスト", "未実装(提案)"), ...evidence.missing.map((test) => testJumpCardOf(test, go))])]),
  ];

  /**
   * コードの抜粋の箱。行番号はファイルの行で、強調の範囲に入る行には `is-emphasized` を付ける。
   * @param excerpt 抜粋(検査が中身の `text` と、あれば開いた行 `openingLine` を足したもの)
   * @returns 箱 1 つの並び。中身(`text`)が足されていなければ空の並び
   */
  const excerptBoxesOf = (excerpt) => {
    if (!isString(excerpt.text)) return [];
    const rows = ExcerptRows.create(excerpt).map((row) => el("div", { class: classesOf("excerpt-line", { "is-emphasized": row.isEmphasized }) }, [el("span", { class: "ln", text: String(row.number) }), codeTextOf(row.tokens)]));
    return [el("div", { class: "excerpt" }, rows)];
  };

  /**
   * テストの画面のコードの抜粋。小見出しの横に `パス:開始-終了` を出す。
   * @param title 小見出し
   * @returns 中身(`text`)が足されていなければ空の並び
   */
  const excerptBlockOf = (excerpt, title) => excerptBoxesOf(excerpt).map((box) => el("div", { class: "side-block" }, [eyebrowOf(title, `${excerpt.path}:${excerpt.start}-${excerpt.end}`), box]));

  /**
   * 技術の手引きのコード例。箱の上端に、パス · 行番号と、拡張子(言語名の代わり)の見出しを置く。
   * @returns 中身(`text`)が足されていなければ空の並び
   */
  const codeExampleOf = (excerpt) => excerptBoxesOf(excerpt).map((box) => {
    const lines = excerpt.start === excerpt.end ? `L${excerpt.start}` : `L${excerpt.start}–${excerpt.end}`;
    const extension = (excerpt.path.match(/\.(\w+)$/) || [])[1] ?? "";
    return el("div", { class: "primer-code" }, [
      el("div", { class: "primer-code-head" }, [el("span", { class: "primer-code-path", text: `${excerpt.path} · ${lines}` }), el("span", { text: extension })]),
      box,
    ]);
  });

  /**
   * 変更の経緯のコミットへ移るボタン。地図に無い sha なら、件名の位置に「地図に無いコミット」と出す。
   * @param label 左に添える名前(「追加したコミット」「差分で見る」など)
   * @param commitAt 地図のコミットを sha で引く表(`ExplainedMap` の `commitAt`)
   */
  const commitLinkOf = ({ sha, label, commitAt, onPress }) => {
    const commit = commitAt.get(sha);
    const subject = commit === undefined ? "地図に無いコミット" : commit.subject;
    return pressable("button", { class: "commit-link plain-button", title: "変更の経緯でこのコミットを開く" }, [
      el("span", { class: "label", text: label }),
      el("span", { class: "sha", text: shortSha(sha) }),
      el("span", { class: "subject", text: subject }),
      el("span", { class: "arrow", text: "↗" }),
    ], onPress);
  };

  /** テストの画面。左にテストの一覧、中に箱の図、右に全体か、選んだテスト・箱・線の詳しいところを出す。 */
  const TestScreen = (explained, go) => {
    const { explain, lookup } = explained;
    const materials = graphMaterialsOf(explained);
    const { entryAt, graphGroups, groupLabels, groupings, messages } = materials;
    const hasMessages = messages.length > 0;
    const tests = explained.tests.map((item, index) => {
      const covers = item.test !== null && Array.isArray(item.test.covers) ? item.test.covers : [];
      return { ...item, id: index, techniques: item.test === null ? [] : item.test.techniques, covers };
    });
    const techniqueCounts = Object.fromEntries(Object.keys(Techniques).map((key) => [key, tests.filter((test) => test.techniques.includes(key)).length]));
    const suiteIds = (explain !== null && Array.isArray(explain.suites) ? explain.suites : []).map((suite) => `suite:${suite.id}`);
    const suiteKeyOf = (test) => (test.suite === null ? `file:${test.file ?? ""}` : `suite:${test.suite.id}`);
    const suiteKeys = [...new Set([...suiteIds, ...tests.map(suiteKeyOf)])];
    const messageLinks = messages.map((message) => ({ from: message.from, to: message.to, item: message, leads: message.kind !== "evt" }));
    const dependencyLinks = explained.dependencies.filter((link) => link.status !== "removed").map((link) => ({ from: link.from, to: link.to, item: link, leads: true }));
    /** テストが箱(か組)の中のファイルを対象にしているか。 */
    const touchesPlace = (test, place) => test.targets.some((path) => place.paths.includes(path));
    /** テストが線のやりとりのどれかを確かめているか。 */
    const touchesEdge = (test, edge) => edge.items.some((message) => test.covers.includes(message.id));

    let state = { ...initialGraphStateOf(materials, explained), selected: null, techniques: [], showGaps: false };

    /** いまの状態から、図の配置と、テスト・やりとりの数え上げを作る。 */
    const modelOf = (current) => {
      const labelWidth = widestLabelOf({ messages, naming: current.naming, padding: LabelPadding });
      const layout = GraphLayout.create({ groups: graphGroups[current.grouping], links: explained.dependencies, expanded: current.expanded[current.grouping], room: graph.room(), labelWidth });
      const shown = tests.filter((test) => matchesTechniques(test, current.techniques));
      const verifying = shown.filter(isVerifying);
      const coverage = new Map(messages.map((message) => [message.id, verifying.filter((test) => test.covers.includes(message.id))]));
      const isGap = (message) => isGapCandidate(message) && coverage.get(message.id).length === 0;
      const crossesUnits = (message) => layout.unitOf.get(message.from) !== layout.unitOf.get(message.to);
      const touches = (place, message) => place.paths.includes(message.from) || place.paths.includes(message.to);
      const edges = GraphLayout.edgesOf(layout, hasMessages ? messageLinks : dependencyLinks);
      return {
        layout,
        shown,
        coverage,
        isGap,
        placeTests: (place) => verifying.filter((test) => touchesPlace(test, place)),
        placeGaps: (place) => messages.filter((message) => isGap(message) && crossesUnits(message) && touches(place, message)),
        places: new Map([...layout.units, ...layout.containers].map((place) => [place.id, place])),
        edges,
        edgeAt: new Map(edges.map((edge) => [edge.key, edge])),
      };
    };

    /** 選んだものが光らせる単位・線・やりとり。 */
    const litOf = (model, selected) => {
      const none = { units: new Set(), edges: new Set(), messages: new Set() };
      if (selected === null) return none;
      switch (selected.kind) {
        case "test": {
          const test = tests[selected.id];
          const covered = test.covers.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
          const paths = [...covered.flatMap((message) => [message.from, message.to]), ...test.targets];
          const edges = model.edges.filter((edge) => touchesEdge(test, edge));
          return { units: new Set(paths.map((path) => model.layout.unitOf.get(path)).filter((id) => id !== undefined)), edges: new Set(edges.map((edge) => edge.key)), messages: new Set(test.covers) };
        }
        case "place":
          return { ...none, units: new Set([selected.id]) };
        case "edge": {
          const edge = model.edgeAt.get(selected.id);
          return { ...none, units: new Set([edge.from, edge.to]), edges: new Set([selected.id]) };
        }
      }
    };

    /** 配置が変わって選んだ箱・線が図から消えたら、選択を外す。 */
    const validSelectionOf = (selected, model) => {
      if (selected === null) return null;
      switch (selected.kind) {
        case "test":
          return selected;
        case "place":
          return model.places.has(selected.id) ? selected : null;
        case "edge":
          return model.edgeAt.has(selected.id) ? selected : null;
      }
    };

    const update = (change) => {
      state = { ...state, ...change };
      render();
    };
    const select = (next) => update({ selected: isSameSelection(state.selected, next) ? null : next });
    const toggleGroup = (id) => update({ expanded: { ...state.expanded, [state.grouping]: withToggledMember(state.expanded[state.grouping], id) } });

    const placeNameOf = (place) => {
      if (place.kind !== "box") return groupLabels.get(place.group);
      return ExplainedMap.nameOf(entryAt.get(place.path), state.naming);
    };
    /** やりとりの端の名前。そのパスを含む箱(畳んだ組なら組)の名前で、図に無ければ concept 名かパス。 */
    const endNameOf = (model, path) => {
      const unit = model.places.get(model.layout.unitOf.get(path));
      if (unit !== undefined) return placeNameOf(unit);
      return lookup.conceptNames.get(path) ?? path;
    };
    const messageNameOf = (message) => messageTextOf(message, state.naming);
    const edgeKeyBetween = (model, message) => {
      const ends = [model.layout.unitOf.get(message.from), model.layout.unitOf.get(message.to)];
      const isDrawn = ends.every((id) => id !== undefined) && ends[0] !== ends[1];
      return isDrawn ? GraphLayout.edgeKeyOf(ends[0], ends[1]) : null;
    };

    const controlNodes = {
      grouping: el("div", { class: "control" }),
      level: el("div", { class: "control" }),
      gaps: switchButtonOf({ label: "テストの抜けを強調", title: "テストの無いやりとりと、それに関わる箱を目立たせる", onPress: () => update({ showGaps: !state.showGaps }) }),
    };
    const renderControls = () => {
      const groups = graphGroups[state.grouping];
      const groupingChoices = groupings.toReversed().map((grouping) => ({ value: grouping, label: GroupingLabels[grouping] }));
      controlNodes.grouping.replaceChildren(...labeledToggleOf("まとめ方", { options: groupingChoices, current: state.grouping, onPick: (grouping) => update({ grouping, selected: null }) }));
      controlNodes.level.replaceChildren(...labeledToggleOf("抽象度", { options: LevelChoices, current: levelOf(groups, state.expanded[state.grouping]), onPick: (choice) => update({ expanded: { ...state.expanded, [state.grouping]: GraphLayout.expandedAt(choice, groups) } }) }));
