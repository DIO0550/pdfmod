      controlNodes.gaps.setAttribute("aria-pressed", String(state.showGaps));
    };

    const listHead = el("div", { class: "list-head" });
    const listBody = el("div", { class: "panel-scroll" });

    /** 選んだ箱・線を確かめているテストか。 */
    const relatesToSelection = (test, view) => {
      const { selected, model } = view;
      const isTargetSelected = selected !== null && selected.kind !== "test";
      if (!isTargetSelected) return false;
      if (selected.kind === "edge") return touchesEdge(test, model.edgeAt.get(selected.id));
      return touchesPlace(test, model.places.get(selected.id));
    };

    const testRowOf = (test, view) => {
      const isCurrent = isSameSelection(view.selected, { kind: "test", id: test.id });
      const isRelated = relatesToSelection(test, view);
      const isTargetSelected = view.selected !== null && view.selected.kind !== "test";
      const status = test.status === "old" ? [] : [el("span", { class: "test-status", "data-status": test.status, text: TestStatuses[test.status].label })];
      return pressable("button", { class: classesOf("test-row plain-button", { "is-current": isCurrent, "is-related": isRelated, "is-dim": isTargetSelected && !isRelated }), "data-status": test.status, "data-test": String(test.id), title: test.file ?? "" }, [
        el("span", { class: "test-mark", "data-status": test.status }),
        el("span", { class: "test-body" }, [el("span", { class: "test-name", text: test.name }), el("span", { class: "test-facts" }, [...test.techniques.map(techniqueChipOf), ...status])]),
      ], () => select({ kind: "test", id: test.id }));
    };

    const suiteHeadOf = (first) => {
      const label = first.suite === null ? (first.file ?? "").split("/").pop() : first.suite.label;
      const file = first.suite === null ? first.file ?? "" : first.suite.file;
      return el("div", { class: "suite-head", title: file }, [el("span", { class: "suite-title", text: label }), el("span", { class: "suite-file", text: file })]);
    };

    const renderList = (view) => {
      const { model } = view;
      const isFiltering = state.techniques.length > 0;
      const filters = explain === null ? [] : [el("div", { class: "tech-filters" }, Object.entries(Techniques).map(([key, technique]) => pressable("button", { class: "tech-filter", "data-technique": key, "aria-pressed": String(state.techniques.includes(key)), title: technique.description }, [el("span", { class: "swatch" }), technique.label, el("span", { class: "n", text: String(techniqueCounts[key]) })], () => update({ techniques: withToggledMember(state.techniques, key) }))))];
      listHead.replaceChildren(panelHead("テストケース", `${model.shown.length} 件${isFiltering ? "(絞り込み中)" : ""}`), ...filters);
      const suites = suiteKeys.map((key) => model.shown.filter((test) => suiteKeyOf(test) === key)).filter((members) => members.length > 0);
      const note = explain === null ? [emptyOf("解説が無いので、変更の地図にあるテストの追加と削除だけを並べています。")] : [];
      const blocks = suites.map((members) => el("div", { class: "suite" }, [suiteHeadOf(members[0]), ...members.map((test) => testRowOf(test, view))]));
      const nothing = tests.length === 0 ? [emptyOf("この PR で増減したテストはありません。")] : [];
      const scrollTop = listBody.scrollTop;
      listBody.replaceChildren(...note, ...blocks, ...nothing);
      listBody.scrollTop = scrollTop;
    };

    const canvasControls = el("div", { class: "canvas-controls" });
    const legendItems = [
      el("span", {}, [el("span", { class: "box-count", text: "3" }), "その要素を確かめるテスト数"]),
      ...(hasMessages ? [
        el("span", {}, [el("span", { class: "coverage-tag is-tested", text: "✓2" }), "やりとりを確かめるテスト"]),
        el("span", {}, [el("span", { class: "coverage-tag is-gap", text: "未テスト" }), "追加・変更したのにテストがない"]),
      ] : []),
    ];
    let lastView = null;
    const graph = GraphView.create({
      top: [canvasControls],
      legend: [el("div", { class: "legend" }, legendItems)],
      onBackground: () => {
        if (state.selected !== null) update({ selected: null });
      },
      onFirstFit: (scale) => {
        if (isTooSmall(scale)) update({ expanded: Object.fromEntries(groupings.map((grouping) => [grouping, []])) });
      },
      onRoom: () => render(),
      onHover: () => {
        if (lastView !== null) renderGraph(lastView);
      },
    });

    const hintTextOf = (view) => {
      const isTestSelected = view.selected !== null && view.selected.kind === "test";
      if (isTestSelected) return "選んだテストが確かめている範囲を表示中";
      if (state.techniques.length > 0) return "絞り込んだ観点のテストだけで数えています";
      if (!hasMessages) return "数字=その要素を確かめるテストの数 · 線はコードの依存(解説にやりとりが無いため)";
      return "数字=その要素を確かめるテストの数 · 点線=テストのないやりとり";
    };

    const renderCanvasControls = (view) => {
      const naming = explain === null ? [] : [el("div", { class: "control is-canvas" }, labeledToggleOf("表示名", { options: NamingChoices, current: state.naming, onPick: (choice) => update({ naming: choice }) }))];
      canvasControls.replaceChildren(...naming, el("span", { class: "canvas-hint", text: hintTextOf(view) }));
    };

    const containerNodeOf = (container, view) => {
      const { model, lit, selected } = view;
      const isPicked = isSameSelection(selected, { kind: "place", id: container.id });
      const hasLitInside = isPicked || container.paths.some((path) => lit.units.has(`box:${path}`));
      const node = placedAt(el("div", { class: classesOf("graph-container", { "is-picked": isPicked, "is-dim": selected !== null && !hasLitInside }), title: "ダブルクリックで折りたたむ" }, [
        el("div", { class: "graph-container-head" }, [
          el("span", { class: "graph-container-title", text: groupLabels.get(container.group) }),
          el("span", { class: "count-chip", text: `テスト ${model.placeTests(container).length}` }),
          el("span", { class: "spacer" }),
          pressable("button", { class: "mini-button", text: "折りたたむ" }, [], withoutSelecting(() => toggleGroup(container.group))),
        ]),
      ]), container);
      node.addEventListener("click", () => select({ kind: "place", id: container.id }));
      node.addEventListener("dblclick", () => toggleGroup(container.group));
      return node;
    };

    const unitNodeOf = (unit, view) => {
      const { model, lit, selected } = view;
      const testCount = model.placeTests(unit).length;
      const gapCount = model.placeGaps(unit).length;
      const isLit = lit.units.has(unit.id);
      const flags = {
        "is-picked": isLit,
        "has-gap": !isLit && state.showGaps && gapCount > 0,
        "is-dim": selected !== null && !isLit,
        "is-faint": selected === null && state.showGaps && gapCount === 0,
      };
      const isGroup = unit.kind === "group";
      const gapChip = gapCount > 0 ? [el("span", { class: "gap-chip", text: `未テスト ${gapCount}` })] : [];
      const groupBody = () => [
        el("div", { class: "node-row" }, [el("span", { class: "group-name", text: placeNameOf(unit) }), pressable("button", { class: "mini-button is-outlined", text: "展開" }, [], withoutSelecting(() => toggleGroup(unit.group)))]),
        el("div", { class: "node-row" }, [el("span", { class: "count-chip", text: `テスト ${testCount}` }), ...gapChip]),
      ];
      const boxBody = () => {
        const entry = entryAt.get(unit.path);
        const isFileName = state.naming === "file" || entry.conceptName === null;
        return [el("span", { class: classesOf("box-name", { "is-file-name": isFileName }), text: placeNameOf(unit) }), el("span", { class: classesOf("box-count", { "is-tested": testCount > 0 }), text: String(testCount) })];
      };
      const title = isGroup ? "ダブルクリックで展開" : `${unit.path} · テスト ${testCount} 件`;
      const node = placedAt(el("div", { class: classesOf(isGroup ? "graph-node is-group" : "graph-node is-box", flags), title, "data-unit": unit.id }, isGroup ? groupBody() : boxBody()), unit);
      node.addEventListener("click", () => select({ kind: "place", id: unit.id }));
      if (isGroup) node.addEventListener("dblclick", () => toggleGroup(unit.group));
      return node;
    };

    /** 線ごとの見え方。やりとりの線は、テストで確かめているか・抜けがあるかで色を変える。 */
    const edgeLookOf = (edge, view) => {
      const { model, lit, selected } = view;
      const isOn = lit.edges.has(edge.key);
      const gaps = hasMessages ? edge.items.filter(model.isGap) : [];
      const isCovered = hasMessages && edge.items.some((message) => model.coverage.get(message.id).length > 0);
      const isDim = selected !== null && !isOn;
      const isHovered = edge.key === graph.hoveredEdge();
      return { edge, isOn, gaps, isCovered, isDim, isHovered, isFaint: !isDim && !isOn && state.showGaps && gaps.length === 0 };
    };

    /** ラベルに並べるやりとり。選んだテストの線ならそのテストが確かめるもの、抜けを強調しているなら抜けだけ。 */
    const labelMessagesOf = (look, view) => {
      const sorted = look.edge.items.toSorted(byMessageKind);
      const isSelectedTestEdge = view.selected !== null && view.selected.kind === "test" && look.isOn;
      const isGapFocused = state.showGaps && look.gaps.length > 0;
      if (isSelectedTestEdge) return sorted.filter((message) => view.lit.messages.has(message.id));
      if (isGapFocused) return sorted.filter(view.model.isGap);
      return sorted;
    };

    /** 線のラベル。選んだ線・マウスが乗っている線・選んだテストが 3 件以下で通る線は、並べられるだけ並べて必ず置く。 */
    const labelOf = (look, view) => {
      const isPicked = isSameSelection(view.selected, { kind: "edge", id: look.edge.key });
      const litCount = look.edge.items.filter((message) => view.lit.messages.has(message.id)).length;
      const isImportant = isPicked || look.isHovered || (look.isOn && litCount <= 3);
      const listed = labelMessagesOf(look, view);
      const shown = listed.slice(0, isImportant ? LabelLimits.important : LabelLimits.other);
      const texts = labelTextsOf({ messages: shown, edge: look.edge, layout: view.model.layout, naming: state.naming });
      const more = listed.length - shown.length;
      const priority = isImportant ? 3 : look.isOn ? 2 : look.gaps.length > 0 ? 1 : 0;
      const allowance = isImportant ? Infinity : look.isOn ? 0.25 : 0;
      const size = labelSizeOf({ texts, more, padding: LabelPadding });
      return { look, isPicked, isImportant, shown, texts, more, candidate: { key: look.edge.key, bezier: look.edge.route.bezier, ...size, priority, allowance } };
    };

    const coverageTagOf = (message, model) => {
      const count = model.coverage.get(message.id).length;
      if (count > 0) return el("span", { class: "coverage-tag is-tested", text: `✓${count}` });
      if (model.isGap(message)) return el("span", { class: "coverage-tag is-gap", text: "未テスト" });
      return el("span", { class: "coverage-tag", text: "—" });
    };

    const renderGraph = (view) => {
      const { model } = view;
      const looks = model.edges.map((edge) => edgeLookOf(edge, view)).toSorted((a, b) => Number(a.isOn || a.isHovered) - Number(b.isOn || b.isHovered));
      const edgeNodes = looks.map((look) => {
        const flags = { "is-dependency": !hasMessages, "is-covered": look.isCovered, "is-gap": state.showGaps && look.gaps.length > 0 && !look.isOn, "is-on": look.isOn, "is-hover": look.isHovered, "is-dim": look.isDim, "is-faint": look.isFaint };
        const hit = hasMessages ? [Dom.svg("path", { class: "edge-hit", d: look.edge.route.path })] : [];
        const group = Dom.svg("g", { class: classesOf("edge", flags), ...(hasMessages ? { "data-edge": look.edge.key } : {}) }, [Dom.svg("path", { class: "edge-line", d: look.edge.route.path }), Dom.svg("path", { class: "edge-head", d: look.edge.route.head }), ...hit]);
        if (hasMessages) group.addEventListener("click", () => select({ kind: "edge", id: look.edge.key }));
        return group;
      });
      const svg = Dom.svg("svg", { class: "graph-edges", width: String(model.layout.width), height: String(model.layout.height) }, edgeNodes);
      const labels = hasMessages ? looks.map((look) => labelOf(look, view)) : [];
      const spots = GraphLayout.placeLabels({ candidates: labels.map((label) => label.candidate), obstacles: GraphLayout.obstaclesOf(model.layout) });
      const labelAt = new Map(labels.map((label) => [label.look.edge.key, label]));
      const labelNodes = spots.filter((spot) => spot.isPlaced).map((spot) => {
        const label = labelAt.get(spot.key);
        const chips = label.shown.map((message, index) => el("span", { class: classesOf("label-chip", { "is-code": state.naming === "file" }), "data-kind": message.kind }, [el("span", { text: label.texts[index] }), coverageTagOf(message, model)]));
        const more = label.more > 0 ? [el("span", { class: "label-more", text: `+${label.more} 件` })] : [];
        const flags = { "is-important": label.isImportant, "is-on": label.look.isOn, "is-picked": label.isPicked, "is-hover": label.look.isHovered, "is-dim": label.look.isDim, "is-faint": label.look.isFaint };
        const node = el("div", { class: classesOf("graph-label", flags), "data-edge": spot.key }, [...chips, ...more]);
        Object.assign(node.style, { left: `${spot.x}px`, top: `${spot.y}px` });
        node.addEventListener("click", () => select({ kind: "edge", id: spot.key }));
        return node;
      });
      const children = [...model.layout.containers.map((container) => containerNodeOf(container, view)), svg, ...model.layout.units.map((unit) => unitNodeOf(unit, view)), ...labelNodes];
      graph.show({ signature: signatureOf(state.grouping, model.layout), size: { width: model.layout.width, height: model.layout.height }, children });
    };

    const side = el("div", { class: "side" });
    const clearButton = () => pressable("button", { class: "mini-button", text: "選択解除" }, [], () => update({ selected: null }));

    const messageBodyOf = (message, model) => [
      el("span", { class: "message-chip" }, [kindChipOf(message.kind), el("span", { class: classesOf("message-name", { "is-code": state.naming === "file" }), text: messageNameOf(message) })]),
      el("span", { class: "message-route", text: `${endNameOf(model, message.from)} → ${endNameOf(model, message.to)}` }),
    ];

    /** やりとりのカード。図に線があれば、押すとその線を選ぶ。 */
    const gapCardOf = (message, model, isPressable) => {
      const key = edgeKeyBetween(model, message);
      const body = messageBodyOf(message, model);
      const isStatic = !isPressable || key === null;
      if (isStatic) return el("div", { class: "gap-card" }, body);
      return pressable("button", { class: "gap-card plain-button" }, body, () => select({ kind: "edge", id: key }));
    };

    const testCardOf = (test) => pressable("button", { class: "test-card plain-button" }, [
      el("span", { class: "test-name", text: test.name }),
      el("span", { class: "test-facts" }, [...test.techniques.map(techniqueChipOf), el("span", { class: "test-status", "data-status": test.status, text: TestStatuses[test.status].long })]),
    ], () => select({ kind: "test", id: test.id }));

    const overviewOf = (model) => {
      const countOf = (status) => tests.filter((test) => test.status === status).length;
      const isAlwaysCounted = (status) => status === "new" || status === "old" || status === "todo";
      const statuses = Object.keys(TestStatuses).filter((status) => isAlwaysCounted(status) || countOf(status) > 0);
      const head = el("div", { class: "side-block" }, [
        el("span", { class: "eyebrow", text: "テストの全体像" }),
        el("h2", { text: "このブランチで何を確かめたか" }),
        el("div", { class: "side-counts" }, statuses.map((status) => el("span", { class: `is-${status}` }, [`${TestStatuses[status].label} `, el("b", { text: String(countOf(status)) })]))),
      ]);
      if (explain === null) return [head, el("p", { class: "side-note", text: "解説が無いので、変更の地図にあるテストの追加・削除と、テストファイルの対象だけで組んでいます。左のテストを選ぶと、対象の箱が光ります。" })];
      const most = Math.max(1, ...Object.values(techniqueCounts));
      const bars = Object.entries(Techniques).map(([key, technique]) => {
        const fill = el("span", { class: "tech-bar-fill" });
        fill.style.width = `${(techniqueCounts[key] / most) * 100}%`;
        return pressable("button", { class: "tech-bar plain-button", "data-technique": key, title: "この観点で絞り込む" }, [
          el("span", { class: "tech-bar-line" }, [el("span", { class: "tech-bar-label" }, [el("span", { class: "swatch" }), technique.label]), el("span", { class: "tech-bar-track" }, [fill]), el("span", { class: "tech-bar-count", text: String(techniqueCounts[key]) })]),
          el("span", { class: "tech-bar-desc", text: technique.description }),
        ], () => update({ techniques: [key] }));
      });
      const gaps = messages.filter(model.isGap);
      const gapBlock = hasMessages ? [el("div", { class: "side-block" }, [
        eyebrowOf("テストがないやりとり", "このブランチで追加・変更したもの"),
        ...gaps.map((message) => gapCardOf(message, model, true)),
        ...(gaps.length === 0 ? [el("span", { class: "side-sub", text: "すべてテストされています。" })] : []),
      ])] : [];
      return [
        head,
        el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "観点ごとの内訳" }), ...bars]),
        ...gapBlock,
        el("p", { class: "side-note", text: "左のテストを選ぶと、確かめている範囲がマップ上で光ります。マップの箱やラベルを選ぶと、そこを確かめているテストが分かります。" }),
      ];
    };

    const valuesOf = (values) => {
      const columns = values.columns.length;
      const hasBoundary = values.rows.some((row) => row.boundary === true);
      const grid = el("div", { class: "values-grid" }, [
        ...values.columns.map((column) => el("span", { class: "values-head", text: column })),
        ...values.rows.flatMap((row) => row.cells.map((cell, index) => {
          const tag = row.boundary === true && index === 0 ? [el("span", { class: "boundary-tag", text: "境目" })] : [];
          return el("span", { class: classesOf("values-cell", { "is-first": index === 0, "is-boundary": row.boundary === true }) }, [prose("span", {}, cell), ...tag]);
        })),
      ]);
      grid.style.gridTemplateColumns = `repeat(${columns}, minmax(max-content, 1fr))`;
      return el("div", { class: "side-block" }, [eyebrowOf("試している値", hasBoundary ? "「境目」は境界値として選んだ値" : undefined), el("div", { class: "values" }, [grid])]);
    };

    /** 解説の無いテスト(地図の追加・削除)の対象。押すとその箱を選ぶ。 */
    const targetsOf = (test, model) => {
      const places = [...new Set(test.targets.map((path) => model.layout.unitOf.get(path)).filter((id) => id !== undefined))].map((id) => model.places.get(id));
      const rows = places.map((place) => pressable("button", { class: "test-card plain-button" }, [el("span", { class: "test-name", text: placeNameOf(place) })], () => select({ kind: "place", id: place.id })));
      return el("div", { class: "side-block" }, [eyebrowOf("テストの対象", `${test.targets.length} 件`), ...rows, ...(test.targets.length === 0 ? [el("span", { class: "side-sub", text: "地図に対象のファイルがありません。" })] : [])]);
    };

    const testDetailOf = (test, model) => {
      const suiteLabel = test.suite === null ? (test.file ?? "").split("/").pop() : test.suite.label;
      const pending = test.status === "todo" ? [el("span", { class: "pending", text: "○ まだ書かれていない" })] : [];
      const head = el("div", { class: "side-block" }, [
        el("div", { class: "side-head" }, [el("span", { class: "chip", text: suiteLabel }), el("span", { class: "chip", "data-status": test.status, text: TestStatuses[test.status].long }), ...pending, el("span", { class: "spacer" }), clearButton()]),
        el("h2", { text: test.name }),
        el("span", { class: "side-path", text: test.file ?? "" }),
      ]);
      if (test.test === null) {
        const reason = test.status === "removed" ? "このブランチで消したテストです。" : "解説に無いテストです。";
        return [head, el("p", { class: "side-sub", text: `${reason}変更の地図にある名前と、テストファイルの対象だけを出しています。` }), targetsOf(test, model)];
      }
      const detail = test.test;
      const covered = test.covers.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
      const values = detail.values === undefined ? [] : [valuesOf(detail.values)];
      const coverBlock = covered.length === 0 ? [] : [el("div", { class: "side-block" }, [
        eyebrowOf("確かめているやりとり", `${covered.length} 件`),
        ...covered.map((message, index) => {
          const key = edgeKeyBetween(model, message);
          const body = [el("span", { class: "message-row-n", text: String(index + 1) }), el("span", { class: "message-row-body" }, messageBodyOf(message, model))];
          return key === null ? el("div", { class: "message-row" }, body) : pressable("button", { class: "message-row plain-button" }, body, () => select({ kind: "edge", id: key }));
        }),
      ])];
      const code = detail.excerpt === undefined ? [] : excerptBlockOf(detail.excerpt, "テストコード");
      const commit = typeof detail.commit === "string" ? [commitLinkOf({ sha: detail.commit, label: "追加したコミット", commitAt: explained.commitAt, onPress: () => go.toCommit(detail.commit) })] : [];
      const mentions = ImpactTopics.mentionsOf(explained.impactTopics, detail.id);
      const mentionBlock = mentions.length === 0 ? [] : [el("div", { class: "side-block" }, [
        eyebrowOf("この状況を確かめている", `${mentions.length} 件`),
        ...mentions.map((mention) => jumpCardOf({
          name: mention.placeText ?? mention.topicLabel,
          tag: mention.placeText === null ? ScreenLabels.impact : mention.topicLabel,
          status: null,
          goText: `${ScreenLabels.impact}で見る`,
          title: "振る舞いの画面でこの状況を見る",
          onPress: () => go.toImpact(mention),
        })),
      ])];
      return [
        head,
        el("div", { class: "side-block" }, [
          el("span", { class: "eyebrow", text: "テストの観点" }),
          ...test.techniques.map((key) => el("div", { class: "tech-line" }, [techniqueChipOf(key), el("span", { class: "tech-line-desc", text: Techniques[key].description })])),
          prose("p", { class: "why" }, detail.why),
        ]),
        el("div", { class: "gwt" }, [["前提", detail.given], ["操作", detail.when], ["期待", detail.then]].flatMap(([key, text]) => [el("span", { class: "gwt-key", text: key }), prose("span", { class: "gwt-value" }, text)])),
        ...values,
        ...coverBlock,
        ...mentionBlock,
        ...code,
        ...commit,
      ];
    };

    /** 選んだ箱・線を確かめているテスト(未実装の提案も足す)と、テストの無いやりとり。 */
    const targetDetailOf = (selected, model) => {
      const isEdge = selected.kind === "edge";
      const edge = isEdge ? model.edgeAt.get(selected.id) : null;
      const place = isEdge ? null : model.places.get(selected.id);
      const touches = (test) => (isEdge ? touchesEdge(test, edge) : touchesPlace(test, place));
      const verified = isEdge ? [...new Set(edge.items.flatMap((message) => model.coverage.get(message.id)))] : model.placeTests(place);
      const proposed = tests.filter((test) => test.status === "todo" && touches(test) && !verified.includes(test));
      const listed = [...verified, ...proposed];
      const gaps = isEdge ? edge.items.filter(model.isGap) : model.placeGaps(place);
      const title = isEdge ? `${placeNameOf(model.places.get(edge.from))} ⇄ ${placeNameOf(model.places.get(edge.to))}` : placeNameOf(place);
      const kind = isEdge ? "つながり" : place.kind === "box" ? "要素" : "グループ";
      const sub = isEdge ? `${edge.items.length} 件のやりとり:${edge.items.map((message) => `〈${message.name}〉`).join("")}` : placeSubOf(place);
      return [
        el("div", { class: "side-block" }, [el("div", { class: "side-head" }, [el("span", { class: "chip", text: kind }), el("span", { class: "spacer" }), clearButton()]), el("h2", { text: title }), el("p", { class: "side-sub", text: sub })]),
        el("div", { class: "side-block" }, [eyebrowOf("ここを確かめているテスト", `${listed.length}`), ...listed.map(testCardOf), ...(listed.length === 0 ? [el("span", { class: "warn-text", text: "まだテストがありません。" })] : [])]),
        ...(gaps.length === 0 ? [] : [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "テストがないやりとり" }), ...gaps.map((message) => gapCardOf(message, model, false))])]),
      ];
    };

    /** 箱の補足。概念名で出しているならパス、ファイル名で出しているなら concept 名(無ければパス)。組なら中の数。 */
    const placeSubOf = (place) => {
      if (place.kind !== "box") return `${place.paths.length} 要素をまとめた箱`;
      const entry = entryAt.get(place.path);
      const isPathShown = state.naming === "concept" || entry.conceptName === null;
      return isPathShown ? entry.path : entry.conceptName;
    };

    const renderSide = (view) => {
      const { selected, model } = view;
      if (selected === null) side.replaceChildren(...overviewOf(model));
      else if (selected.kind === "test") side.replaceChildren(...testDetailOf(tests[selected.id], model));
      else side.replaceChildren(...targetDetailOf(selected, model));
      side.scrollTop = 0;
    };

    const render = () => {
      const model = modelOf(state);
      const selected = validSelectionOf(state.selected, model);
      const isNewTestSelection = selected !== null && selected.kind === "test" && !isSameSelection(selected, previous);
      const view = { model, selected, lit: litOf(model, selected) };
      state = { ...state, selected };
      previous = selected;
      lastView = view;
      renderControls();
      renderList(view);
      renderCanvasControls(view);
      renderGraph(view);
      renderSide(view);
      const row = isNewTestSelection ? listBody.querySelector(`[data-test="${selected.id}"]`) : null;
      if (row !== null) row.scrollIntoView({ block: "nearest" });
    };
    let previous = null;
    render();

    const gapControl = hasMessages ? [controlNodes.gaps] : [];
    return {
      summary: [],
      controls: [controlNodes.grouping, controlNodes.level, ...gapControl],
      tablist: null,
      left: panelOf("left", [listHead, listBody]),
      main: graph.element,
      right: panelOf("right", [side]),
      /**
       * 他の画面から、解説のテストを選んだ状態にする。選んでいても外さず、観点の絞り込みは解く(絞り込みの外のテストでも選べるように)。
       * @param explainTestId 解説のテストの id
       */
      showTest: (explainTestId) => update({ selected: { kind: "test", id: explained.tests.indexOf(explained.testAt.get(explainTestId)) }, techniques: [] }),
    };
  };

  const StatusLabels = { A: "追加", M: "変更", R: "移動", D: "削除" };
  const StatusTones = ["A", "M", "D"];
  /** 色分けの区分。移動したファイル(R。中身も変えていることがある)は変更の色にする。変更していなければ空。 */
  const toneOf = (status) => (status === "R" ? "M" : (status ?? ""));
  const Connections = Object.freeze({ Messages: "messages", Dependencies: "dependencies" });
  const ConnectionChoices = [
    { value: Connections.Messages, label: "やりとり", title: "何を受け渡ししているか(コマンド・クエリ・イベント)" },
    { value: Connections.Dependencies, label: "コード依存", title: "どのファイルがどれを参照しているか" },
  ];
  const ScopeModes = Object.freeze({ Dim: "dim", Hide: "hide" });
  const ScopeModeChoices = [{ value: ScopeModes.Dim, label: "薄く表示" }, { value: ScopeModes.Hide, label: "表示しない" }];
  const MessageKindFilters = [{ value: "all", label: "すべて" }, ...Object.entries(Vocabulary.messageKinds).map(([value, kind]) => ({ value, label: kind.label }))];
  // 構造マップの線のラベルの、文字の外側(余白・枠・追加の印)の幅。
  const MapLabelPadding = 30;
  // 1 つの線のラベルに並べるやりとりの数。選んだ線・流れで光らせた線・マウスが乗っている線と、選んだものに関わる 3 件以下の線は 6 件まで。
  const MapLabelLimits = { important: 6, other: 1 };
  // 線の太さ。まとめた依存・やりとりの件数 1 で 1.25px、1 件増えるごとに 0.4px 太らせ、2px 分で打ち止める。
  const EdgeWidth = { base: 1.25, perItem: 0.4, extra: 2, lit: 0.75 };
  const SequenceColumnWidth = 86;

  /** 変更したファイルの数を色の区分ごとに数える。 */
  const toneCountsOf = (entries) => Object.fromEntries(StatusTones.map((tone) => [tone, entries.filter((entry) => entry.changed && toneOf(entry.status) === tone).length]));
  const statusChipsOf = (entries) => {
    const counts = toneCountsOf(entries);
    return StatusTones.filter((tone) => counts[tone] > 0).map((tone) => el("span", { class: "status-chip", "data-tone": tone, text: `${StatusLabels[tone]} ${counts[tone]}` }));
  };
  /** いくつかのファイルをまとめた色。すべて追加なら追加、すべて削除なら削除、変更があれば変更、無ければ空。 */
  const toneOfAll = (entries) => {
    const changed = entries.filter((entry) => entry.changed).map((entry) => toneOf(entry.status));
    if (changed.length === 0) return "";
    const isUniform = changed.every((tone) => tone === changed[0]);
    return isUniform ? changed[0] : "M";
  };
  /**
   * 線にまとめた依存・やりとりの状態。すべて消えたものなら removed、追加を含めば added、変更を含めば changed、
   * それ以外は kept。依存は added / kept / removed、やりとりは added / changed / removed か省いたもの。
   */
  const edgeStatusOf = (items) => {
    if (items.every((item) => item.status === "removed")) return "removed";
    if (items.some((item) => item.status === "added")) return "added";
    return items.some((item) => item.status === "changed") ? "changed" : "kept";
  };
  const selectionKeyOf = (selected) => (selected === null ? "" : `${selected.kind}:${selected.id}`);
  const baseNameOf = (path) => path.split("/").pop();

  /**
   * ファイルの木。パスをフォルダごとに割り、フォルダは名前の順、ファイルはファイル名の順に並べる。
   * @param depth いま割っているフォルダの深さ(根は 0)
   * @returns `{dirs: [{name, prefix, node}], files, all}`(all はそのフォルダの下のすべてのファイル)
   */
  const treeOf = (entries, depth) => {
    const partsOf = (entry) => entry.path.split("/");
    const isHere = (entry) => partsOf(entry).length === depth + 1;
    const deeper = entries.filter((entry) => !isHere(entry));
    const names = [...new Set(deeper.map((entry) => partsOf(entry)[depth]))].sort();
    const dirs = names.map((name) => {
      const inside = deeper.filter((entry) => partsOf(entry)[depth] === name);
      return { name, prefix: `${partsOf(inside[0]).slice(0, depth + 1).join("/")}/`, node: treeOf(inside, depth + 1) };
    });
    const files = entries.filter(isHere).toSorted((a, b) => baseNameOf(a.path).localeCompare(baseNameOf(b.path)));
    return { dirs, files, all: entries };
  };

  /** 構造マップ。左にファイルの木、中に箱の図、右に概要か選んだものの詳しいところと、やりとりの流れを出す。 */
  const MapScreen = (explained) => {
    const { explain, lookup } = explained;
    const materials = graphMaterialsOf(explained);
    const { entryAt, graphGroups, groupLabels, groupings, messages } = materials;
    const flows = [...lookup.flows.values()];
    const hasMessages = messages.length > 0;
    const groupAt = new Map(Object.values(explained.groupings).flat().map((group) => [groupKeyOf(group), group]));
    const highlights = explain !== null && Array.isArray(explain.overview.highlights) ? explain.overview.highlights : [];
    const tree = treeOf(explained.entries, 0);

    let state = {
      ...initialGraphStateOf(materials, explained),
      connection: hasMessages ? Connections.Messages : Connections.Dependencies,
      selected: null,
      history: [],
      scope: null,
      scopeMode: ScopeModes.Dim,
      isFocused: false,
      isChangedOnly: false,
      closedDirs: [],
      isPopoverOpen: false,
      messageKind: "all",
      isChangedMessagesOnly: false,
      flow: null,
      step: null,
    };

    /** いまの状態から、図の配置と、図に出ているやりとり・依存と線を作る。他を表示しないときは、絞った組だけを開いて並べる。 */
    const modelOf = (current) => {
      const isHiding = current.scope !== null && current.scopeMode === ScopeModes.Hide;
      const allGroups = graphGroups[current.grouping];
      const groups = isHiding ? allGroups.filter((group) => group.id === current.scope) : allGroups;
      const opened = current.expanded[current.grouping];
      const expanded = isHiding ? [...new Set([...opened, current.scope])] : opened;
      const isMessageView = current.connection === Connections.Messages;
      const labelWidth = isMessageView ? widestLabelOf({ messages, naming: current.naming, padding: MapLabelPadding }) : 0;
      const layout = GraphLayout.create({ groups, links: explained.dependencies, expanded, room: graph.room(), labelWidth });
      const isShown = (path) => layout.unitOf.has(path);
      const shownMessages = messages.filter((message) => isShown(message.from) && isShown(message.to));
      const shownDependencies = explained.dependencies.filter((link) => isShown(link.from) && isShown(link.to));
      const links = isMessageView
        ? shownMessages.map((message) => ({ from: message.from, to: message.to, item: message, leads: message.kind !== "evt" }))
        : shownDependencies.map((link) => ({ from: link.from, to: link.to, item: link, leads: true }));
      const edges = GraphLayout.edgesOf(layout, links);
      return {
        layout,
        groups,
        isMessageView,
        messages: shownMessages,
        dependencies: shownDependencies,
        edges,
        edgeAt: new Map(edges.map((edge) => [edge.key, edge])),
        places: new Map([...layout.units, ...layout.containers].map((place) => [place.id, place])),
      };
    };

    const unitIdOf = (model, path) => model.layout.unitOf.get(path);
    const pathsOfGroup = (model, id) => {
      const group = model.groups.find((candidate) => candidate.id === id);
      return group === undefined ? [] : group.boxes.map((box) => box.path);
    };
    /** 選んだパスの外で、つながっているパス。やりとりで見ているならやりとり、依存で見ているなら依存でたどる。 */
    const relatedPathsOf = (model, paths) => {
      const links = model.isMessageView ? model.messages : model.dependencies;
      const across = links.filter((link) => paths.has(link.from) !== paths.has(link.to));
      return new Set(across.map((link) => (paths.has(link.from) ? link.to : link.from)));
    };

    /** 選んだものが含むパス・つながっているパスと、それぞれの単位。木だけのファイルを選んだときは図に何も出さない。 */
    const focusOf = (model, selected) => {
      const none = { paths: new Set(), related: new Set(), units: new Set(), relatedUnits: new Set(), edge: null, message: null, file: null };
      if (selected === null) return none;
      const unitsOf = (paths) => new Set([...paths].map((path) => unitIdOf(model, path)).filter((id) => id !== undefined));
      switch (selected.kind) {
        case "file":
          return { ...none, file: entryAt.get(selected.id) };
        case "message": {
          const message = lookup.messages.get(selected.id);
          const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
          const edge = ends[0] === ends[1] ? null : GraphLayout.edgeKeyOf(ends[0], ends[1]);
          return { ...none, paths: new Set([message.from, message.to]), units: new Set(ends), edge, message };
        }
        case "edge": {
          const edge = model.edgeAt.get(selected.id);
          const paths = [edge.from, edge.to].flatMap((id) => model.places.get(id).paths);
          return { ...none, paths: new Set(paths), units: new Set([edge.from, edge.to]), edge: edge.key };
        }
        case "box":
        case "group": {
          const paths = new Set(selected.kind === "box" ? [selected.id] : pathsOfGroup(model, selected.id));
          const related = relatedPathsOf(model, paths);
          const units = unitsOf(paths);
          return { ...none, paths, related, units, relatedUnits: new Set([...unitsOf(related)].filter((id) => !units.has(id))) };
        }
      }
    };

    /** 配置が変わって、選んだものが図から消えたら選択を外す。 */
    const validSelectionOf = (selected, model) => {
      if (selected === null) return null;
      switch (selected.kind) {
        case "file":
          return selected;
        case "message":
          return model.messages.some((message) => message.id === selected.id) ? selected : null;
        case "edge":
          return model.edgeAt.has(selected.id) ? selected : null;
        case "box":
          return model.layout.unitOf.has(selected.id) ? selected : null;
        case "group":
          return model.groups.some((group) => group.id === selected.id && group.boxes.length > 0) ? selected : null;
      }
    };

    /** 選んだものが関わる流れと、選んでいる流れのシーケンス(参加者と行)。 */
    const sequenceOf = (model, focus, selected) => {
      const touches = (message) => {
        if (focus.message !== null) return message.id === focus.message.id;
        const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
        if (focus.edge !== null) return ends.every((id) => id !== undefined) && GraphLayout.edgeKeyOf(ends[0], ends[1]) === focus.edge;
        return focus.paths.has(message.from) || focus.paths.has(message.to);
      };
      const stepsOf = (flow) => flow.steps.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
      const isNarrowed = selected !== null;
      const relevant = isNarrowed ? flows.filter((flow) => stepsOf(flow).some(touches)) : flows;
      const flow = relevant.find((candidate) => candidate.id === state.flow) ?? relevant[0] ?? null;
      if (flow === null) return { relevant, flow, parts: [], rows: [] };
      const rows = stepsOf(flow).reduce((sofar, message) => {
        const from = unitIdOf(model, message.from);
        const to = unitIdOf(model, message.to);
        const isOffGraph = from === undefined || to === undefined;
        if (isOffGraph) return sofar;
        const last = sofar[sofar.length - 1];
        const extendsSelf = from === to && last !== undefined && last.kind === "self" && last.unit === from;
        if (extendsSelf) return [...sofar.slice(0, -1), { ...last, messages: [...last.messages, message] }];
        return [...sofar, from === to ? { kind: "self", unit: from, messages: [message] } : { kind: "message", from, to, message }];
      }, []);
      const parts = [...new Set(rows.flatMap((row) => (row.kind === "self" ? [row.unit] : [row.from, row.to])))];
      return { relevant, flow, parts, rows };
    };

    /** シーケンスで押した行が、図で光らせる単位と線。やりとりの行でなければ null。 */
    const stepOf = (model, sequence) => {
      const row = state.step === null ? undefined : sequence.rows[state.step];
      const isMessageRow = row !== undefined && row.kind === "message";
      if (!isMessageRow) return null;
      const paths = [row.from, row.to].flatMap((id) => model.places.get(id).paths);
      return { units: new Set([row.from, row.to]), key: GraphLayout.edgeKeyOf(row.from, row.to), paths: new Set(paths) };
    };

    const update = (change) => {
      state = { ...state, ...change };
