[workspace]
resolver = "2"
members = ["crates/core"]

# pdfmod の Rust 実装。外部 crate には一切依存しない（std のみ）方針。
# 依存を追加しないこと自体が設計制約のため、[workspace.dependencies] は空のままにする。

# const fn は const 文脈（定数定義・配列長など）で実際に必要になった時点で個別に付与する。
# 予防的な一括 const 化はしない方針のため、この lint は明示的に allow する。
# 将来 lint グループ（例: nursery / pedantic）を有効化する場合は、グループ側に
# priority = -1 を指定し、この個別 allow が優先される状態を維持すること。
# 新規メンバー crate を追加する際は、その crate の Cargo.toml に
# [lints] workspace = true を指定すること（指定しないとこの設定が適用されない）。
#
# use_self: impl ブロック内の自己型参照は常に `Self` に統一する（#389）。
# 型名のべた書きと `Self` がファイル単位・impl 単位で混在していたため deny で固定する。
# `Self` に寄せることで型のリネーム時に impl 内へ差分が波及しない利点もある。
# 本 lint は nursery グループだが、グループ全体ではなく個別に 1 つだけ有効化しているため
# priority の指定は不要（上記の priority = -1 が必要になるのはグループ有効化時のみ）。
# 逆方向 From（例: `impl From<ByteOffset> for u64`）では `Self` が primitive に解決されるが、
# 例外を作らず統一する方針。どうしても型名を明示したい箇所は #[allow(clippy::use_self)] で個別に逸脱する。
[workspace.lints.clippy]
missing_const_for_fn = "allow"
use_self = "deny"
