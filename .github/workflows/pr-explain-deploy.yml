name: PR Explain Deploy

on:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: [PR Explain]
    types: [completed]
  workflow_dispatch:

permissions: {}

# サイト全体で直列化する。ロックを取った後に最新 gh-pages を取得し、古い版への巻き戻りを防ぐ。
concurrency:
  group: github-pages-site
  cancel-in-progress: false

jobs:
  site:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      exists: ${{ steps.branch.outputs.exists }}
    steps:
      - name: Check published branch
        id: branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            try {
              await github.rest.git.getRef({ ...context.repo, ref: 'heads/gh-pages' });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.setOutput('exists', 'false');
              await core.summary.addRaw('gh-pages は未作成です。導入後のPR作成・push・reopenで初回の解説を生成すると、自動作成されます。').write();
              return;
            }
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              core.setOutput('exists', 'false');
              await core.summary.addRaw('ブランチからの Pages 公開を使用中です。pages build and deployment 完了後に PR Explain Comment がリンクを投稿します。').write();
              return;
            }
            core.setOutput('exists', 'true');

  deploy:
    needs: site
    if: needs.site.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # workflow_run の artifact や PR のコードを使わず、今の公開用ブランチを読む。
      - name: Checkout latest site after lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # 実行するコードは信頼する既定ブランチから取得する。site はデータとしてのみ読む。
      - name: Checkout trusted comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Comment published PR links
        if: success() && steps.deployment.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_EXPLAIN_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/scripts/comment-pr-explain.cjs`)({ github, context });
